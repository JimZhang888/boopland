<!DOCTYPE html>
<html lang="zh-CN" data-i18n-scope="ropeGarden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <title data-i18n="pageTitle">割绳子 · Boopland</title>
  <link rel="icon" type="image/svg+xml" href="./cover.svg">
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="game-shell">
    <header class="topbar">
      <a class="back" href="../../games.html" data-i18n-label="common.back"><span aria-hidden="true">↶</span><span data-i18n="common.back">返回大厅</span></a>
      <div class="heading"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="9" cy="23" r="5"/><circle cx="23" cy="23" r="5"/><path d="m12 19 13-15M20 19 7 4m9 10v1"/></svg><h1 data-i18n="name">割绳子</h1><span class="tagline" data-i18n="tagline">把甜蜜，送到嘴边。</span></div>
      <div class="tools"><button class="icon-button" id="sound" type="button" aria-pressed="false" data-i18n-label="soundOn"><span aria-hidden="true">♪</span><i id="mute" aria-hidden="true"></i></button><button class="icon-button" id="help" type="button" data-i18n-label="help"><span aria-hidden="true">?</span></button></div>
    </header>
    <section class="workspace">
      <div class="play-sheet">
        <header class="sheet-header"><div class="level-title"><span class="page-number" id="page-number">01</span><div><span class="eyebrow" data-i18n="chapter">糖果花园 · 十二页小冒险</span><h2 id="level-name"></h2></div></div><div class="star-counter" id="star-counter" role="img" aria-label="0 / 3"><span>☆</span><span>☆</span><span>☆</span></div></header>
        <div class="stage" id="stage">
          <canvas id="game" tabindex="0" role="img" data-i18n-label="canvasLabel" aria-describedby="hint"></canvas>
          <div class="overlay" id="overlay" hidden><section class="result-paper" aria-labelledby="result-title" role="region"><div class="result-mark" id="result-mark" aria-hidden="true">✿</div><p class="eyebrow" id="result-kicker"></p><h2 id="result-title"></h2><p class="result-stars" id="result-stars" aria-hidden="true"></p><p id="result-message"></p><div class="result-actions"><button class="primary" id="result-main" type="button"></button><button id="result-retry" type="button" data-i18n="retry">再试一次</button></div></section></div>
        </div>
        <div class="sheet-footer"><span class="hint-mark" aria-hidden="true">✂</span><p id="hint" aria-live="polite"></p><span class="page-total" id="page-total">01 / 12</span></div>
      </div>
      <aside class="desk">
        <section class="field-note"><span class="eyebrow" data-i18n="noteTitle">今日份的小甜蜜</span><svg class="candy-sketch" viewBox="0 0 200 125" aria-hidden="true"><path d="m52 52-24-12 4 27 24-3m91-10 24-13-3 29-26-5" fill="#d9b4a1"/><path d="M55 46q40-18 86 0l7 32q-44 17-96-1Z" fill="#e5c7b7"/><path d="m52 52-24-12 4 27 24-3m91-10 24-13-3 29-26-5M55 46q40-18 86 0l7 32q-44 17-96-1ZM62 45l-4 34m75-35 8 35m-58-36-9 39m39-40-9 42M18 89q13 7 28 2m112-63 9-8m13 13 10-3M92 20l5-9 5 9 10 2-8 7 1 10-8-5-9 5 2-10-8-7Z" fill="none"/><path d="M74 104q25 8 51 0" stroke-dasharray="3 5"/></svg><h3 data-i18n="mission">小兔子在等一颗糖。</h3><p data-i18n="intro">剪一剪，晃一晃。沿途拾起星星，让糖果落进小兔子的嘴里。</p><div class="best-line"><span data-i18n="best">本关最佳</span><strong id="best-stars">—</strong></div></section>
        <div class="manual-area"><div class="manual-heading"><span data-i18n="cutLabel">点编号，也能剪绳</span><span aria-hidden="true">✂</span></div><div class="rope-buttons" id="rope-buttons"></div><button class="bubble-button" id="pop-bubble" type="button" data-i18n="popBubble" hidden>戳破泡泡</button></div>
        <button class="primary play-button" id="play" type="button"><span id="play-label" data-i18n="start">开始这一关</span><span id="play-icon" aria-hidden="true">▷</span></button>
        <div class="desk-actions"><button id="levels" type="button"><span aria-hidden="true">▦</span><span data-i18n="levels">关卡手记</span><small id="total-stars">0 / 36</small></button><button id="restart" class="icon-button" type="button" data-i18n-label="restart"><span aria-hidden="true">↻</span></button></div>
        <p class="key-note" data-i18n="keyNote">1–3 剪绳 · 空格暂停 · R 重来</p>
      </aside>
    </section>
    <footer class="page-footer"><span class="brand">boopland<span>.</span></span><span class="footer-note" data-i18n="footer">一点点耐心，一口小甜蜜。</span><span id="save-note" data-i18n="saved">星星会被好好收藏</span></footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"><header class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" type="button" data-i18n-label="close">×</button></header><div id="help-content" hidden><ol><li data-i18n="helpCut"></li><li data-i18n="helpGoal"></li><li data-i18n="helpBubble"></li><li data-i18n="helpDanger"></li><li data-i18n="helpKeys"></li></ol><p class="dialog-note" data-i18n="helpSave"></p></div><div id="levels-content" hidden><p class="dialog-note" data-i18n="levelsIntro"></p><div id="level-grid"></div></div></dialog>
  <noscript>请启用 JavaScript 来玩割绳子。 / Please enable JavaScript to play.</noscript>
  <script src="../../i18n.js"></script>
  <script src="./translations.js"></script>
  <script src="./engine.js"></script>
  <script src="./scene.js"></script>
  <script src="./game.js"></script>
</body>
</html>
