<!DOCTYPE html>
<html lang="zh-CN" data-i18n-scope="clockwork">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <meta name="description" content="与小机器人一起探索发条小镇，组合零件、修复机械，让钟楼的光重新亮起。" data-i18n-content="description">
  <title data-i18n="pageTitle">发条小镇 · Boopland</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="game-shell">
    <header class="topbar">
      <a class="back" href="../../games.html" data-i18n-label="common.back"><span aria-hidden="true">←</span><span data-i18n="common.back">返回大厅</span></a>
      <h1><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m13 3 6 0 1 5 4 2 4-1 3 5-4 3v4l2 4-5 3-3-3h-5l-3 3-5-3 2-4v-4l-4-3 3-5 4 1 4-2z"/><circle cx="17" cy="17" r="5"/></svg><span data-i18n="name">发条小镇</span><small>CLOCKWORK TOWN</small></h1>
      <div class="tools">
        <button id="sound" type="button" class="icon-button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6m0-6-5 6"/></svg></button>
        <button id="help" type="button" class="icon-button" data-i18n-label="help" data-i18n-title="help">?</button>
        <button id="restart" type="button" class="icon-button" data-i18n-label="restart" data-i18n-title="restart">↻</button>
      </div>
    </header>
    <main class="adventure">
      <section class="play-sheet" aria-labelledby="room-title">
        <div class="room-heading">
          <div><span id="chapter" class="eyebrow"></span><h2 id="room-title"></h2></div>
          <div class="room-actions">
            <button id="notebook" type="button" class="notebook-toggle" data-i18n-label="notebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM3 7h4M3 12h4M3 17h4M10 8h5M10 12h5"/></svg></button>
            <span class="room-number" id="room-number" aria-hidden="true">01 — 03</span>
          </div>
        </div>
        <div class="stage" id="stage">
          <div id="scene-frame" class="scene-frame">
            <svg id="scene" viewBox="0 0 1000 620" aria-hidden="true"></svg>
            <div id="hotspots" class="hotspots" role="group" data-i18n-label="explore"></div>
            <div id="object-label" class="object-label" aria-hidden="true"></div>
          </div>
        </div>
        <div class="scene-caption"><span class="speech-mark" aria-hidden="true">“</span><p id="status" role="status" aria-live="polite" aria-atomic="true"></p></div>
        <nav class="scene-nav" data-i18n-label="locations">
          <button id="previous-room" type="button"><span aria-hidden="true">←</span><span id="previous-label"></span></button>
          <button id="posture" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h8v9H8zM10 4l2-2 2 2M12 2v5M10 20l2 2 2-2M12 17v5"/></svg><span id="posture-label"></span></button>
          <button id="next-room" type="button"><span id="next-label"></span><span aria-hidden="true">→</span></button>
        </nav>
      </section>
      <aside class="field-notes" data-i18n-label="notebook">
        <div class="note-top"><span class="eyebrow" data-i18n="journal">A LITTLE FIELD JOURNAL</span><span class="note-star" aria-hidden="true">✳</span></div>
        <p class="note-title" data-i18n="noteTitle">让停下的时光，<br>再走一小步。</p>
        <div class="objective"><span class="small-label" data-i18n="currentGoal">眼下的小目标</span><p id="objective"></p></div>
        <ol id="milestones" class="milestones"></ol>
        <div class="notebook-sketch" id="notebook-sketch" aria-hidden="true"></div>
        <button id="clue-note" type="button" class="clue-note" hidden><span data-i18n="savedClue">记下的线索</span><strong>Ⅱ · Ⅳ · Ⅰ</strong><span aria-hidden="true">↗</span></button>
        <div class="hint-block"><button id="hint" class="hint-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16c0-3-3-3-3-7a7 7 0 0 1 14 0c0 4-3 4-3 7zM9 19h6M10 22h4"/></svg><span data-i18n="hint">给我一点灵感</span><span aria-hidden="true">↗</span></button><p data-i18n="noRush">没有倒计时，慢慢发现就好。</p></div>
      </aside>
    </main>
    <footer class="inventory-bar">
      <div class="inventory-heading"><span class="eyebrow" data-i18n="pocket">口袋里的发现</span><span id="inventory-instruction"></span></div>
      <div id="inventory" class="inventory" role="group" data-i18n-label="inventory"></div>
      <button id="mobile-hint" class="mobile-hint icon-button" type="button" data-i18n-label="hint">✧</button>
    </footer>
    <div class="bottom-line"><span id="save-status" data-i18n="saved">旅程会自动记下</span><span data-i18n="footer">旧零件，也藏着新的可能。</span><span aria-hidden="true">BOOPLAND · A SMALL ADVENTURE</span></div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading"><div><span id="dialog-kicker" class="eyebrow"></span><h2 id="dialog-title"></h2></div><button id="close-dialog" class="icon-button" type="button" data-i18n-label="close">×</button></div>
    <div id="dialog-content"></div>
    <div class="dialog-footer"><a href="../../games.html" data-i18n="common.back">返回大厅</a><span data-i18n="noRush">没有倒计时，慢慢发现就好。</span></div>
  </dialog>
  <noscript>请开启 JavaScript 以游玩。 / Please enable JavaScript to play.</noscript>
  <script src="../../i18n.js"></script>
  <script src="./translations.js"></script>
  <script src="./engine.js"></script>
  <script src="./art.js"></script>
  <script src="./game.js"></script>
</body>
</html>
