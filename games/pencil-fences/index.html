<!doctype html>
<html lang="zh-CN" data-i18n-scope="pencil-fences">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title data-i18n="pencil-fences.title">一笔围栏</title>
  <link rel="icon" href="./cover.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
  <script src="../../i18n.js"></script>
  <script defer src="./locales.js"></script>
  <script defer src="./maps.js"></script>
  <script defer src="./puzzle.js"></script>
  <script defer src="./game.js"></script>
</head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m10 5-7 7 7 7m-7-7h18"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.3 9a2.8 2.8 0 0 1 5.5.6c0 2-2.8 2.2-2.8 4.2m0 3h.02"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m2.5 5 6-2 7 2.5L21.5 3v16l-6 2.5-7-2.5-6 2Zm6-2v16m7-13.5v16"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-fence" viewBox="0 0 24 24"><path d="M3 17.8 17 3.7q1-1.1 2.2.1l1.3 1.4q1.2 1.1 0 2.3L6.4 21l-4.4 1Zm.1-.1 3.4 3.2m7.7-14.4 3.2 3.3M6 18l8.4-8.7"/></symbol>
    <symbol id="i-cross" viewBox="0 0 24 24"><path d="m5 5 14 15M19 4 5 19"/></symbol>
    <symbol id="i-erase" viewBox="0 0 24 24"><path d="m3.5 13.8 10-10.6q.9-.9 1.7 0l6 5.7q.9.8 0 1.8L11 21H9l-5.5-5.5q-.8-.8 0-1.7ZM8.2 9l7.3 7.2M10 21h11"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="m8 5-5 5 5 5m-5-5h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M3 12h18m-7-7 7 7-7 7"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 19.5q-2.5-1.5-2.5-7.2 0-7.5 6.5-8.7 8-2 11 4 3.3 6.8-2 10.8-3 2.2-8.2 1.3L5 22Z"/><path d="M11.8 7v6m.1 3h.1"/></symbol>
    <symbol id="i-brand" viewBox="0 0 48 40"><g stroke="#725e43" stroke-width="1.7" fill="#c9b58c"><path d="m3 21 40-9 .7 4L4 26ZM5 29l39-9 .6 3.8L5 33Z"/><path d="m9 36-1-23 3-4 3.1 3 1 23Zm14-3-.6-24 2.6-3.6L28 8l1 24Zm14-3-.6-23 2.5-4L42 6l.9 23Z"/></g><path d="m3 37 3-7m0 7 2-4m22 1 4-6m-3 7 3-2" fill="none" stroke="#74835d" stroke-width="1.5"/></symbol>
    <pattern id="furrow" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(26)"><path d="M1 0v9" stroke="#83845e" stroke-width=".75" opacity=".13"/></pattern>
    <pattern id="stubble" patternUnits="userSpaceOnUse" width="18" height="16"><path d="m5 8 1-2m8 9 1-2" stroke="#867953" stroke-width=".8" opacity=".17"/></pattern>
    <symbol id="crop-radish" viewBox="0 0 50 44"><g stroke="#86755e" stroke-width="1.5" stroke-linejoin="round"><path d="M19 18q9-7 15 2 1 6-8 12l-7 5 1-7q-6-7-1-12Z" fill="#cda996"/><path d="m19 37-2 4m5-15 3 2m4-8 3 1" fill="none"/><path d="M27 17Q13 10 17 6q8-2 12 11Q25-2 31 3q7 5 0 15 6-14 14-11 1 6-14 12" fill="#a7b68d" stroke="#718464"/></g></symbol>
    <symbol id="crop-brook" viewBox="0 0 50 44"><g fill="none" stroke="#77866f" stroke-width="1.6"><path d="M9 34q6-2 12 0t12 0t10 0M6 39q6-3 13 0m9-10q-3-15-9-20m9 20q0-19 5-23m-4 23 9-14M17 30 9 19"/><path d="m16 7 5 8m11-11-2 8" stroke="#a38c64" stroke-width="4"/></g></symbol>
    <symbol id="crop-apple" viewBox="0 0 50 44"><g stroke="#84765d" stroke-width="1.5"><path d="M25 17q-10-8-15 1-5 12 7 18 4 2 8-1 5 4 10-1 11-12 4-17-5-5-14 0Z" fill="#ceaa88"/><path d="M25 17q-1-8 3-12m-1 8q6-12 15-7-3 9-15 7" fill="#b2ba93"/><path d="M15 23q0-5 4-5" stroke="#f0d9b0" fill="none"/></g></symbol>
    <symbol id="crop-windmill" viewBox="0 0 50 44"><g fill="#d3bc89" stroke="#918261" stroke-width="1.45"><path d="M12 39 31 7m-11 20q-11-2-8-12 7 3 8 12Zm3-5q-9-2-6-12 7 4 6 12Zm4-7q-5-6 0-13 5 6 0 13Zm-8 15q12 2 14-8-9-1-14 8Zm5-9q10 2 15-8-9-1-15 8Zm4-8q11 0 10-9-8 1-10 9Z"/></g></symbol>
    <symbol id="crop-rice" viewBox="0 0 50 44"><g fill="none" stroke="#7b8d6a" stroke-width="1.6"><path d="M16 32Q11 15 7 13q10 4 12 18-1-18 5-25-3 14-3 25 4-13 9-16m3 14q1-12 7-17m-7 17q-1-10-5-14"/><path d="M5 34q6 2 13 0t13 0t13-1m-32 5 10-1" stroke="#94a6a0"/></g></symbol>
    <symbol id="crop-hill" viewBox="0 0 50 44"><g stroke="#7e8b71" stroke-width="1.5"><path d="m3 33 12-17 6 7L31 7l16 26Z" fill="#bbc4a5"/><path d="m12 28 3-4 4 2m6-6 7-6 4 7m-15 8 10-9 5 4" fill="none"/></g></symbol>
  </defs>
</svg>
<main class="shell">
  <header class="mast">
    <div class="brand"><svg aria-hidden="true" viewBox="0 0 48 40"><use href="#i-brand"/></svg><h1 data-i18n="pencil-fences.title">一笔围栏</h1></div>
    <nav>
      <button id="help" class="quiet" data-i18n-label="pencil-fences.help"><svg class="icon"><use href="#i-help"/></svg><span data-i18n="pencil-fences.help">玩法</span></button>
      <span class="divider"></span>
      <a class="quiet" href="../../games.html" data-i18n-label="common.back"><svg class="icon"><use href="#i-back"/></svg><span data-i18n="common.back">返回大厅</span></a>
    </nav>
  </header>
  <div class="workbench">
    <section class="sheet" aria-labelledby="map-name">
      <div class="sheet-head">
        <div class="caption"><p id="sheet-no"></p><h2 id="map-name"></h2></div>
        <button id="maps" class="outline"><svg class="icon"><use href="#i-map"/></svg><span data-i18n="pencil-fences.maps">田图册</span><svg class="icon mini"><use href="#i-down"/></svg></button>
      </div>
      <div class="map-stage" id="stage">
        <div class="compass" aria-hidden="true"><svg viewBox="0 0 36 50"><path d="M18 13 25 40l-7-6-7 6Z" fill="#f3eeda" stroke="#8a8c75"/><path d="m18 13 0 21-7 6Z" fill="#838971"/><path d="M15 9V2l6 7V2" fill="none" stroke="#727961" stroke-width="1.4"/></svg></div>
        <svg id="board" role="group" data-i18n-label="pencil-fences.board"></svg>
        <span class="scale" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </div>
      <footer class="sheet-foot">
        <span class="meter-label" data-i18n="pencil-fences.matched">吻合线索</span>
        <span class="meter" aria-hidden="true"><i id="meter-fill"></i></span>
        <strong id="fraction"></strong>
      </footer>
    </section>
    <aside class="toolbox" data-i18n-label="pencil-fences.tools">
      <figure class="postcard" aria-hidden="true"><img src="./cover.svg" alt=""></figure>
      <h2 class="tool-heading" data-i18n="pencil-fences.tools">绘图工具</h2>
      <div class="tools">
        <button class="tool" data-tool="1"><svg class="icon"><use href="#i-fence"/></svg><span data-i18n="pencil-fences.fence">画围栏</span><kbd>1</kbd></button>
        <button class="tool" data-tool="2"><svg class="icon"><use href="#i-cross"/></svg><span data-i18n="pencil-fences.cross">打叉</span><kbd>2</kbd></button>
        <button class="tool" data-tool="0"><svg class="icon"><use href="#i-erase"/></svg><span data-i18n="pencil-fences.erase">擦除</span><kbd>3</kbd></button>
      </div>
      <button class="undo" id="undo" disabled><svg class="icon"><use href="#i-undo"/></svg><span data-i18n="pencil-fences.undo">撤销</span></button>
    </aside>
    <div class="status" role="status" aria-live="polite" aria-atomic="true"><svg class="icon"><use id="status-icon" href="#i-fence"/></svg><span id="status-text"></span><button id="next" hidden><span></span><svg class="icon"><use href="#i-next"/></svg></button></div>
  </div>
</main>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" class="icon-btn" data-i18n-label="pencil-fences.close"><svg class="icon"><use href="#i-close"/></svg></button></div>
  <div id="map-list"></div>
  <button id="reset" class="undo" hidden><svg class="icon"><use href="#i-erase"/></svg><span data-i18n="pencil-fences.reset">重画当前田图</span></button>
  <div id="guide">
    <figure class="example"><svg viewBox="0 0 168 83" aria-hidden="true"><rect x="52" y="10" width="63" height="63" fill="#e9e7ce"/><path d="M52 10h63v63H52Z" fill="none" stroke="#a7a993" stroke-dasharray="3 4"/><path d="M53 73 52 10l63 .5" fill="none" stroke="#536e52" stroke-width="5" stroke-linecap="round"/><g fill="#555e48"><circle cx="52" cy="10" r="3"/><circle cx="115" cy="10" r="3"/><circle cx="115" cy="73" r="3"/><circle cx="52" cy="73" r="3"/></g><text x="84" y="53" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#44523e">2</text></svg></figure>
    <p data-i18n="pencil-fences.rule1"></p><p data-i18n="pencil-fences.rule2"></p><p data-i18n="pencil-fences.rule3"></p><p class="keyboard-note" data-i18n="pencil-fences.keys"></p>
  </div>
</dialog>
</body></html>
