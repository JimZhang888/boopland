<!doctype html>
<html lang="zh-CN" data-i18n-scope="clockmakers-bench">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title data-i18n="clockmakers-bench.title">机械钟表铺</title>
  <link rel="icon" type="image/svg+xml" href="cover.svg">
  <link rel="stylesheet" href="bench.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
<svg class="sprites" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m11 5-7 7 7 7M4 12h16"/></symbol>
  <symbol id="i-orders" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v16l-2-1-2 1-3-1-3 1-3-1V3Zm3 5h7M9 12h7m-7 4h4"/></symbol>
  <symbol id="i-bench" viewBox="0 0 24 24"><path d="M3 8h18v5H3zM5 13v7m14-7v7M6 8V5m12 3V5M4 5h4m8 0h4"/></symbol>
  <symbol id="i-tray" viewBox="0 0 24 24"><path d="m4 8 3-4h10l3 4 1 11H3L4 8Zm0 1h5l1 3h4l1-3h5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16m-12 0 1 13h6l1-13m-6 3 .5 7m3-7-.5 7M9 7V4h6v3"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4V6Zm12 1v2m0 2v2m0 2v2"/></symbol>
  <symbol id="i-winder" viewBox="0 0 24 24"><circle cx="9" cy="12" r="5"/><circle cx="9" cy="12" r="1.5"/><path d="m12 8 5-5m0 0 4 4-2 2m-3-3 2 2"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="m12 14-1-6m1 6 4-2M10 2h4"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 12 8-12 8Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3v14H7zm7 0h3v14h-3z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M3 12h17m-7-7 7 7-7 7"/></symbol>
</defs></svg>
<div class="shell">
<header class="mast">
  <a class="back" href="../../games.html" data-i18n-label="common.back"><svg aria-hidden="true"><use href="#i-back"/></svg><span data-i18n="common.back">返回大厅</span></a>
  <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 11c-6-8 8-15 10-5 0 2-1 4-3 5m-7 2 8-2M19 5l6-1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="23" cy="26" r="16" fill="#d7c59a" stroke="currentColor" stroke-width="1.7"/><circle cx="23" cy="26" r="12.8" fill="#f7f1dd" stroke="currentColor"/><path d="m23 26-2-8m2 8 7-3m-7-8v2m12 9h-2m-10 12v-2m-12-10h2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="23" cy="26" r="1.7" fill="currentColor"/></svg><h1 data-i18n="clockmakers-bench.title">机械钟表铺</h1></div>
  <nav><button id="orders" data-i18n-label="clockmakers-bench.choose"><svg aria-hidden="true"><use href="#i-orders"/></svg><span id="completed"></span></button><button id="help" class="help" data-i18n-label="clockmakers-bench.helpLabel">?</button></nav>
</header>
<main class="worktop">
  <section class="stage" data-i18n-label="clockmakers-bench.bench">
    <div class="stage-heading"><svg><use href="#i-bench"/></svg><span data-i18n="clockmakers-bench.bench">工作台</span></div><span class="sheetNo" id="figure" aria-hidden="true"></span>
    <div class="ruler-top" aria-hidden="true"></div><div class="ruler-left" aria-hidden="true"></div>
    <svg id="drawing" viewBox="0 -18 510 422" xmlns="http://www.w3.org/2000/svg" role="group" data-i18n-label="clockmakers-bench.assembly"></svg>
    <div class="stage-foot"><div class="legend"><span><i class="drive-dot"></i><b data-i18n="clockmakers-bench.driver">主动轮</b></span><span><i class="hand-mark"></i><b data-i18n="clockmakers-bench.hand">指针</b></span></div><span class="scale" aria-hidden="true"></span></div>
  </section>
  <section class="ticket">
    <div class="ticket-head"><span><svg aria-hidden="true"><use href="#i-ticket"/></svg><span data-i18n="clockmakers-bench.orders">维修单</span></span><b id="serial"></b></div>
    <h2 id="orderName"></h2>
    <p class="brief" id="brief"></p>
    <div class="spec" data-i18n-label="clockmakers-bench.request">
      <div><span><svg><use href="#i-winder"/></svg><b data-i18n="clockmakers-bench.driver">主动轮</b></span><strong id="driveGoal"></strong><small id="driveDir"></small></div>
      <div><span><svg><use href="#i-hand"/></svg><b data-i18n="clockmakers-bench.hand">指针</b></span><strong id="handGoal"></strong><small id="handDir"></small></div>
    </div>
  </section>
  <section class="tray">
    <div class="tray-head"><h2><svg aria-hidden="true"><use href="#i-tray"/></svg><span data-i18n="clockmakers-bench.tray">零件盘</span></h2><div id="shafts"></div></div>
    <p id="trayHint" data-i18n="clockmakers-bench.guide">选轴位，再点零件装上。</p>
    <div class="parts" id="parts"></div>
    <button id="remove" data-i18n-label="clockmakers-bench.remove" data-i18n-title="clockmakers-bench.remove"><svg aria-hidden="true"><use href="#i-trash"/></svg><span data-i18n="clockmakers-bench.remove">取下齿轮</span></button>
  </section>
  <section class="test-area">
    <div id="readout" role="status" aria-live="polite"><span id="lamp"></span><div><b id="status"></b><span id="detail"></span></div></div>
    <div class="actions"><button id="run"><svg aria-hidden="true"><use href="#i-play"/></svg><span></span></button><button id="next" hidden><span></span><svg aria-hidden="true"><use href="#i-next"/></svg></button></div>
    <div id="meter" aria-hidden="true"><i></i></div>
  </section>
</main></div>
<dialog id="sheet"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="close" data-i18n-label="clockmakers-bench.close">×</button></div><div id="dialogBody"></div></dialog>
<script src="../../i18n.js"></script><script src="messages.js"></script><script src="mechanism.js"></script><script src="art.js"></script><script src="bench.js"></script>
</body></html>
