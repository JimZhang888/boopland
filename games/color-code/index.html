<!doctype html>
<html lang="zh-CN" data-i18n-scope="color-code">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee9d9">
  <title data-i18n="color-code.title">猜色密码</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="../../analytics.js"></script>
  <script defer src="../../i18n.js"></script>
  <script defer src="messages.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
<main class="shell">
  <header><a class="back" href="../../games.html"><span aria-hidden="true">‹</span> <span data-i18n="common.back">返回大厅</span></a><h1 data-i18n="color-code.title">猜色密码</h1><button id="help" class="help" data-i18n-label="color-code.rules" aria-haspopup="dialog">?</button></header>
  <div class="table">
    <section class="ledger" data-i18n-label="color-code.history">
      <div class="ledger-head"><h2 data-i18n="color-code.history">推理记录</h2><span data-i18n="color-code.clues">线索</span></div>
      <div id="rows"></div>
    </section>
    <section class="tools">
      <div class="envelope">
        <div class="topline"><h2 data-i18n="color-code.secret">封存的密码</h2><svg viewBox="0 0 32 22" aria-hidden="true"><path d="M2 2l28 1-1 17-27-1z M3 4l12 9L29 4 M3 18l8-7m17 8-9-8"/></svg></div>
        <div id="secret" class="sealed"></div>
      </div>
      <div class="key"><span><b class="full">●</b> <span data-i18n="color-code.exact">颜色和位置都对</span></span><span><b class="near">◇</b> <span data-i18n="color-code.near">颜色对，位置错</span></span></div>
      <div class="input-card">
        <div class="topline"><h2 data-i18n="color-code.palette">选色印章</h2><span id="round"></span></div>
        <div id="palette"></div>
        <p id="status" role="status" aria-live="polite"></p>
        <button id="submit" class="primary">核对密码</button>
      </div>
    </section>
  </div>
</main>
<dialog id="dialog"><form method="dialog"><h2 data-i18n="color-code.rules">玩法</h2><p data-i18n="color-code.how"></p><p data-i18n="color-code.keys"></p><button class="primary" data-i18n="color-code.close">知道了</button></form></dialog>
</body>
</html>
