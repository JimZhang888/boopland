<!DOCTYPE html>
<html lang="zh-CN" data-i18n-scope="pictureSlide">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <title data-i18n="pageTitle">纸间拼图 · Boopland</title>
  <link rel="icon" type="image/svg+xml" href="./cover.svg">
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="game-shell">
    <header class="topbar">
      <a class="back" href="../../games.html"><span aria-hidden="true">↶</span><span data-i18n="common.back">返回大厅</span></a>
      <span class="brand" aria-label="Boopland">boopland<span aria-hidden="true">✳</span></span>
      <div class="tools">
        <button id="pause" class="icon-button" type="button" data-i18n-label="pause" data-i18n-title="pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
        <button id="help" class="icon-button" type="button" data-i18n-label="help" data-i18n-title="help">?</button>
      </div>
    </header>

    <main class="desk">
      <section class="play-sheet" aria-labelledby="game-title">
        <header class="sheet-heading">
          <div><p class="eyebrow" data-i18n="eyebrow">一方纸片 · 一点耐心</p><h1 id="game-title" data-i18n="name">纸间拼图</h1></div>
          <span class="edition" data-i18n="genre">图片华容道</span>
        </header>
        <div class="stats" aria-label="游戏状态" data-i18n-label="stats">
          <div><span data-i18n="moves">移动步数</span><strong id="moves">0</strong></div>
          <div><span data-i18n="time">用时</span><strong id="time">00:00</strong></div>
          <div><span data-i18n="placed">已归位</span><strong id="placed">0 / 8</strong></div>
        </div>
        <div id="board-area" class="board-area">
          <span class="pencil-star" aria-hidden="true">✳</span>
          <div class="board-frame">
            <div id="board" class="board" role="group" tabindex="0" aria-describedby="instructions"></div>
          </div>
          <span class="corner-note" aria-hidden="true">↗</span>
        </div>
        <div class="board-caption"><span class="status-dot" aria-hidden="true"></span><p id="status" role="status" aria-live="polite" aria-atomic="true"></p></div>
        <p id="instructions" class="keyboard-hint" data-i18n="controls">点击 / 滑动相邻纸片 · 方向键移动</p>
      </section>

      <aside class="notebook" aria-label="拼图设置" data-i18n-label="settings">
        <section class="reference-section">
          <div class="section-label"><span data-i18n="reference">想拼回的风景</span><span aria-hidden="true">↙</span></div>
          <button id="reference" class="reference-card" type="button" data-i18n-label="viewImage">
            <img id="reference-image" src="./assets/cottage.svg" alt="" draggable="false">
            <span class="reference-caption"><span id="image-name"></span><span aria-hidden="true">⤢</span></span>
          </button>
        </section>
        <section class="settings-section">
          <label for="size" class="section-label" data-i18n="difficulty">挑一个难度</label>
          <select id="size" data-i18n-label="difficulty" aria-label="挑一个难度"><option value="3" data-i18n="size3">3 × 3 · 轻松入门</option><option value="4" data-i18n="size4">4 × 4 · 经典挑战</option><option value="5" data-i18n="size5">5 × 5 · 慢慢琢磨</option></select>
          <div class="gallery-label section-label"><span data-i18n="chooseImage">换一张风景</span><span aria-hidden="true">01 — 03</span></div>
          <div class="gallery" role="group" data-i18n-label="chooseImage">
            <button type="button" data-image="cottage" aria-pressed="true" data-i18n-label="cottage" data-i18n-title="cottage"><img src="./assets/cottage.svg" alt="" draggable="false"></button>
            <button type="button" data-image="coast" aria-pressed="false" data-i18n-label="coast" data-i18n-title="coast"><img src="./assets/coast.svg" alt="" draggable="false"></button>
            <button type="button" data-image="garden" aria-pressed="false" data-i18n-label="garden" data-i18n-title="garden"><img src="./assets/garden.svg" alt="" draggable="false"></button>
            <button id="upload" type="button" class="upload" data-i18n-label="upload" data-i18n-title="upload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8V5h14v14H5v-3M2 12h8m-4-4 4 4-4 4M13 8h2M13 15l2-3 4 5"/></svg><span data-i18n="myImage">我的</span></button>
          </div>
          <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden>
          <label class="number-toggle"><input id="numbers" type="checkbox" checked><span data-i18n="numbers">显示数字提示</span><span class="tiny-number" aria-hidden="true">123</span></label>
        </section>
        <section class="action-section">
          <div class="best-row"><span data-i18n="best">本难度最佳</span><strong id="best">—</strong></div>
          <div class="actions"><button id="undo" type="button"><span aria-hidden="true">↶</span><span data-i18n="undo">撤销</span></button><button id="restart" type="button"><span aria-hidden="true">⟳</span><span data-i18n="restart">重来</span></button></div>
          <button id="shuffle" class="primary shuffle" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3c4 0 8 12 12 12h3m-4-4 4 4-4 3M3 18h3c2 0 4-4 5-6m3-3c2-2 3-3 4-3h3m-4-3 4 3-4 4"/></svg><span data-i18n="shuffle">打乱，开新一局</span></button>
        </section>
      </aside>
    </main>
    <footer class="page-foot"><span data-i18n="footer">把零散的小片段，拼成完整的小美好。</span><span aria-hidden="true">✧</span></footer>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <button id="close-dialog" class="icon-button close" type="button" data-i18n-label="close">×</button>
    <div id="dialog-content"></div>
    <a class="dialog-back" href="../../games.html" data-i18n="common.back">返回大厅</a>
  </dialog>
  <script src="../../i18n.js"></script>
  <script src="./translations.js"></script>
  <script src="./engine.js"></script>
  <script src="./game.js"></script>
</body>
</html>
