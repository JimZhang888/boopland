<!doctype html>
<html lang="zh-CN" data-i18n-scope="detective">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <title data-i18n="detective.pageTitle">一页侦探 · Boopland</title>
  <link rel="icon" href="cover.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
<main class="desk">
  <header class="topbar">
    <a class="back" href="../../games.html"><span aria-hidden="true">↶</span> <span data-i18n="common.back">返回大厅</span></a>
    <h1><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="13" r="9"/><path d="m20 20 9 9M8 12q0-5 5-5"/></svg><span data-i18n="detective.name">一页侦探</span></h1>
    <div class="top-actions"><button id="archive" data-i18n="detective.archive">案卷夹</button><button id="help" class="icon-button" data-i18n-label="detective.help">?</button></div>
  </header>
  <section class="case-heading">
    <div class="case-number" aria-hidden="true"><small>FILE</small><strong id="case-number">01</strong></div>
    <div class="case-title"><p data-i18n="detective.eyebrow">每个细节，都有话想说</p><h2 id="case-title"></h2><p id="case-brief"></p></div>
    <div class="case-stamp" aria-hidden="true"><span>BOOPLAND</span><b>DETECTIVE<br>CLUB</b><span>EST. 2026</span></div>
  </section>
  <section class="workspace">
    <section class="scene-paper" aria-labelledby="scene-label">
      <div class="paper-heading"><span><i></i><span id="scene-label" data-i18n="detective.scene">现场速写</span></span><span id="clue-count"></span></div>
      <div id="scene-space" class="scene-space"><div id="scene" class="scene"></div></div>
      <div class="scene-caption"><span id="scene-location"></span><span data-i18n="detective.sceneTip">点数字标记，仔细看看。</span></div>
    </section>
    <aside class="notebook" aria-label="Case notebook" data-i18n-label="detective.notebook">
      <div class="notebook-heading"><div><small data-i18n="detective.notesTop">观察 · 求证 · 还原</small><h2 data-i18n="detective.notebook">侦探手记</h2></div><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m9 30 4-11L29 3l7 7-16 16-11 4Zm4-11 7 7M27 5l7 7M6 35q12-3 27-1"/></svg></div>
      <div class="tabs" role="tablist" data-i18n-label="detective.notebook">
        <button id="tab-witnesses" role="tab" aria-controls="notes-content" data-tab="witnesses" data-i18n="detective.witnesses">证词</button>
        <button id="tab-evidence" role="tab" aria-controls="notes-content" data-tab="evidence" data-i18n="detective.evidence">物证</button>
        <button id="tab-links" role="tab" aria-controls="notes-content" data-tab="links" data-i18n="detective.links">矛盾</button>
      </div>
      <div id="notes-content" class="notes-content" role="tabpanel" tabindex="0"></div>
      <div class="pairing"><p id="pair-label"></p><button id="challenge" class="primary" disabled><span data-i18n="detective.challenge">指出矛盾</span><span aria-hidden="true">↗</span></button></div>
    </aside>
  </section>
  <footer class="bottom-bar">
    <div class="tools"><button id="hint"><span aria-hidden="true">✧</span> <span data-i18n="detective.hint">一点提示</span></button><button id="restart" data-i18n-label="detective.restart">↻</button></div>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="reconstruct" class="primary" disabled><span data-i18n="detective.reconstruct">还原事件</span><span aria-hidden="true">→</span></button>
  </footer>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" data-i18n-label="detective.close">×</button></div><div id="dialog-content"></div></dialog>
<script src="../../i18n.js"></script>
<script src="translations.js"></script>
<script src="cases.js"></script>
<script src="case-translations.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
