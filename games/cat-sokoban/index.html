<!DOCTYPE html>
<html lang="zh-CN" data-i18n-scope="catSokoban">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <title data-i18n="pageTitle">猫咪推箱子 · Boopland</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="game-shell">
    <header class="topbar">
      <a class="back" href="../../games.html"><span aria-hidden="true">↶</span><span data-i18n="common.back">返回大厅</span></a>
      <h1><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#paw-art"/></svg><span data-i18n="name">猫咪推箱子</span></h1>
      <button id="help" class="icon-button" type="button" data-i18n-label="help" aria-label="玩法说明">?</button>
    </header>

    <main class="desk">
      <section class="play-sheet" aria-labelledby="level-name">
        <header class="board-heading">
          <div class="level-heading"><span id="chapter" class="eyebrow"></span><h2 id="level-name"></h2></div>
          <button id="levels" class="levels-button" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z"/></svg><span data-i18n="chooseLevel">选关</span></button>
        </header>
        <div id="board-wrap" class="board-wrap">
          <svg id="board" class="board" tabindex="0" role="img" aria-describedby="board-instructions" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div class="board-caption"><span class="status-dot" aria-hidden="true"></span><p id="status" role="status" aria-live="polite" aria-atomic="true"></p></div>
      </section>

      <aside class="notebook" aria-label="游戏状态" data-i18n-label="gameStatus">
        <div class="little-sketch" aria-hidden="true"><svg viewBox="0 0 190 108"><path d="M17 91q73 7 157-2" stroke="#c2c6af" stroke-width="1" fill="none"/><use href="#cat-art" x="25" y="6" width="86" height="86"/><use href="#crate-art" x="112" y="40" width="54" height="54"/><path d="M109 18l4-7m4 13 8-2M19 45l-7-3" stroke="#9aa78b" stroke-linecap="round" fill="none"/><path d="M166 70q-12-10-8-20m2 9q12-13 15-6m-15 11q-14-8-13-2" fill="none" stroke="#98a586" stroke-width="1.3"/></svg></div>
        <p class="notebook-title" data-i18n="littleNote">一箱一箱，慢慢来。</p>
        <div class="stats">
          <div class="stat"><span data-i18n="moves">步数</span><strong id="moves">0</strong></div>
          <div class="stat"><span data-i18n="pushes">推动</span><strong id="pushes">0</strong></div>
          <div class="stat progress-stat"><span data-i18n="placed">已归位</span><strong id="placed">0 / 1</strong></div>
        </div>
        <div class="best-row"><span data-i18n="best">本关最佳</span><span id="best">—</span></div>
        <div class="control-section">
          <p id="board-instructions" class="control-hint" data-i18n="controls">方向键 / WASD · 滑动棋盘</p>
          <div class="dpad" role="group" data-i18n-label="moveCat" aria-label="移动小猫">
            <button type="button" data-direction="up" data-i18n-label="up" aria-label="向上"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
            <button type="button" data-direction="left" data-i18n-label="left" aria-label="向左"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button>
            <span class="dpad-paw" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#paw-art"/></svg></span>
            <button type="button" data-direction="right" data-i18n-label="right" aria-label="向右"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
            <button type="button" data-direction="down" data-i18n-label="down" aria-label="向下"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6"/></svg></button>
          </div>
          <p class="gentle-rule" data-i18n="gentleRule">只能推，不能拉。给自己留条路。</p>
        </div>
        <div class="actions">
          <button id="undo" type="button" data-i18n-title="undoTip"><span aria-hidden="true">↶</span><span data-i18n="undo">撤销</span></button>
          <button id="restart" type="button" data-i18n-title="restartTip"><span aria-hidden="true">⟳</span><span data-i18n="restart">重来</span></button>
        </div>
        <button id="next" class="primary next-button" type="button" hidden><span data-i18n="next">下一关</span><span aria-hidden="true">→</span></button>
      </aside>
    </main>

    <footer class="page-footer"><span id="progress"></span><span data-i18n="footer">把小小的日子，整理成喜欢的样子。</span><span aria-hidden="true">BOOPLAND · 012</span></footer>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" type="button" class="icon-button" data-i18n-label="close" aria-label="关闭">×</button></div>
    <div id="dialog-content"></div>
  </dialog>
  <noscript>请开启 JavaScript 以游玩。 / Please enable JavaScript to play.</noscript>
  <script src="../../i18n.js"></script>
  <script src="./translations.js"></script>
  <script src="./engine.js"></script>
  <script src="./levels.js"></script>
  <script src="./art.js"></script>
  <script src="./game.js"></script>
</body>
</html>
