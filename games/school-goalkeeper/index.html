<!doctype html>

</head>
<body>

  <aside class="sheet">
    <div class="scoreline"><h2 data-i18n="school-goalkeeper.shots">点球记录</h2><strong id="counter">1 / 10</strong></div>
    <div id="history" aria-live="off"></div>
    <div class="signal"><div id="arrow" aria-hidden="true">⚽</div><div><h2 id="phase" aria-live="polite"></h2><p id="message" role="status"></p></div></div>
    <div class="meter-block"><div class="meter-caption"><span data-i18n="school-goalkeeper.timing">起扑时机</span><span aria-hidden="true">◷</span></div><div id="meter"><i id="window"></i><b id="needle"></b></div></div>
    <button id="action"></button>
    <p id="play-hint" hidden><svg viewBox="0 0 24 16" aria-hidden="true"><path d="M1 1h22v14H1zM8 1v14m8-14v14M1 8h22"/></svg><span data-i18n="school-goalkeeper.pick">点球门扑救</span></p>
  </aside>
  </div>
</main>
<dialog id="dialog"><form method="dialog"><h2 data-i18n="school-goalkeeper.rules">玩法</h2><p data-i18n="school-goalkeeper.how"></p><p data-i18n="school-goalkeeper.keys"></p><button data-i18n="school-goalkeeper.close">知道了</button></form></dialog>
