<main class="folio">
  <header class="masthead">
    <a class="back" href="../../games.html" data-i18n-label="common.back"><svg class="icon" aria-hidden="true"><use href="#glyph-back"/></svg><span data-i18n="common.back">返回大厅</span></a>
    <h1><span class="mark"><svg class="icon" aria-hidden="true"><use href="#glyph-boat"/></svg></span><span data-i18n="last-ferry.title">最后一班渡船</span></h1>
    <button id="help" class="plain help" data-i18n-label="last-ferry.help"><svg class="icon" aria-hidden="true"><use href="#glyph-help"/></svg><span data-i18n="last-ferry.help">玩法</span></button>
  </header>
  <div class="spread">
    <section class="chart" aria-labelledby="place">
      <div class="chart-head">
        <div class="number" id="chart-number">01</div>
        <div class="chart-title"><small id="stage-label"></small><h2 id="place"></h2></div>
        <button class="atlas-button" id="atlas" data-i18n-label="last-ferry.routes"><svg class="icon" aria-hidden="true"><use href="#glyph-map"/></svg><span data-i18n="last-ferry.routes">航线图</span><svg class="icon" aria-hidden="true"><use href="#glyph-chevron"/></svg></button>
      </div>
      <div class="map-mat">
        <svg class="map" viewBox="0 0 840 490" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
          <image href="estuary.svg" width="840" height="490"/>
          <g class="pier-sign" id="west-sign" transform="translate(58 340)">
            <path class="post" d="m-2-14 .5 16 3 1 .7-17Z"/>
            <rect x="-53" y="-38" width="106" height="26" rx="2"/>
            <text y="-19" data-i18n="last-ferry.west">西岸</text>
          </g>
          <g class="pier-sign" id="east-sign" transform="translate(777 325)">
            <path class="post" d="m-2-14 .5 16 3 1 .7-17Z"/>
            <rect x="-53" y="-38" width="106" height="26" rx="2"/>
            <text y="-19" data-i18n="last-ferry.east">东岸</text>
          </g>
          <g id="vessel"><g id="orientation">
            <image x="-108" y="-90" width="214" height="115" href="boat.svg"/>
            <g id="aboard"></g>
          </g></g>
        </svg>
      </div>
      <section class="notice" aria-labelledby="notice-title">
        <h3 id="notice-title"><svg class="icon" aria-hidden="true"><use href="#glyph-paper"/></svg><span data-i18n="last-ferry.notice">渡口告示</span></h3>
        <dl>
          <div><svg class="icon" aria-hidden="true"><use href="#glyph-weight"/></svg><dt data-i18n="last-ferry.capacity">限载</dt><dd id="capacity"></dd></div>
          <div><svg class="icon" aria-hidden="true"><use href="#glyph-oar"/></svg><dt data-i18n="last-ferry.pilots">掌舵</dt><dd id="pilots"></dd></div>
          <div><svg class="icon" aria-hidden="true"><use href="#glyph-pair"/></svg><dt data-i18n="last-ferry.pairs">不可独处</dt><dd id="pairs"></dd></div>
        </dl>
      </section>
    </section>
    <section class="manifest" aria-labelledby="list-title">
      <div class="manifest-head"><h2 id="list-title" data-i18n="last-ferry.manifest">登船名册</h2><div class="trip-counter"><span data-i18n="last-ferry.trips">航次</span><strong id="trips">00</strong></div></div>
      <div class="banks">
        <section class="bank" data-bank="west">
          <div class="bank-head"><h3><svg class="icon" aria-hidden="true"><use href="#glyph-west"/></svg><span data-i18n="last-ferry.west">西岸</span></h3><span class="dock"><svg class="icon" aria-hidden="true"><use href="#glyph-boat"/></svg><span data-i18n="last-ferry.docked">船在此岸</span></span></div>
          <div class="cards" id="west-list"></div>
        </section>
        <section class="bank" data-bank="east">
          <div class="bank-head"><h3><svg class="icon" aria-hidden="true"><use href="#glyph-east"/></svg><span data-i18n="last-ferry.east">东岸</span></h3><span class="dock"><svg class="icon" aria-hidden="true"><use href="#glyph-boat"/></svg><span data-i18n="last-ferry.docked">船在此岸</span></span></div>
          <div class="cards" id="east-list"></div>
        </section>
      </div>
      <div class="dispatch">
        <div class="load-line"><span><svg class="icon" aria-hidden="true"><use href="#glyph-weight"/></svg><span data-i18n="last-ferry.load">已选载重</span></span><strong><b id="load">0</b> / <span id="max-load"></span> kg</strong></div>
        <div class="gauge" aria-hidden="true"><i></i></div>
        <div class="feedback" role="status" aria-live="polite"><span id="message"></span></div>
        <div class="actions">
          <button class="undo" id="undo" data-i18n-label="last-ferry.undo"><svg class="icon" aria-hidden="true"><use href="#glyph-undo"/></svg><span data-i18n="last-ferry.undo">撤销</span></button>
          <button class="sail" id="sail"><span id="sail-text"></span><svg class="icon" aria-hidden="true"><use href="#glyph-arrow"/></svg></button>
        </div>
      </div>
    </section>
  </div>
</main>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-content">
    <button id="close" class="close" data-i18n-label="last-ferry.close"><svg class="icon" aria-hidden="true"><use href="#glyph-close"/></svg></button>
    <div class="dialog-mark"><svg class="icon" aria-hidden="true"><use href="#glyph-compass"/></svg></div>
    <h2 id="dialog-title"></h2>
    <div id="dialog-body"></div>
    <a class="dialog-back" href="../../games.html"><svg class="icon" aria-hidden="true"><use href="#glyph-back"/></svg><span data-i18n="common.back">返回大厅</span></a>
  </div>
</dialog>
</body>
</html>
