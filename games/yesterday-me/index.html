<!DOCTYPE html>
<html lang="zh-CN" data-i18n-scope="yesterday">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <title data-i18n="yesterday.pageTitle">昨天的我 · Boopland</title>
  <link rel="icon" type="image/svg+xml" href="cover.svg">
  <link rel="stylesheet" href="style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="back" href="../../games.html"><span aria-hidden="true">↶</span><span data-i18n="common.back">返回大厅</span></a>
      <div class="identity"><svg viewBox="0 0 40 36" aria-hidden="true"><path d="M10 8a13 13 0 1 1-3 18M4 7l6 1-1 7M21 10v10l6 4"/><path d="M14 4a17 17 0 0 1 22 17" opacity=".35"/></svg><h1 data-i18n="yesterday.name">昨天的我</h1></div>
      <div class="top-actions"><button id="help" class="icon-button" data-i18n-label="yesterday.help" title="?">?</button><button id="pause" class="icon-button" data-i18n-label="yesterday.pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button></div>
    </header>
    <section class="notebook">
      <div class="chapterbar"><button id="levels" class="level-button"><span id="page-number">01</span><span><small data-i18n="yesterday.chapter">时间合作手记</small><strong id="level-name"></strong></span><span aria-hidden="true">⌄</span></button><div class="chapter-note" data-i18n="yesterday.motto">这一次，有上一次的我陪你。</div><span class="chapter-progress" id="chapter-progress">1 / 6</span></div>
      <div class="workspace">
        <div class="scene-column">
          <div class="scene" id="scene"><canvas id="game" tabindex="0" role="application" data-i18n-label="yesterday.canvas" data-i18n="yesterday.canvas">移动、跳跃，录下动作，与过去的自己合作。</canvas><div class="scene-caption"><span class="ink-dot"></span><span id="phase-label"></span></div><div class="toast" id="toast" role="status" hidden></div></div>
          <div class="instruction"><span aria-hidden="true">✎</span><p id="instruction" role="status"></p><button id="hint" data-i18n-label="yesterday.hint" aria-pressed="false">?</button></div>
        </div>
        <aside class="time-diary" data-i18n-label="yesterday.diary">
          <div class="diary-heading"><span data-i18n="yesterday.diary">留给自己的时间</span><span aria-hidden="true">◷</span></div>
          <div class="live-record"><div class="record-head"><span><i class="record-dot"></i><b data-i18n="yesterday.now">现在的我</b></span><output id="clock">00.0</output></div><div class="tape"><div id="live-fill"></div><span></span><span></span><span></span></div><div class="tape-scale"><span>0 s</span><span>30 s</span></div></div>
          <div id="memories" class="memories"></div>
          <p class="diary-note" data-i18n="yesterday.memoryNote">走过的路，会变成下一次的帮手。</p>
          <div class="memory-actions"><button id="undo" class="quiet-button" disabled><span aria-hidden="true">↶</span><span data-i18n="yesterday.undo">撤回分身</span></button><button id="reset" class="quiet-button"><span aria-hidden="true">↺</span><span data-i18n="yesterday.reset">重置本关</span></button></div>
        </aside>
      </div>
      <div class="controls">
        <div class="move-controls" role="group" data-i18n-label="yesterday.moveControls"><button class="touch-key" data-input="left" data-i18n-label="yesterday.left">←</button><button class="touch-key" data-input="right" data-i18n-label="yesterday.right">→</button><button class="touch-key action-key" data-input="jump"><span aria-hidden="true">↟</span><small data-i18n="yesterday.jump">跳跃</small></button><button class="touch-key action-key" data-input="act" id="carry"><span aria-hidden="true">◇</span><small data-i18n="yesterday.carry">搬 / 放</small></button></div>
        <div class="take-controls"><button id="retry" class="retry-button" data-i18n-label="yesterday.retry"><span aria-hidden="true">↻</span><span data-i18n="yesterday.retry">重走这一遍</span><kbd>T</kbd></button><button id="rewind" class="primary"><svg viewBox="0 0 28 24" aria-hidden="true"><path d="m14 5-9 7 9 7Zm10 0-9 7 9 7Z"/></svg><span data-i18n="yesterday.rewind">留下分身 · 重来</span><kbd>R</kbd></button></div>
      </div>
    </section>
    <footer><span data-i18n="yesterday.footer">献给每一个，愿意再试一次的自己。</span><span data-i18n="yesterday.keys">← → / A D 移动 · 空格跳跃 · E 搬箱 · R 留下分身</span></footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-top"><span data-i18n="yesterday.chapter">时间合作手记</span><button id="close-dialog" class="icon-button" data-i18n-label="yesterday.close">×</button></div><div id="dialog-content"></div></dialog>
  <script src="../../i18n.js"></script>
  <script src="translations.js"></script>
  <script src="engine.js"></script>
  <script src="scene.js"></script>
  <script src="game.js"></script>
</body>
</html>
