<!doctype html>
<html lang="zh-CN" data-i18n-scope="waterSort">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <meta name="description" content="在玻璃瓶之间轻轻倒水，把同一种颜色收集在一起。" data-i18n-content="description">
  <title>水彩分类 · Boopland</title>
  <link rel="icon" href="./cover.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <div class="game-shell">
    <header class="topbar">
      <a class="back-link" href="../../games.html"><span aria-hidden="true">←</span><span data-i18n="common.back">返回大厅</span></a>
      <h1><svg viewBox="0 0 26 30" aria-hidden="true"><path d="M13 2C10 8 3 14 3 19a10 10 0 0 0 20 0C23 14 16 8 13 2Z"/><path d="M7 20q1 5 6 5"/></svg><span data-i18n="name">水彩分类</span></h1>
      <div class="header-actions">
        <button id="marks" class="icon-button" aria-pressed="true" data-i18n-label="marks" data-i18n-title="marks"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="3"/><path d="m17 4 4 7h-8Zm-13 11h6v6H4Zm13-1 4 4-4 4-4-4Z"/></svg></button>
        <button id="help" class="icon-button" data-i18n-label="help" data-i18n-title="help">?</button>
      </div>
    </header>

    <main class="desk">
      <aside class="journal">
        <div class="margin-note"><span class="eyebrow" data-i18n="eyebrow">一小页色彩练习</span><p data-i18n="margin">慢慢倒，\n让颜色各自相逢。</p><svg viewBox="0 0 150 32" aria-hidden="true"><path d="M5 15q58-15 135-2M12 23q57-12 118-5"/></svg></div>
        <section class="progress-card">
          <div class="stat"><span data-i18n="moves">倒水步数</span><strong id="moves">0</strong></div>
          <div class="stat"><span data-i18n="sorted">已归好</span><strong><span id="sorted">0</span><small id="color-count"> / 3</small></strong></div>
          <div class="color-dots" id="color-dots" aria-hidden="true"></div>
          <div class="best-line"><span data-i18n="best">本关最佳</span><span id="best">—</span></div>
        </section>
        <p class="no-rush" data-i18n="noRush">没有倒计时，留一点时间给颜色。</p>
        <svg class="palette-doodle" viewBox="0 0 160 130" aria-hidden="true"><path d="M77 15C39 12 14 33 14 65c-1 32 31 50 58 45 21-4 10-23 24-25 14-3 34 17 46-3 14-25-14-65-65-67Z"/><ellipse cx="111" cy="66" rx="10" ry="13" transform="rotate(-25 111 66)"/><circle cx="42" cy="43" r="10" fill="#c98e87"/><circle cx="72" cy="31" r="9" fill="#d7b56d"/><circle cx="32" cy="72" r="9" fill="#84a7bb"/><circle cx="54" cy="93" r="8" fill="#8fa98a"/><path d="m80 124 51-111 7 3-45 111-12 5Zm48-104 9 4M29 54l5 2m47-7 9-3"/></svg>
      </aside>

      <section class="notebook" data-i18n-label="gameArea">
        <div class="notebook-top"><button id="levels" class="level-button" data-i18n-label="levels"><span class="level-dot" aria-hidden="true"></span><span id="level-label">第 01 关</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg></button><span class="board-note" data-i18n="boardNote">把同色，装进同一个小世界</span><span id="level-count" class="page-number">01 / 24</span></div>
        <div class="board-slot" id="board-slot"><div id="board" class="board" role="group" data-i18n-label="board"></div><span class="desk-line" aria-hidden="true"></span></div>
        <div class="status-line"><span aria-hidden="true" class="status-dot"></span><p id="status" role="status" aria-live="polite"></p></div>
        <div class="tools">
          <button id="undo" class="tool-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12h-3"/></svg><span data-i18n="undo">撤回</span></button>
          <button id="hint" class="tool-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16c0-2-3-3-3-7a7 7 0 0 1 14 0c0 4-3 5-3 7Zm1 4h6m-3-4v-5m-2 0h4"/></svg><span data-i18n="hint">一点提示</span></button>
          <button id="restart" class="tool-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 9M4 3v7h7"/></svg><span data-i18n="restart">重新开始</span></button>
        </div>
      </section>
    </main>
    <footer class="page-foot"><span aria-hidden="true">✳</span><span data-i18n="footer">一瓶一色，一点点就好。</span><span aria-hidden="true">✳</span></footer>
  </div>
  <div id="effects" class="effects" aria-hidden="true"></div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-sheet"><button id="close-dialog" class="icon-button dialog-close" data-i18n-label="close">×</button><div id="dialog-art" class="dialog-art" aria-hidden="true"></div><h2 id="dialog-title"></h2><div id="dialog-copy" class="dialog-copy"></div><div id="level-grid" class="level-grid" hidden></div><div id="dialog-actions" class="dialog-actions"></div></div>
  </dialog>
  <script src="../../i18n.js"></script>
  <script src="./translations.js"></script>
  <script src="./engine.js"></script>
  <script src="./levels.js"></script>
  <script src="./game.js"></script>
</body>
</html>
