<!doctype html>
<html lang="zh-CN" data-i18n-scope="paper-reversi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e6">
  <title data-i18n="paper-reversi.title">纸间黑白棋</title>
  <link rel="icon" href="cover.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="back" href="../../games.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12.3 4 12m6.5-6.5L4 12l6.8 6.2"/></svg>
        <span data-i18n="common.back">返回大厅</span>
      </a>
      <span class="brand" aria-hidden="true">BOOPLAND</span>
      <button class="help-button" id="help" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4.5q4-1 8.8 1.8 4-2.7 9-1.8v14c-3.6-.8-6.4.3-9 2-3-1.8-5.6-2.6-8.8-2Zm8.8 1.8v14M5.7 8.2l3.4 1m5.6 0 3.3-1"/></svg>
        <span data-i18n="paper-reversi.help">玩法</span>
      </button>
    </header>
    <main class="desk">
      <div class="intro">
        <img class="sketch" src="pieces.svg" alt="">
        <h1 data-i18n="paper-reversi.title">纸间黑白棋</h1>
      </div>
      <section class="scorecard" aria-labelledby="status">
        <div class="turn-block" role="status" aria-live="polite" aria-atomic="true">
          <div class="turn-title"><i id="turn-mark" aria-hidden="true"></i><h2 id="status"></h2></div>
          <p id="detail"></p>
        </div>
        <div class="scores" aria-live="off">
          <div class="player"><span class="sample dark" aria-hidden="true"></span><span id="black-score" class="count">2</span><span class="owner" data-i18n="paper-reversi.blackPlayer">你 · 黑方</span></div>
          <div class="player"><span class="sample light" aria-hidden="true"></span><span id="white-score" class="count">2</span><span class="owner" data-i18n="paper-reversi.whitePlayer">电脑 · 白方</span></div>
        </div>
      </section>
      <section class="board-area" data-i18n-label="paper-reversi.board" aria-label="棋盘">
        <div class="folio">
          <div class="mat">
            <div class="letters" aria-hidden="true"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span></div>
            <div class="numbers" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span></div>
            <div id="board" role="group" data-i18n-label="paper-reversi.board"></div>
          </div>
          <div class="caption"><span><i class="legend-dot" aria-hidden="true"></i><span data-i18n="paper-reversi.legend">可落子</span></span><span id="last"></span></div>
        </div>
      </section>
      <div class="settings">
        <fieldset><legend data-i18n="paper-reversi.difficulty">电脑难度</legend>
          <div class="levels">
            <label><input type="radio" name="level" value="easy" checked><span data-i18n="paper-reversi.easy">入门</span></label>
            <label><input type="radio" name="level" value="advanced"><span data-i18n="paper-reversi.advanced">进阶</span></label>
          </div>
        </fieldset>
        <button id="restart" class="restart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.3 9a7.6 7.6 0 1 1-1 5m1.1-10-.3 5.6 5.6-.3"/></svg>
          <span data-i18n="paper-reversi.restart">重开一局</span>
        </button>
      </div>
    </main>
  </div>
  <dialog id="guide" aria-labelledby="guide-title">
    <div class="guide-head"><h2 id="guide-title" data-i18n="paper-reversi.help">玩法</h2><form method="dialog"><button class="close" data-i18n-label="paper-reversi.close">×</button></form></div>
    <div class="example" aria-hidden="true"><span class="mini-row"><i class="dark"></i><i class="light"></i><i class="mini-dot"></i></span><span>→</span><span class="mini-row"><i class="dark"></i><i class="dark"></i><i class="dark"></i></span></div>
    <p data-i18n="paper-reversi.rulesMove"></p>
    <p data-i18n="paper-reversi.rulesPass"></p>
    <p class="key-tip" data-i18n="paper-reversi.rulesKeys"></p>
  </dialog>
  <script src="../../i18n.js"></script>
  <script src="translations.js"></script>
  <script src="rules.js"></script>
  <script src="game.js"></script>
</body>
</html>
