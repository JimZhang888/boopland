<!doctype html>
<html lang="en" data-i18n-scope="paper-pinball">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e6">
  <title data-i18n="paper-pinball.title">Paper Pinball</title>
  <link rel="icon" href="./cover.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
  <script src="../../i18n.js"></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="orbit" viewBox="0 0 36 36"><circle cx="18" cy="18" r="8.4" fill="#e5c993"/><path d="M11 13q5 4 12 0m-14 6q7 4 16-1"/><ellipse cx="18" cy="18" rx="16" ry="4.6" transform="rotate(-29 18 18)"/><path d="m27 3 1 2.2 2 1-2 1-1 2-1-2-2-1 2-1Z" fill="currentColor" stroke-width=".7"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="m10 6-6 6 6 6m-5-6h15"/></symbol>
  <symbol id="book" viewBox="0 0 24 24"><path d="M12 6q-4-3-9-2v14q5-1 9 2 4-3 9-2V4q-5-1-9 2Zm0 0v14M6 8l3 1m6 0 3-1"/></symbol>
  <symbol id="bat-icon" viewBox="0 0 36 25"><path d="M4 13q-2 4 1 7t7 1l20-12q3-2 1-4-1-2-4-1L7 11Z" fill="#d7dccc"/><circle cx="8.5" cy="16.5" r="2.1"/><path d="m17 4 1-3m4 4 2-2" stroke-width="1"/></symbol>
  <symbol id="spring-icon" viewBox="0 0 30 30"><path d="M5 23 21 7m-5 0 5-4 5 5-4 5ZM4 19l7 6m-1-12c-6 0-3 10 1 9s-2-13 1-13 7 10 3 10-5-12-2-12 7 7 5 9" /></symbol>
  <symbol id="sball" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="#c5d1c1"/><path d="M7 9q1-3 5-3" stroke="#fffaf0" stroke-width="2.1"/><path d="M12 17q3-1 4-4" stroke-width="1.2"/></symbol>
  <symbol id="ticket-star" viewBox="0 0 30 30"><path d="m14 2 2.5 8.5L25 14l-8.5 2.2L14 26l-2.8-9.3L2 14l9.4-3.5Z" fill="#d7be87"/><path d="m22 4 2 1m1 4 2 1M5 23l-2 2"/></symbol>
</defs></svg>
<main class="shell">
  <header class="topbar">
    <a class="back" href="../../games.html"><svg aria-hidden="true"><use href="#arrow"/></svg><span data-i18n="common.back">Back to the lobby</span></a>
    <h1><svg aria-hidden="true"><use href="#orbit"/></svg><span data-i18n="paper-pinball.title">Paper Pinball</span></h1>
    <div class="tools">
      <button id="sound" class="sound" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3Z"/><path class="waves" d="M15 9q3 3 0 6m3-9q5 6 0 12"/><path class="slash" d="m15 9 6 6m0-6-6 6"/></svg></button>
      <button id="help" class="help" data-i18n-label="paper-pinball.help" aria-expanded="false" aria-controls="overlay"><svg aria-hidden="true"><use href="#book"/></svg><span data-i18n="paper-pinball.help">How to play</span></button>
    </div>
  </header>
  <div class="workspace">
    <div class="stage">
      <div class="cabinet">
        <img class="paper-art" src="./table.svg" alt="" draggable="false">
        <svg id="mechanics" viewBox="0 0 440 540" role="img" data-i18n-label="paper-pinball.board">
          <g id="hardware"></g><g id="effects" aria-hidden="true"></g>
        </svg>
      </div>
      <div id="overlay" class="overlay" hidden>
        <section class="note" role="dialog" aria-labelledby="note-title" tabindex="-1">
          <svg class="note-star" aria-hidden="true"><use href="#ticket-star"/></svg>
          <h2 id="note-title"></h2><p id="note-text"></p><strong id="final-score" hidden></strong>
          <button id="note-action" class="note-button"></button>
        </section>
      </div>
    </div>
    <aside class="dashboard">
      <section class="ticket">
        <div class="ticket-head"><h2 data-i18n="paper-pinball.card">Scorecard</h2><span aria-hidden="true">✧</span></div>
        <div class="score-row"><div class="score-part"><span class="label" data-i18n="paper-pinball.score">Score</span><strong id="score">000000</strong></div>
        <div class="ball-part"><span class="label" data-i18n="paper-pinball.ball">Ball</span><div class="ball-line"><span id="ball-count">1 / 3</span><span id="balls" aria-hidden="true"></span></div></div></div>
        <div class="objective"><div class="objective-head"><span class="label" data-i18n="paper-pinball.lamps">Letter lights</span><span class="bonus-tag" id="bonus-tag">×2</span></div><div id="letters" aria-hidden="true"><i>L</i><i>U</i><i>N</i><i>A</i></div></div>
        <div class="status-line"><span class="status-dot"></span><span id="status" role="status"></span></div>
      </section>
      <section class="controls">
        <h2 class="section-head"><span data-i18n="paper-pinball.controls">Controls</span></h2>
        <div class="buttons">
          <button id="left" class="bat" data-i18n-label="paper-pinball.left" aria-pressed="false"><svg aria-hidden="true"><use href="#bat-icon"/></svg><span data-i18n="paper-pinball.left">Left flipper</span><kbd>←</kbd></button>
          <button id="right" class="bat mirror" data-i18n-label="paper-pinball.right" aria-pressed="false"><svg aria-hidden="true"><use href="#bat-icon"/></svg><span data-i18n="paper-pinball.right">Right flipper</span><kbd>→</kbd></button>
          <button id="spring" class="spring" data-i18n-label="paper-pinball.launch"><span class="fill" aria-hidden="true"></span><svg aria-hidden="true"><use href="#spring-icon"/></svg><span id="spring-label" data-i18n="paper-pinball.launch">Plunger</span><kbd data-i18n="paper-pinball.space">Space</kbd></button>
        </div>
      </section>
    </aside>
  </div>
</main>
<script src="./translations.js"></script>
<script src="./engine.js"></script>
<script src="./game.js"></script>
</body>
</html>
