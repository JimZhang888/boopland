<!doctype html>
<html lang="zh-CN" data-i18n-scope="lightsOut">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3e9">
  <title data-i18n="lightsOut.pageTitle">熄灯之后 · BOOPLAND</title>
  <link rel="icon" type="image/svg+xml" href="cover.svg">
  <link rel="stylesheet" href="style.css">
  <script src="../../i18n.js"></script>
  <script defer src="../../analytics.js"></script>
  <script defer src="locales.js"></script>
  <script defer src="puzzle.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="star-lamp" viewBox="0 0 60 60">
        <g stroke-linecap="round" stroke-linejoin="round">
          <path d="M30 7c2 14 5 18 20 22-14 3-18 8-21 23-3-15-7-19-20-23 14-3 18-7 21-22Z" fill="#e8c77d" stroke="#f5dfa2" stroke-width="1.5"/>
          <path d="m29 45 1-15 13-1m-13 1-13-.8m13 .8V14" fill="none" stroke="#b9955a" opacity=".8" stroke-width="1.3"/>
          <path d="m13 13 4 4m26 25 4 4m-33 0 3-4m27-29-3 4" stroke="#d9bc80" stroke-width="1.5"/>
        </g>
      </symbol>
      <symbol id="moon-lamp" viewBox="0 0 60 60">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M34 12c-12 1-20 10-18 21 2 12 17 19 29 9-9 1-18-4-19-13-1-7 2-13 8-17Z" fill="#718186" fill-opacity=".28" stroke="#a7b4b0" stroke-width="1.8"/>
          <path d="m20 30 1.8 5.2m.2-2.5 1 3M40 19l1 2.7 2.8 1-2.8 1-1 2.8-.9-2.8-2.8-1 2.8-1Z" stroke="#889a9a" stroke-width="1.35"/>
        </g>
      </symbol>
      <symbol id="brand" viewBox="0 0 42 40"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 22 10-13 10 12-3 1-7-8-7 9Zm16-4 8-10 14 15-5-1-9-9-5 7M5 23l1 12 12-.5v-9m4-6 1 14 13-.5-.5-12m-27 6 4-.5v7m14-9 4-.2v4l-4 .2Z"/>
        <path d="m29.5 2 1.3 3 3 1-3 1.4-1.3 3-1-3-3.2-1.3 3-1.2Z" fill="#d0b46e" stroke-width=".85"/></g>
      </symbol>
      <symbol id="back" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
      <symbol id="help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9c.5-3 6-3 5.3.6-.3 1.6-2.8 1.9-2.8 4M12 16.2v.3"/></symbol>
      <symbol id="hint-icon" viewBox="0 0 24 24"><path d="M8.7 14c-4.7-4.4-1.3-10.3 3.5-10 5-.2 7.5 5.9 3.3 10-.8.9-1 1.7-1 2.4H9.7c0-.8-.2-1.6-1-2.4Zm1.2 5h4.2m-3.5 2h2.6"/></symbol>
      <symbol id="undo-icon" viewBox="0 0 24 24"><path d="m9 5-5.5 5.2L9 15m-5.2-4.8h10.7a5.2 5.2 0 0 1 0 10.3h-4"/></symbol>
      <symbol id="reset-icon" viewBox="0 0 24 24"><path d="M4.2 10a7.7 7.7 0 1 1 1.2 7m-1.6-12v5.6h5.5"/></symbol>
      <symbol id="new-icon" viewBox="0 0 24 24"><path d="m3 7 3-.1c4.5 0 6.2 10 11.3 10H21m-4-4 4 4-4 4M3 17h3c2 0 3.2-2.2 4.2-3.7m3.1-3.4C15 7.7 16.4 7 18 7h3m-4-4 4 4-4 4"/></symbol>
      <symbol id="close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
    </defs>
  </svg>
  <div class="shell">
    <header class="topbar">
      <span class="wordmark" aria-label="BOOPLAND"><svg aria-hidden="true"><use href="#brand"/></svg>BOOPLAND</span>
      <nav>
        <button class="top-button help-open" data-i18n-label="lightsOut.help" data-i18n-title="lightsOut.help">
          <svg class="icon"><use href="#help"/></svg><span data-i18n="lightsOut.help">玩法</span>
        </button>
        <a class="top-button back" href="../../games.html"><svg class="icon"><use href="#back"/></svg><span data-i18n="common.back">返回大厅</span></a>
      </nav>
    </header>
    <main>
      <header class="intro">
        <h1><span data-i18n="lightsOut.title">熄灯之后</span><svg viewBox="0 0 55 43" aria-hidden="true"><g fill="#c2a262" stroke="#a08953" stroke-width=".8"><path d="m19 5 2.6 10 8 3-8.3 2.6-3 10-2.8-10-8-3 8.6-2.8Z"/><path d="m38 18 1.5 5.7 5 1.6-5.2 1.5-1.5 6-1.8-6-4.8-1.7 5-1.6Z"/></g><path d="m27 5 2-3m9 9 4-2M8 28l-3 4" fill="none" stroke="#9e9067" stroke-linecap="round"/></svg></h1>
        <p class="rule" data-i18n="lightsOut.intro">轻点一盏灯，让它和上下左右的邻灯一起翻转。试着熄灭整块招牌。</p>
        <p class="goal" data-i18n="lightsOut.goal">熄灭整块招牌。</p>
      </header>
      <div class="play">
        <section class="stage-card" data-i18n-label="lightsOut.boardName">
          <div class="street">
            <div class="board-frame">
              <div class="chains" aria-hidden="true"><i></i><i></i></div>
              <span class="fasteners" aria-hidden="true"></span>
              <div id="board" role="group" data-i18n-label="lightsOut.boardName"></div>
              <div id="win" hidden>
                <div class="ticket">
                  <svg class="win-moon" aria-hidden="true"><use href="#moon-lamp"/></svg>
                  <h2 data-i18n="lightsOut.win">招牌熄灭了</h2>
                  <p id="win-detail"></p>
                  <button id="next" class="primary" data-i18n="lightsOut.next">下一块招牌</button>
                </div>
              </div>
            </div>
          </div>
          <div class="legend">
            <span><svg class="legend-on" aria-hidden="true"><use href="#star-lamp"/></svg><span data-i18n="lightsOut.on">亮灯</span></span>
            <span><svg class="legend-off" aria-hidden="true"><use href="#moon-lamp"/></svg><span data-i18n="lightsOut.off">灭灯</span></span>
          </div>
        </section>
        <aside class="console">
          <section class="modes" role="group" data-i18n-label="lightsOut.difficulty">
            <h2 data-i18n="lightsOut.difficulty">难度</h2>
            <div class="mode-options">
              <button data-size="3" aria-pressed="true"><b>3×3</b><span data-i18n="lightsOut.easy">入门</span></button>
              <button data-size="4" aria-pressed="false"><b>4×4</b><span data-i18n="lightsOut.medium">进阶</span></button>
              <button data-size="5" aria-pressed="false"><b>5×5</b><span data-i18n="lightsOut.hard">挑战</span></button>
            </div>
          </section>
          <div class="meters">
            <div><span data-i18n="lightsOut.lit">亮灯数</span><strong><span id="lit">0</span><small> / <span id="total">9</span></small></strong></div>
            <div><span data-i18n="lightsOut.moves">步数</span><strong id="moves">0</strong></div>
          </div>
          <div class="actions">
            <button id="hint" class="primary" data-i18n-title="lightsOut.hint"><svg class="icon"><use href="#hint-icon"/></svg><span data-i18n="lightsOut.hint">提示一步</span></button>
            <div class="history-actions">
              <button id="undo" data-i18n-label="lightsOut.undo" data-i18n-title="lightsOut.undo"><svg class="icon"><use href="#undo-icon"/></svg><span data-i18n="lightsOut.undo">撤一步</span></button>
              <button id="reset" data-i18n-label="lightsOut.reset" data-i18n-title="lightsOut.reset"><svg class="icon"><use href="#reset-icon"/></svg><span data-i18n="lightsOut.reset">重开原题</span></button>
            </div>
            <button id="new" data-i18n-title="lightsOut.new"><svg class="icon"><use href="#new-icon"/></svg><span data-i18n="lightsOut.new">换一题</span></button>
          </div>
        </aside>
      </div>
    </main>
  </div>
  <div class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <div class="dialog-head"><h2 id="help-title" data-i18n="lightsOut.help">玩法</h2><button id="close-help" class="top-button" autofocus data-i18n-label="lightsOut.close"><svg class="icon"><use href="#close"/></svg></button></div>
    <svg class="example" viewBox="0 0 110 110" aria-hidden="true"><defs><pattern id="squares" width="34" height="34" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="30" height="30" rx="4" fill="#e6e6d8" stroke="#a5ab99"/></pattern></defs>
      <g transform="translate(4 4)"><rect width="102" height="102" fill="url(#squares)"/><g fill="#576861"><rect x="36" y="2" width="30" height="30" rx="4"/><rect x="2" y="36" width="30" height="30" rx="4"/><rect x="36" y="36" width="30" height="30" rx="4"/><rect x="70" y="36" width="30" height="30" rx="4"/><rect x="36" y="70" width="30" height="30" rx="4"/></g><g stroke="#e6c67f" fill="none" stroke-width="1.8"><path d="M51 12v10m-5-5h10M51 80v10m-5-5h10M12 51h10m-5-5v10m63-5h10m-5-5v10"/><circle cx="51" cy="51" r="7"/></g></g>
    </svg>
    <p data-i18n="lightsOut.intro"></p><p data-i18n="lightsOut.helpHint"></p><p data-i18n="lightsOut.keys"></p>
  </dialog>
</body>
</html>
