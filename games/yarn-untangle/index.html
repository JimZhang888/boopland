<!doctype html>
<html lang="zh-CN" data-i18n-scope="yarn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <title data-i18n="pageTitle">毛线解结 · Boopland</title>
  <link rel="icon" type="image/svg+xml" href="./cover.svg">
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <div class="game-shell">
    <header class="topbar">
      <a class="back" href="../../games.html"><span aria-hidden="true">↶</span><span data-i18n="common.back">返回大厅</span></a>
      <h1><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="18" cy="19" r="12"/><path d="M9 10q15 0 20 16M6 17q12-6 23 3M7 24q9-10 21-11M12 29q0-14 10-21M26 29c2 8 10 8 10 1"/></svg><span data-i18n="name">毛线解结</span></h1>
      <button type="button" id="help" class="icon-button" data-i18n-label="help" aria-label="玩法说明">?</button>
    </header>
    <main class="workspace">
      <section class="paper" data-i18n-label="boardSection" aria-label="毛线桌面">
        <div class="paper-heading"><div><span class="eyebrow" data-i18n="eyebrow">慢慢理，慢慢来</span><h2 id="level-title"></h2></div><span class="page-number" id="page-number" aria-hidden="true"></span></div>
        <div class="board-space" id="board-space">
          <svg id="board" viewBox="0 0 1000 1000" role="group" data-i18n-label="boardLabel" aria-label="拖动毛线节点，让所有线段分开" aria-describedby="status">
            <defs><pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="1.4" fill="#858b73" opacity=".16"/></pattern></defs>
            <rect x="25" y="25" width="950" height="950" rx="28" fill="url(#dots)"/>
            <path class="corner-mark" d="M22 76V24h52M925 24h51v52M24 925v51h52M926 976h50v-52"/>
            <g id="hint-layer" aria-hidden="true"></g>
            <g id="yarn-layer" aria-hidden="true"></g>
            <g id="cross-layer" aria-hidden="true"></g>
            <g id="node-layer"></g>
            <g id="petal-layer" aria-hidden="true"></g>
          </svg>
          <div class="complete-stamp" id="complete-stamp" hidden><span aria-hidden="true">✳</span><span data-i18n="untangled">舒展开了</span></div>
        </div>
        <div class="legend"><span><i class="dot-symbol"></i><span data-i18n="dragLegend">捏住圆点，轻轻拖动</span></span><span><i class="cross-symbol">×</i><span data-i18n="crossLegend">还有交叉的地方</span></span></div>
      </section>
      <aside class="notebook" id="notebook">
        <div class="note-heading"><span data-i18n="notebook">解结小记</span><span aria-hidden="true">✳</span></div>
        <div class="intro"><h2 data-i18n="intro">让绕在一起的，<br>慢慢分开。</h2><p data-i18n="subtitle">不赶时间，只理一团小小的毛线。</p></div>
        <div class="stats"><div class="stat"><span data-i18n="crossings">剩余交叉</span><strong id="cross-count">0</strong><div class="thread-meter" aria-hidden="true"><i id="thread-meter"></i></div></div><div class="stat"><span data-i18n="moves">轻轻挪动</span><strong id="move-count">0</strong><small data-i18n="noRush">没有步数限制</small></div></div>
        <div class="status-note" id="status-note"><span id="status-icon" aria-hidden="true">↗</span><p id="status" role="status" aria-live="polite" aria-atomic="true"></p></div>
        <button type="button" id="next" class="primary" hidden><span data-i18n="next">下一团毛线</span><span aria-hidden="true">→</span></button>
        <div class="notebook-bottom"><svg class="yarn-doodle" viewBox="0 0 210 72" aria-hidden="true"><path d="M5 52c18 15 37 10 38-7 2-19-26-12-16 3s49 16 61-10"/><circle cx="111" cy="32" r="27"/><path d="M88 18q26-4 46 28M85 31q23-12 52 2M89 48q11-27 38-36M101 57q-6-28 15-51M133 48c6 24 27 19 35 6s22-11 36 0"/></svg><p class="margin-note" data-i18n="marginNote">每个结，都有松开的那一刻。</p><div class="collection"><span id="collection-count"></span><span aria-hidden="true">↙</span></div><button id="levels" type="button" class="level-button"><span aria-hidden="true">▦</span><span data-i18n="levels">毛线收集册</span><span aria-hidden="true">↗</span></button></div>
      </aside>
    </main>
    <footer class="toolbar"><span class="footer-note" data-i18n="footer">把一点点耐心，留给自己。</span><div class="tools"><button type="button" id="undo"><span aria-hidden="true">↶</span><span data-i18n="undo">撤销</span></button><button type="button" id="reset"><span aria-hidden="true">⟲</span><span data-i18n="reset">重新理</span></button><button type="button" id="hint" aria-pressed="false"><span aria-hidden="true">✧</span><span data-i18n="hint">小提示</span></button></div><span class="brand" aria-hidden="true">boopland <i>❧</i></span></footer>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" type="button" class="icon-button" data-i18n-label="close" aria-label="关闭">×</button></div><div id="dialog-content"></div></dialog>
  <noscript>请启用 JavaScript 来玩毛线解结。 / Please enable JavaScript to play Yarn Untangle.</noscript>
  <script src="../../i18n.js"></script>
  <script src="./translations.js"></script>
  <script src="./engine.js"></script>
  <script src="./game.js"></script>
</body>
</html>
