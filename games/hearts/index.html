<!doctype html>
<html lang="zh-CN" data-i18n-scope="hearts">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <meta name="description" data-i18n-content="description" content="一桌纸牌，三个牌友。避开红心与黑桃 Q，让分数轻一点。">
  <title data-i18n="title">红心大战 · Boopland</title>
  <link rel="icon" type="image/svg+xml" href="./cover.svg">
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <div class="game-shell">
    <header class="topbar">
      <a class="back-link" href="../../games.html" data-i18n-label="common.back"><span aria-hidden="true">←</span><span class="back-copy" data-i18n="common.back">返回大厅</span></a>
      <h1><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M21 35C16 31 3 22 4 13 5 4 16 3 21 11 27 2 38 6 38 14 38 23 26 33 21 35Z"/><path d="m10 12-2 6m5-10-2 2m-1 11 5 7m9 5 8-8"/></svg><span data-i18n="name">红心大战</span></h1>
      <div class="header-actions">
        <button id="pause" class="icon-button" data-i18n-label="pause" data-i18n-title="pause">Ⅱ</button>
        <button id="help" class="icon-button" data-i18n-label="help" data-i18n-title="help">?</button>
      </div>
    </header>
    <main class="notebook" data-i18n-label="gameArea">
      <div class="scorebar">
        <div class="round-mark"><span id="round-label"></span><span id="trick-label"></span></div>
        <span id="hearts-state" class="hearts-state"></span>
        <button id="scores" class="text-button" data-i18n="scores">计分簿</button>
      </div>
      <section id="table" class="table" data-i18n-label="table">
        <div class="table-outline" aria-hidden="true"></div>
        <div id="seat-1" class="seat seat-left"></div>
        <div id="seat-2" class="seat seat-top"></div>
        <div id="seat-3" class="seat seat-right"></div>
        <div id="table-note" class="table-note"><span class="note-art" aria-hidden="true">♡</span><strong id="note-title"></strong><p id="note-copy"></p></div>
        <div id="trick-cards" class="trick-cards"></div>
        <div class="table-caption" aria-hidden="true"><span>♥ +1</span><span>♠ Q +13</span></div>
      </section>
      <section class="hand-area" data-i18n-label="yourHand">
        <div class="hand-heading"><div id="seat-0" class="you-seat"></div><span id="hand-note"></span></div>
        <div id="hand" class="hand"></div>
      </section>
      <div class="status-line"><span class="status-dot" aria-hidden="true"></span><p id="status" role="status" aria-live="polite"></p></div>
      <nav class="tools" data-i18n-label="tools">
        <button id="hint" class="tool-button"><span aria-hidden="true">✧</span><span data-i18n="hint">提示</span></button>
        <button id="last-trick" class="tool-button" data-i18n="lastTrick">上一墩</button>
        <button id="new-game" class="tool-button" data-i18n="newGame">新对局</button>
        <button id="primary" class="primary-button"></button>
      </nav>
    </main>
    <footer class="page-foot"><span aria-hidden="true">♧</span><span id="footer-note" data-i18n="footer">把红心留在纸上，把轻松留给自己。</span><span aria-hidden="true">♧</span></footer>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-sheet">
      <header class="dialog-header"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" data-i18n-label="close">×</button></header>
      <div id="dialog-content" class="dialog-content"></div>
      <div id="dialog-actions" class="dialog-actions"></div>
      <a class="dialog-back" href="../../games.html" data-i18n="common.back">返回大厅</a>
    </div>
  </dialog>
  <script src="../../i18n.js"></script>
  <script src="./translations.js"></script>
  <script src="./engine.js"></script>
  <script src="./game.js"></script>
</body>
</html>
