<!DOCTYPE html>
<html lang="zh-CN" data-i18n-scope="slingPost">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <title data-i18n="pageTitle">弹弓快递 · Boopland</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <main class="game-shell">
    <header class="topbar">
      <a class="back" href="../../games.html"><span aria-hidden="true">↶</span><span data-i18n="common.back">返回大厅</span></a>
      <div class="heading"><span class="mini-mark" aria-hidden="true">↗</span><h1 data-i18n="name">弹弓快递</h1><span class="edition" data-i18n="tagline">把期待，送进远方。</span></div>
      <div class="tools"><button id="sound" class="icon-button" type="button" aria-pressed="false" data-i18n-label="soundOn">♪<span id="mute-mark" aria-hidden="true">╱</span></button><button id="help" class="icon-button" type="button" data-i18n-label="help">?</button><button id="pause" class="icon-button" type="button" data-i18n-label="pause">Ⅱ</button></div>
    </header>

    <section class="play-layout">
      <div class="postcard">
        <div class="scene-top"><div class="address"><span class="eyebrow" data-i18n="routeLabel">乡间投递路线</span><h2 id="level-heading"></h2></div><div class="weather"><span id="wind-arrow" aria-hidden="true">⌁</span><div><span data-i18n="wind">今日风向</span><strong id="wind-label"></strong></div></div></div>
        <div class="stage" id="stage">
          <canvas id="game" tabindex="0" role="img" data-i18n-label="canvasLabel" aria-describedby="play-hint"></canvas>
          <div class="stage-note" id="stage-note"><span aria-hidden="true">↙</span><span data-i18n="dragHint">拉住包裹，向后拖一拖</span></div>
          <div class="scene-overlay" id="overlay" hidden>
            <section class="result-paper" aria-labelledby="result-title"><span class="result-stamp" id="result-stamp" aria-hidden="true">✓</span><p class="eyebrow" id="result-kicker"></p><h2 id="result-title"></h2><div id="result-stars" class="result-stars" aria-hidden="true"></div><p id="result-note"></p><div class="result-actions"><button id="result-main" type="button" class="primary"></button><button id="result-retry" type="button" data-i18n="retry">再投一次</button></div></section>
          </div>
        </div>
        <div class="scene-bottom"><p id="play-hint" role="status" aria-live="polite"></p><span class="postmark" aria-hidden="true">BOOPLAND POST <i>✳</i></span></div>
      </div>

      <aside class="delivery-desk">
        <section class="delivery-note"><div class="note-top"><span class="eyebrow" data-i18n="deliveryNote">投递手记</span><span class="postal-number" id="postal-number">01 / 08</span></div><div class="parcel-doodle" aria-hidden="true"><svg viewBox="0 0 140 96"><path d="m31 32 48-17 35 20-47 20Z" fill="#e7d9b8"/><path d="m31 32 36 23v30L31 61Z" fill="#d5bd96"/><path d="m67 55 47-20v31L67 85Z" fill="#e4cfac"/><path d="m31 32 48-17 35 20v31L67 85 31 61Zm0 0 36 23 47-20M67 55v30M54 24l37 21v31"/><path d="m80 59 23-10v14L80 73Z" fill="#faf7ed"/><path d="m83 61 15-6m-15 10 9-4M17 34 6 30m15 14L5 45m20 11-10 5M119 23l6-9m1 18 9-2"/></svg></div><h3 data-i18n="mission">这一站的小目标</h3><p id="mission-text"></p><div class="attempts"><span data-i18n="parcels">剩余包裹</span><strong id="attempts" aria-live="polite"></strong></div><div class="best-row"><span data-i18n="best">本站最佳</span><span id="level-best"></span></div></section>
        <section class="aim-controls" aria-labelledby="aim-title"><div class="aim-title"><h3 id="aim-title" data-i18n="fineTune">微调这一投</h3><span aria-hidden="true">↗</span></div><div class="sliders"><label for="angle"><span data-i18n="angle">角度</span><output id="angle-value" for="angle">42°</output><input id="angle" type="range" min="5" max="80" value="42" step="1"></label><label for="power"><span data-i18n="power">力度</span><output id="power-value" for="power">78%</output><input id="power" type="range" min="8" max="100" value="78" step="1"></label></div><button id="launch" class="primary launch" type="button"><span data-i18n="launch">寄出包裹</span><span aria-hidden="true">↗</span></button><p class="keyboard-note" data-i18n="keys">方向键微调 · 空格发射</p></section>
        <div class="desk-actions"><button id="route" type="button"><span aria-hidden="true">▦</span><span data-i18n="route">投递地图</span><span id="total-stars">0 / 24</span></button><button id="restart" type="button" data-i18n-label="restart">↻</button></div>
      </aside>
    </section>
    <footer class="footer"><span class="brand">boopland<span>.</span></span><p data-i18n="footer">山间有风，邮差有一把弹弓。</p><span id="save-note" data-i18n="saved">邮路进度自动保存</span></footer>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" type="button" data-i18n-label="close">×</button></div><div id="help-content" hidden><ol><li data-i18n="helpDrag"></li><li data-i18n="helpWind"></li><li data-i18n="helpBounce"></li><li data-i18n="helpSwitch"></li><li data-i18n="helpStars"></li><li data-i18n="helpKeys"></li></ol><p class="help-foot" data-i18n="helpTrail"></p></div><div id="route-content" hidden><p data-i18n="routeIntro"></p><div id="route-grid"></div></div></dialog>
  <noscript>请启用 JavaScript 来投递包裹。 / Please enable JavaScript to play.</noscript>
  <script src="../../i18n.js"></script>
  <script src="./translations.js"></script>
  <script src="./engine.js"></script>
  <script src="./scene.js"></script>
  <script src="./game.js"></script>
</body>
</html>
