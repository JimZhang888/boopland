<!doctype html>
<html lang="zh-CN" data-i18n-scope="paperHook">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <title data-i18n="paperHook.pageTitle">纸间飞钩 · Boopland</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="app">
    <header class="topbar">
      <a class="back" href="../../games.html"><span aria-hidden="true">↶</span><span data-i18n="common.back">返回大厅</span></a>
      <div class="heading"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M25 4v16c0 12-16 14-16 3v-5m0 0-4 6m4-6 5 5"/><circle cx="25" cy="5" r="3"/></svg><h1 data-i18n="paperHook.name">纸间飞钩</h1><span class="edition">BOOPLAND / 012</span></div>
      <nav class="tools" data-i18n-label="paperHook.settings">
        <button id="sound" class="icon-button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4Z"/><path id="sound-mark" d="m16 9 6 6m0-6-6 6"/></svg></button>
        <button id="help" class="icon-button" data-i18n-label="paperHook.help" data-i18n-title="paperHook.help">?</button>
        <button id="pause" class="icon-button" data-i18n-label="paperHook.pause" data-i18n-title="paperHook.pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
      </nav>
    </header>

    <section class="play-paper" data-i18n-label="paperHook.gameLabel">
      <div class="paper-top">
        <button class="level-button" id="levels"><span class="level-number" id="level-number">01</span><span><small id="chapter-name"></small><strong id="level-name"></strong></span><span class="grid-mark" aria-hidden="true">▦</span></button>
        <div class="journey"><span data-i18n="paperHook.journey">这一小段旅程</span><div id="progress" class="progress" role="progressbar" data-i18n-label="paperHook.journey" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress-fill"></i></div><span id="progress-text">0%</span></div>
        <div class="star-score"><span data-i18n="paperHook.collected">收集星光</span><strong id="stars" aria-label="0 / 3">☆ ☆ ☆</strong></div>
        <button id="restart" class="icon-button" data-i18n-label="paperHook.restart" data-i18n-title="paperHook.restart">↻</button>
      </div>
      <div class="stage" id="stage">
        <canvas id="game" tabindex="0" data-i18n-label="paperHook.canvas" data-i18n="paperHook.canvas">按住鼠标、触屏或空格挂钩，松开飞跃。</canvas>
        <div class="scene-label" aria-hidden="true"><span id="scene-caption"></span><i></i></div>
        <div class="scene-status" id="scene-status" role="status" aria-live="polite"></div>
        <div class="overlay" id="overlay">
          <section class="note" role="dialog" aria-labelledby="note-title">
            <div class="note-doodle" id="note-doodle" aria-hidden="true"><svg viewBox="0 0 160 75"><path d="M107 3 71 39" stroke-dasharray="3 4"/><circle cx="108" cy="5" r="4"/><circle cx="67" cy="37" r="7"/><path d="m64 44-9 16m5-8-13-6m13 6 19-9m-24 17-15 8m15-8 8 13"/><path d="m65 45 13 7 8-4" class="scarf"/><path d="M18 33q13-12 25-2m72 24q14 3 23-10" stroke-dasharray="3 5"/></svg></div>
            <p class="eyebrow" id="note-eyebrow"></p>
            <h2 id="note-title"></h2>
            <p id="note-description"></p>
            <div class="result-stars" id="result-stars" hidden></div>
            <div class="result-details" id="result-details" hidden></div>
            <div class="note-actions"><button class="primary" id="primary-action"></button><button id="secondary-action" hidden></button></div>
            <p class="note-foot" id="note-foot"></p>
          </section>
        </div>
      </div>
      <div class="paper-bottom"><span class="tip-mark" aria-hidden="true">✧</span><p id="tip"></p><span class="page-stamp" id="page-stamp">01 / 12</span></div>
    </section>

    <footer class="controls">
      <div class="control-note"><span class="input-keys" aria-hidden="true">↖ &nbsp; / &nbsp; ⎵</span><span data-i18n="paperHook.input">鼠标 · 触屏 · 空格</span></div>
      <button class="hook-button" id="hook" aria-pressed="false"><span class="hook-symbol" aria-hidden="true">⌁</span><span id="hook-label"></span><span class="hold-dot" aria-hidden="true"></span></button>
      <div class="little-note"><span data-i18n="paperHook.footer">借一点风，飞过这一页。</span><svg viewBox="0 0 65 28" aria-hidden="true"><path d="M2 19q23 14 40-5m-8-3 18-7-5 18-6-8-7-3 13-4"/></svg></div>
    </footer>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" data-i18n-label="paperHook.close">×</button></div>
    <div id="help-content" hidden><ol><li data-i18n="paperHook.help1"></li><li data-i18n="paperHook.help2"></li><li data-i18n="paperHook.help3"></li><li data-i18n="paperHook.help4"></li></ol><p class="help-note" data-i18n="paperHook.shortcuts"></p></div>
    <div id="level-content" hidden><p class="help-note" id="total-stars"></p><div id="level-grid"></div><p class="help-note" data-i18n="paperHook.saveNote"></p></div>
  </dialog>
  <script src="../../i18n.js"></script>
  <script src="translations.js"></script>
  <script src="engine.js"></script>
  <script src="scene.js"></script>
  <script src="game.js"></script>
</body>
</html>
