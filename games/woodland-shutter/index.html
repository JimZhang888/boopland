<!doctype html>
<html lang="zh-CN" data-i18n-scope="woodland-shutter">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e5">
  <title data-i18n="woodland-shutter.title">林间快门</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="../../analytics.js"></script>
  <script defer src="../../i18n.js"></script>
  <script defer src="words.js"></script>
  <script defer src="field.js"></script>
  <script defer src="illustration.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true"><defs>
  <symbol id="ic-back" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></symbol>
  <symbol id="ic-shutter" viewBox="0 0 24 24"><path d="M3 7.5h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.6"/></symbol>
  <symbol id="ic-focus" viewBox="0 0 24 24"><path d="M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6"/><circle cx="12" cy="12" r="3.2"/></symbol>
  <symbol id="ic-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 8q5 4 0 8m3-11q7 7 0 14"/></symbol>
  <symbol id="ic-muted" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 9l6 6m0-6-6 6"/></symbol>
  <symbol id="ic-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9q.3-3.4 3.3-2.7c3.6.9 2.4 4 .1 5.2q-1 .7-1 2M12 16.8v.2"/></symbol>
  <symbol id="ic-book" viewBox="0 0 24 24"><path d="M3 4.5q5-1.6 9 1.2 4-2.8 9-1.2V19q-5-1.4-9 1-4-2.4-9-1zM12 6v14"/></symbol>
  <symbol id="ic-leaf" viewBox="0 0 24 24"><path d="M4 18C1 7 9 6 20 4c-1 12-6 17-14 13m-3 4L17 7m-7 6 4 0"/></symbol>
  <symbol id="ic-hide" viewBox="0 0 24 24"><path d="m2 12 10-8 10 8M5 11v9h14v-9m-11 1h8v3H8z"/></symbol>
  <symbol id="ic-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16m10-16v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/></symbol>
  <symbol id="ic-close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
</defs></svg>
<main class="shell">
  <header class="nav">
    <a class="back" href="../../games.html"><svg><use href="#ic-back"/></svg><span data-i18n="common.back">返回大厅</span></a>
    <div class="tools">
      <button id="book-button" class="round mobile-guide" data-i18n-label="woodland-shutter.guide"><svg><use href="#ic-book"/></svg></button>
      <button id="sound" class="round"><svg><use id="speaker" href="#ic-muted"/></svg></button>
      <button id="help" class="round" data-i18n-label="woodland-shutter.help" data-i18n-title="woodland-shutter.help"><svg><use href="#ic-help"/></svg></button>
    </div>
  </header>
  <div class="mast">
    <div class="brand"><img src="icon.svg" width="52" height="52" alt=""><h1 data-i18n="woodland-shutter.title">林间快门</h1></div>
    <div class="stock"><svg><use href="#ic-film"/></svg><span data-i18n="woodland-shutter.film">底片</span><b id="film">06</b><small>/ 06</small></div>
  </div>
  <div class="workspace">
    <section class="camera">
      <div id="stage" class="stage" tabindex="0" role="group" data-i18n-label="woodland-shutter.stage">
        <svg id="land" class="land" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <use id="land-use"/><g id="creature"></g><g id="leaves"></g><g id="signal"></g>
          <g id="finder"><path class="bracket-shadow" d="M-77 -34v-20h20m114 0h20v20m0 68v20h-20m-114 0h-20v-20"/><path class="bracket" d="M-77 -34v-20h20m114 0h20v20m0 68v20h-20m-114 0h-20v-20"/><path class="cross" d="M-8 0h5m6 0h5M0 -8v5m0 6v5"/><circle r="2" class="dot"/></g>
        </svg>
        <div class="site-label"><svg><use href="#ic-hide"/></svg><span data-i18n="woodland-shutter.hide">林溪观察棚</span></div>
        <span class="corner top-right"></span><span class="corner bottom-left"></span><span class="corner bottom-right"></span>
        <div id="flash" class="flash"></div>
      </div>
      <div class="cue-row"><svg><use href="#ic-leaf"/></svg><span id="cue" aria-live="polite"></span><span id="focus-light" aria-hidden="true"></span></div>
      <div class="controls">
        <button id="focus" class="focus"><svg><use href="#ic-focus"/></svg><span id="focus-label"></span><kbd>F</kbd><i id="meter"></i></button>
        <button id="shoot" class="shoot"><svg><use href="#ic-shutter"/></svg><span data-i18n="woodland-shutter.shutter">按快门</span><kbd>␣</kbd></button>
      </div>
    </section>
    <aside class="notes">
      <div class="section-title"><div><svg><use href="#ic-book"/></svg><h2 data-i18n="woodland-shutter.guide">观察手记</h2></div><b id="count">0 / 6</b></div>
      <div id="guide" class="guide-grid"></div>
      <div class="film-block"><div class="section-title"><div><svg><use href="#ic-film"/></svg><h2 data-i18n="woodland-shutter.roll">本卷底片</h2></div></div><div id="strip" class="strip"></div><p id="print-note"></p></div>
    </aside>
  </div>
</main>
<svg class="symbols" aria-hidden="true"><defs id="landscapes"></defs></svg>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="sheet">
  <div class="dialog-top"><h2 id="dialog-title"></h2><button class="round" id="dismiss" data-i18n-label="woodland-shutter.close"><svg><use href="#ic-close"/></svg></button></div>
  <div id="dialog-body"></div>
</div></dialog>
</body></html>
