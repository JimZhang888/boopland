<!doctype html>
<html lang="zh-CN" data-i18n-scope="billiards">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efede5">
  <title data-i18n="billiards.pageTitle">纸上台球 · Boopland</title>
  <link rel="icon" href="cover.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="back" href="../../games.html" data-i18n-label="common.back" title="返回大厅"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h13"/></svg><span data-i18n="common.back">返回大厅</span></a>
      <div class="brand"><span class="brand-ball" aria-hidden="true">8</span><div><h1 data-i18n="billiards.name">纸上台球</h1><span class="brand-sub">BOOPLAND BILLIARDS CLUB</span></div></div>
      <nav class="tools" data-i18n-label="billiards.tools">
        <button id="sound" class="icon-button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4Z"/><path id="sound-mark" d="m16 9 5 6m0-6-5 6"/></svg></button>
        <button id="help" class="icon-button" data-i18n-label="billiards.help" data-i18n-title="billiards.help">?</button>
        <button id="pause" class="icon-button" data-i18n-label="billiards.pause" data-i18n-title="billiards.pause">Ⅱ</button>
      </nav>
    </header>
    <section class="scoreboard" data-i18n-label="billiards.scoreboard">
      <div class="mode-control"><label class="sr-only" for="mode" data-i18n="billiards.mode">玩法</label><select id="mode"><option value="solo" data-i18n="billiards.solo">清台练习</option><option value="versus" data-i18n="billiards.versus">双人八球</option></select><span id="mode-caption" class="mode-caption"></span></div>
      <div class="score-stats"><div><small data-i18n="billiards.pots">进球</small><strong><span id="pots">0</span><i>/15</i></strong></div><div><small data-i18n="billiards.shots">杆数</small><strong id="shots">0</strong></div><div class="best-stat"><small data-i18n="billiards.best">最佳杆数</small><strong id="best">—</strong></div></div>
      <button id="restart" class="icon-button" data-i18n-label="billiards.restart" data-i18n-title="billiards.restart">↻</button>
    </section>
    <section class="stage" id="stage" data-i18n-label="billiards.table">
      <canvas id="game" tabindex="0" data-i18n-label="billiards.canvas" data-i18n="billiards.canvas">点击瞄准，调整力度后击球。</canvas>
      <div class="table-caption" aria-hidden="true"><span>EST. 2026</span><i></i><span>TAKE YOUR SHOT.</span></div>
      <div class="overlay" id="overlay" hidden><div class="result-card"><div class="result-ball" aria-hidden="true">8</div><p class="eyebrow" id="result-kicker"></p><h2 id="result-title"></h2><p id="result-description"></p><button class="primary" id="result-action"></button></div></div>
    </section>
    <section class="shot-panel" data-i18n-label="billiards.controls">
      <div class="shot-info"><div class="status-line"><span id="status-dot"></span><p id="status" role="status" aria-live="polite"></p></div><div class="ball-tray" id="ball-tray" aria-hidden="true"></div></div>
      <div class="shot-controls">
        <div class="fine-aim"><button id="aim-left" class="icon-button" data-i18n-label="billiards.aimLeft">↶</button><span><small data-i18n="billiards.aim">微调</small><output id="angle-value">0°</output></span><button id="aim-right" class="icon-button" data-i18n-label="billiards.aimRight">↷</button></div>
        <label class="power-control" for="power"><span><small data-i18n="billiards.power">击球力度</small><output id="power-value">70%</output></span><input id="power" type="range" min="5" max="100" value="70"></label>
        <button class="primary strike" id="strike"><span id="strike-label" data-i18n="billiards.strike">击球</span><svg viewBox="0 0 28 20" aria-hidden="true"><path d="M2 10h23m-7-6 7 6-7 6"/></svg></button>
      </div>
    </section>
    <footer><span data-i18n="billiards.hint">点击球桌瞄准 · 拉动白球蓄力 · 松手击球</span><span class="footer-note" data-i18n="billiards.footer">一方绿绒，一段闲暇。</span></footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" data-i18n-label="billiards.close">×</button></div><div id="help-content"><h3 data-i18n="billiards.controls"></h3><p data-i18n="billiards.helpAim"></p><p data-i18n="billiards.helpKeys"></p><h3 data-i18n="billiards.solo"></h3><p data-i18n="billiards.helpSolo"></p><h3 data-i18n="billiards.versus"></h3><p data-i18n="billiards.helpVersus"></p><p data-i18n="billiards.helpFoul"></p><p data-i18n="billiards.helpEight"></p></div><div id="confirm-content" hidden><p data-i18n="billiards.confirmText"></p><div class="dialog-actions"><button class="secondary" id="cancel" data-i18n="billiards.cancel"></button><button class="primary" id="confirm" data-i18n="billiards.newGame"></button></div></div></dialog>
  <script src="../../i18n.js"></script><script src="translations.js"></script><script src="engine.js"></script><script src="scene.js"></script><script src="game.js"></script>
</body>
</html>
