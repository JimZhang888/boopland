<!doctype html>

</head><body>

<symbol id="i-next" viewBox="0 0 24 24"><path d="m13 5 7 7-7 7M3 12h16"/></symbol>

<div class="shell">
<header class="mast"><div class="brand"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-roll"/></svg></span><h1 data-i18n="music-box-roll.title">手摇八音盒</h1></div>
<nav class="tools"><button id="sound" class="tool" data-i18n-label="music-box-roll.mute" data-i18n-title="music-box-roll.mute"><svg class="icon" aria-hidden="true"><use href="#i-sound"/></svg></button><button id="help" class="tool" data-i18n-label="music-box-roll.help" data-i18n-title="music-box-roll.help"><svg class="icon" aria-hidden="true"><use href="#i-help"/></svg></button><a class="home" href="../../games.html" data-i18n-label="common.back" data-i18n-title="common.back"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span data-i18n="common.back">返回大厅</span></a></nav></header>
<main class="bench">
<aside class="side">
<button id="instrument" class="instrument" data-i18n-label="music-box-roll.crankHelp" data-i18n-title="music-box-roll.crankHelp">
<span class="mechanism"><img src="box.svg" alt="" draggable="false"><svg aria-hidden="true" class="handle" viewBox="0 0 400 250"><g class="arm" stroke="#414c52" stroke-linecap="round" stroke-linejoin="round"><path d="M290 152q3 1 4-3l8-32q1-4 5-3l13 4" stroke-width="5" fill="none"/><path d="m290 151q2 1 3-3l8-32q2-4 6-3l13 4" stroke="#cebfa1" fill="none" stroke-width="2"/>
<path d="M316 111q3-2 7 0l20 7q5 3 2 10-2 5-6 4l-22-8q-6-4-1-13Z" fill="#aa7b59" stroke-width="1.6"/><path d="m320 114 19 7m-20-3 12 4" stroke="#d6ad83"/>
</g></svg></span><span class="crank-caption"><svg class="icon" aria-hidden="true"><use href="#i-crank"/></svg><span data-i18n="music-box-roll.crank">摇柄试听</span></span>
</button>
<section class="catalogue"><div class="catalogue-heading"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><h2 data-i18n="music-box-roll.book">曲目册</h2><small id="progress"></small></div><div id="songs"></div></section>
</aside>
<section class="work">
<header class="work-head"><div><div id="order" class="order"></div><h2 id="songTitle"></h2><p id="brief"></p></div><svg class="track-illustration" aria-hidden="true"><use href="#i-bird"/></svg></header>
<section id="reference" class="reference"><div class="section-title"><h3><svg class="icon" aria-hidden="true"><use href="#i-note"/></svg><span data-i18n="music-box-roll.reference">参考谱</span></h3><button id="listen" class="listen"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg><span></span></button></div>
<div id="refScore" class="ref-score" role="img"></div></section>
<section class="editor"><div class="section-title"><h3><svg class="icon" aria-hidden="true"><use href="#i-roll"/></svg><span data-i18n="music-box-roll.roll">打孔纸带</span></h3><button class="reset" id="reset" data-i18n-label="music-box-roll.reset" data-i18n-title="music-box-roll.reset"><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg></button></div>
<div class="paper"><div class="perfs"></div><div class="matrix" role="group" id="matrix" data-i18n-label="music-box-roll.roll"></div><div class="perfs"></div></div></section>
<div id="status" class="status" role="status"></div>
<div class="transport"><button class="primary" id="play"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg><span></span></button><button class="submit" id="submit"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span></span></button><span class="meter" aria-hidden="true">♩ <b id="bpm">96</b> <i></i> 4/4</span></div>
</section>
</main>
</div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="close" class="tool" data-i18n-label="music-box-roll.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><div id="dialogContent"></div><form method="dialog" class="dialog-actions"><button id="cancel" value="cancel"></button><button id="accept" value="accept" class="primary"></button></form></dialog>
</body></html>
