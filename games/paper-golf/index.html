<!doctype html>
<html lang="zh-CN" data-i18n-scope="paperGolf">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <title data-i18n="paperGolf.pageTitle">纸上迷你高尔夫 · Boopland</title>
  <link rel="icon" href="cover.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="back" href="../../games.html"><span aria-hidden="true">↶</span><span data-i18n="common.back">返回大厅</span></a>
      <div class="brand"><svg viewBox="0 0 34 36" aria-hidden="true"><path d="M13 29V4l15 5-15 6M7 30q8 4 16 0"/><ellipse cx="12" cy="31" rx="9" ry="2"/></svg><h1 data-i18n="paperGolf.name">纸上迷你高尔夫</h1></div>
      <nav class="tools" data-i18n-label="paperGolf.tools">
        <button class="icon-button" id="sound" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5-5 4H2v6h3l5 4Z"/><path id="sound-mark" d="m15 9 6 6m0-6-6 6"/></svg></button>
        <button class="icon-button" id="help" data-i18n-label="paperGolf.help" data-i18n-title="paperGolf.help">?</button>
        <button class="icon-button" id="pause" data-i18n-label="paperGolf.pause" data-i18n-title="paperGolf.pause">Ⅱ</button>
      </nav>
    </header>
    <section class="notebook" data-i18n-label="paperGolf.course">
      <div class="paper-top">
        <button id="scorecard" class="hole-heading" data-i18n-title="paperGolf.scorecard"><b id="hole-number">01</b><span><small id="chapter"></small><strong id="hole-name"></strong></span><span class="grid-icon" aria-hidden="true">▦</span></button>
        <div class="stats"><div><span data-i18n="paperGolf.strokes">杆数</span><strong id="strokes">0</strong></div><div><span data-i18n="paperGolf.par">标准杆</span><strong id="par">3</strong></div><div><span data-i18n="paperGolf.best">最佳</span><strong id="best">—</strong></div></div>
        <button id="restart" class="icon-button" data-i18n-label="paperGolf.restart" data-i18n-title="paperGolf.restart">↻</button>
      </div>
      <div class="stage" id="stage">
        <canvas id="game" tabindex="0" data-i18n-label="paperGolf.canvas" data-i18n="paperGolf.canvas">拖动蓄力，松开击球。</canvas>
        <div class="margin-caption" aria-hidden="true"><span id="scene-note"></span><i></i></div>
        <div class="drag-hint" id="drag-hint"><svg viewBox="0 0 100 38" aria-hidden="true"><path d="M86 8Q62 33 12 24m9-8-10 8 11 6" stroke-dasharray="3 4"/><circle cx="88" cy="6" r="4"/></svg><span data-i18n="paperGolf.drag">向后拉一点，再松手</span></div>
        <div class="power-badge" id="power-badge" hidden></div>
        <section class="overlay" id="overlay" hidden aria-labelledby="result-title">
          <div class="result-card"><div id="result-symbol" class="result-symbol" aria-hidden="true">⚑</div><p class="eyebrow" id="result-kicker"></p><h2 id="result-title"></h2><p id="result-description"></p><div id="result-stars" class="result-stars" aria-hidden="true"></div><p id="result-record"></p><div class="result-actions"><button class="primary" id="result-main"></button><button class="secondary" id="result-retry" data-i18n="paperGolf.retry">再打一次</button></div></div>
        </section>
      </div>
      <div class="paper-bottom"><p id="status" role="status" aria-live="polite"></p><div class="hole-progress" id="hole-progress" aria-hidden="true"></div><span id="page-number">01 / 09</span></div>
    </section>
    <footer class="controls">
      <div class="control-intro"><span class="mini-ball" aria-hidden="true"></span><div><strong data-i18n="paperGolf.controlTitle">一拉一放，刚刚好。</strong><span data-i18n="paperGolf.controlNote">画面任意处拖动 · 或调整下方击球</span></div></div>
      <div class="aim-controls"><label for="angle"><span data-i18n="paperGolf.angle">角度</span><output id="angle-value" for="angle">35°</output><input id="angle" type="range" min="0" max="180" value="35"></label><label for="power"><span data-i18n="paperGolf.power">力度</span><output id="power-value" for="power">58%</output><input id="power" type="range" min="3" max="100" value="58"></label></div>
      <button class="primary strike-button" id="strike"><span data-i18n="paperGolf.strike">挥杆</span><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2 12h27m-8-7 8 7-8 7"/></svg></button>
    </footer>
    <p class="desk-foot"><span data-i18n="paperGolf.footer">把忙碌留在纸外，把小球送进风里。</span><span class="edition">BOOPLAND · PAPER GOLF</span></p>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" data-i18n-label="paperGolf.close">×</button></div><div id="help-content" hidden><ol><li data-i18n="paperGolf.help1"></li><li data-i18n="paperGolf.help2"></li><li data-i18n="paperGolf.help3"></li><li data-i18n="paperGolf.help4"></li><li data-i18n="paperGolf.help5"></li></ol><p class="help-note" data-i18n="paperGolf.shortcuts"></p></div><div id="score-content" hidden><p id="score-summary"></p><div id="score-grid"></div><p class="help-note" id="save-note"></p></div></dialog>
  <script src="../../i18n.js"></script><script src="translations.js"></script><script src="engine.js"></script><script src="scene.js"></script><script src="game.js"></script>
</body>
</html>
