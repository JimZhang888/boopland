<!doctype html>
<html lang="zh-CN" data-i18n-scope="deskCurling">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="deskCurling.title">课桌冰壶</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="../../analytics.js"></script>
  <script defer src="../../i18n.js"></script>
  <script defer src="translations.js"></script>
  <script defer src="engine.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <main class="game">
    <header>
      <a class="back" href="../../games.html" data-i18n-label="common.back" data-i18n-title="common.back"><span aria-hidden="true">←</span><span class="back-text" data-i18n="common.back">返回大厅</span></a>
      <h1 data-i18n="deskCurling.title">课桌冰壶</h1>
      <div class="tools">
        <button id="help" type="button" data-i18n-label="deskCurling.rules" data-i18n-title="deskCurling.rules">?</button>
        <button id="reset" type="button" data-i18n-label="deskCurling.restart" data-i18n-title="deskCurling.restart">↻</button>
      </div>
    </header>
    <section class="match" data-i18n-label="deskCurling.title">
      <div class="scoreboard">
        <div class="team sun" id="sun-team"><span class="crest" aria-hidden="true">☀</span><div><span data-i18n="deskCurling.sun">日光队</span><small class="pips" aria-hidden="true">● ● ●</small></div><b class="points">0</b></div>
        <strong id="status" role="status"></strong>
        <div class="team moon" id="moon-team"><span class="crest" aria-hidden="true">☾</span><div><span data-i18n="deskCurling.moon">月亮队</span><small class="pips" aria-hidden="true">● ● ●</small></div><b class="points">0</b></div>
      </div>
      <div class="tabletop" id="tabletop">
        <svg id="rink" viewBox="0 0 860 404" xmlns="http://www.w3.org/2000/svg" role="img" data-i18n-label="deskCurling.board">
          <defs>
            <pattern id="grid" width="19" height="19" patternUnits="userSpaceOnUse"><path d="M19 0H0V19" fill="none" stroke="#c5d7d4" stroke-width="0.85"/></pattern>
            <pattern id="ruler" width="18" height="7" patternUnits="userSpaceOnUse"><path d="M0 0v7m9-7v4" fill="none" stroke="#9f9274" stroke-width="1"/></pattern>
            <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(21)"><path d="M0 0v6" stroke="#96815c" opacity=".24"/></pattern>
            <g id="sunmark" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle r="4"/><path d="M0-10v2m0 16v2m10-10H8m-16 0h-2m17-7-1.4 1.4M-6 6l-1.4 1.4m14.5 0L6 6M-6-6l-1.4-1.4"/></g>
            <path id="moonmark" d="M4.7-8.8C-1-9.8-7.6-6.4-8.3-.4c-.8 6.2 4.6 10.6 10.1 9.3C5.2 8.2 7.7 6.2 8.6 3c-4 1.9-8.1-.3-9-3.9C-1.2-4.3.6-7.3 4.7-8.8Z" fill="currentColor"/>
          </defs>
          <g id="world">
            <path d="M14 6 847 8 852 393 10 397Z" fill="#88775d" opacity=".23"/>
            <path d="M10 5 847 4 850 390 8 395Z" fill="#fcf8e9" stroke="#8d816e" stroke-width="1.6"/>
            <path d="M15 10 842 9 845 384 14 389Z" fill="url(#grid)"/>
            <g fill="none" stroke-linejoin="round" stroke-linecap="round">
              <path d="M27 26 832 25 834 378 28 379Z" stroke="#6e7d79" stroke-width="2.1"/>
              <path d="m31 29 798-1m2 343 1-337M32 375l793 1" stroke="#9b9d87" opacity=".55"/>
              <path d="M28 202q405 1 805 0" stroke="#9daca5" stroke-dasharray="4 8"/>
              <path d="M111 70q2 147 0 266" stroke="#abbab3" stroke-dasharray="2 7"/>
            </g>
            <rect x="32" y="14" width="792" height="7" fill="url(#ruler)"/>
            <g stroke-linecap="round" stroke-linejoin="round">
              <g transform="translate(249 85) rotate(-12)" stroke="#8a9a97" fill="none" opacity=".72">
                <path d="M-48 10c14-12 28 20 38 6s-5-21-9-13 5 14 17 6" stroke-dasharray="3 4"/>
                <path d="m1 5 37-13L21 16l-9-6-6 7 1-10z" fill="#f8f6e9" stroke-width="1.35"/>
                <path d="m7 7 31-15-26 18-6 7"/>
              </g>
              <g transform="translate(58 339) rotate(-7)" stroke="#ab987e" fill="none" opacity=".5">
                <path d="m0 0 6-13 6 9 5-18 7 11 4-4"/><path d="m2 6 34-4"/>
              </g>
            </g>
            <g transform="translate(657 202)">
              <circle r="103" fill="#c9d9d8" stroke="#637d7c" stroke-width="2.2"/>
              <ellipse rx="100.2" ry="101" transform="rotate(-7)" fill="none" stroke="#899b95" opacity=".78"/>
              <circle r="77" fill="#fbf5e4" stroke="#788a81" stroke-width="1.6"/>
              <circle r="51" fill="#dbad91" stroke="#a17f67" stroke-width="1.7"/>
              <circle r="26" fill="#f9efdb" stroke="#998a70" stroke-width="1.2"/>
              <circle r="102.5" fill="url(#hatch)" opacity=".3"/>
              <path d="m-9 0 18-.3M0-9l.4 18" fill="none" stroke="#675c48" stroke-width="1.8"/>
              <g stroke="#807f69" stroke-width="1.3"><path d="M0-108v7m0 202v7m-110-108h8m204 0h8"/></g>
            </g>
            <g id="launch-mark" transform="translate(112 202)" fill="none" stroke="#87958a">
              <circle r="27" stroke-dasharray="4 4"/><path d="M-36 0h6m60 0h7M0-36v6m0 60v6"/>
            </g>
            <g fill="#e5c487" fill-opacity=".65" stroke="#b49d70" stroke-width=".8">
              <path d="m8 18 45-18 7 15-45 19z"/><path d="m797 389 43-19 7 15-44 18z"/>
            </g>
            <g aria-hidden="true" transform="translate(259 391) rotate(-2)" stroke-linejoin="round">
              <path d="M2 0 132 1l15 4-15 4L2 8q-5-4 0-8" fill="#5a503b" opacity=".19"/>
              <path d="M8-4h124l15 4-15 4H8z" fill="#dfbd72" stroke="#8e7756"/>
              <path d="M17-2h113m-113 4h113" stroke="#aa8a53" opacity=".72"/>
              <path d="m132-4 15 4-15 4 2-4z" fill="#e9d7b9" stroke="#8e7756"/>
              <path d="m142-1.5 5 1.5-5 1.5z" fill="#55544a"/>
              <path d="M1-4h10v8H1q-4 0-4-4t4-4z" fill="#cf9f92" stroke="#9c7c71"/>
              <path d="M8-4.5h9v9H8z" fill="#b8bfb2" stroke="#829083"/>
            </g>
            <g aria-hidden="true" transform="translate(744 4) rotate(8)" fill="none" stroke-linecap="round">
              <path d="M0-2v16c0 7 10 7 10 0V3c0-5-6-5-6 0v10" stroke="#6b6a5c" stroke-width="3"/>
              <path d="M-.6-2v16c0 6 10 6 10 0V3c0-4-6-4-6 0v10" stroke="#d2d4c4" stroke-width="1.2"/>
            </g>
            <g id="guide" fill="none" stroke-linecap="round"><path id="guide-line" stroke="#4b6865" stroke-width="3" stroke-dasharray="5 8"/><path id="arrow" stroke="#4b6865" stroke-width="3.4"/></g>
            <g id="measurement" fill="none" stroke="#514f3e" stroke-width="1.8" stroke-dasharray="3 4"></g>
            <g id="stones"></g>
          </g>
        </svg>
      </div>
      <div class="control-row">
        <div class="controls" id="sliders">
          <label><span><span data-i18n="deskCurling.angle">方向</span> <output for="angle" id="angle-value"></output></span><input id="angle" type="range" min="-35" max="35" value="0" step="1"></label>
          <label><span><span data-i18n="deskCurling.power">力度</span> <output for="power" id="power-value"></output></span><input id="power" type="range" min="20" max="100" value="74" step="1"></label>
        </div>
        <p id="summary" hidden></p>
        <button id="flick" class="primary" type="button" data-i18n="deskCurling.flick">弹出瓶盖</button>
      </div>
    </section>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2><p id="dialog-text"></p>
    <div class="dialog-actions"><button id="cancel"></button><button class="primary" id="confirm"></button></div>
  </dialog>
</body>
</html>
