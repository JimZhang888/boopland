<!DOCTYPE html>
<html lang="zh-CN" data-i18n-scope="nonogram">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <meta name="description" content="跟着行列数字，一格一格画出小日子。十二页铅笔数织与一本属于你的图鉴。" data-i18n-content="nonogram.description">
  <title data-i18n="nonogram.pageTitle">铅笔数织 · Boopland</title>
  <link rel="icon" href="cover.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-pencil" viewBox="0 0 28 28"><path d="m5 19 14-15q2-2 5 1t0 5L10 24l-7 2Zm0 0 5 5M18 5l6 5M7 21 21 7M4 23l2 2"/></symbol>
    <symbol id="i-cross" viewBox="0 0 28 28"><path d="m7 7 14 14M21 7 7 21m2-14 13 13M6 20 19 7"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 28 28"><path d="m4 16 11-12q1-1 3 1l6 6q2 2 0 4l-9 9H9l-5-5q-1-1 0-3Zm5-6 10 10M15 24h10"/></symbol>
    <symbol id="i-undo" viewBox="0 0 28 28"><path d="m5 5-1 8 8-1M5 12c6-10 20-7 19 3 0 8-9 12-15 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 28 28"><path d="M11 4C-1 6 1 26 15 25c9 0 13-11 8-17M7 13l6 6L25 4"/></symbol>
    <symbol id="i-hint" viewBox="0 0 28 28"><path d="M9 19C-1 9 8 1 15 3s12 10 4 16l-1 4H10Zm1 7h8M13 19v-8l4 2M2 2l2 2m21-2-2 2M1 13h3m21 0h2"/></symbol>
    <symbol id="i-restart" viewBox="0 0 28 28"><path d="M5 11C10-2 29 7 24 20 20 29 3 25 4 16M4 4v8l8-1"/></symbol>
    <symbol id="i-book" viewBox="0 0 28 28"><path d="M14 7Q7 3 2 5v18q7-2 12 2 6-4 12-2V5q-6-2-12 2Zm0 0v18M6 10l4 1m-4 4 4 1m8-5 4-1m-4 6 4-1"/></symbol>
    <symbol id="i-pages" viewBox="0 0 28 28"><path d="m6 3 17 1-1 20H5ZM2 8l1 19 16-1M9 9h10m-10 5h10m-10 5h6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 28 28"><path d="M14 3C0 3 0 25 14 25S29 3 14 3Zm0 5v7l5 2"/></symbol>
  </defs></svg>
  <div class="paper-grain" aria-hidden="true"></div>
  <main class="game-shell">
    <header class="topbar">
      <a class="back-link" href="../../games.html"><span aria-hidden="true">↶</span><span data-i18n="common.back">返回大厅</span></a>
      <a class="wordmark" href="../../games.html" aria-label="Boopland">boopland<span>.</span></a>
      <div class="top-actions"><button class="album-button" id="album" data-i18n-title="nonogram.album"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span class="album-label" data-i18n="nonogram.album">图鉴</span><span id="album-count">0/12</span></button><button class="icon-button help-button" id="help" data-i18n-label="nonogram.help">?</button></div>
    </header>
    <div class="desk">
      <aside class="margin-note">
        <span class="eyebrow" data-i18n="nonogram.marginLabel">一支铅笔 · 一点灵光</span>
        <p class="hand-note" data-i18n="nonogram.margin">一格一格，\n画出小日子。</p>
        <svg class="note-arrow" viewBox="0 0 170 70" aria-hidden="true"><path d="M8 9c15 52 98 0 146 40m-19-3 20 5-4-17M10 11c17 44 98 0 140 35"/></svg>
        <div class="mini-lesson"><strong>2 , 1</strong><div class="example-line" aria-hidden="true"><i class="inked"></i><i class="inked"></i><i>×</i><i class="inked"></i><i>×</i></div><p data-i18n="nonogram.example">填两格，至少空一格，\n再填一格。</p></div>
        <svg class="cat-doodle" viewBox="0 0 160 130" aria-hidden="true"><path d="M32 58 28 21l33 19q20-7 38-1l27-23-2 43c24 59-84 69-92-1Z" fill="#dfdfcf" opacity=".55"/><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M31 57 27 20l34 20q21-7 38-1l28-24-3 44c23 58-85 69-93-2Z"/><path d="m34 48-1-15 15 11m60-1 12-16-1 21M48 68q8-9 15 0m28-1q8-9 15 0M74 76l7 1-3 5Zm4 6q-7 10-12 0m12 0q7 10 12 0M21 72l20 3m-21 7 21-2m72-8 22-4m-22 11 23 3M42 102q-12 10-9 20m70-19q17 8 15 20"/><path d="m43 50 11-4m-8 10 15-9m-6 9 11-8m40 49 10-5m-17 11 13-6" opacity=".35"/></g></svg>
      </aside>

      <section class="notebook" aria-labelledby="game-title">
        <div class="tape" aria-hidden="true"></div>
        <header class="notebook-heading"><div><span class="eyebrow" data-i18n="nonogram.notebook">日常图案收集簿</span><h1 id="game-title" data-i18n="nonogram.name">铅笔数织</h1></div><span class="notebook-mark" aria-hidden="true">№ <b id="page-number">01</b></span></header>
        <div class="page-meta"><span id="puzzle-title"></span><span class="size-badge" id="puzzle-size">5 × 5</span><span class="timer"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><span id="time" data-i18n-label="nonogram.time">00:00</span></span></div>
        <div class="board-space" id="board-space"><div class="board-frame" id="board-frame"><div class="corner-note" aria-hidden="true">↘</div><div id="column-clues" class="column-clues"></div><div id="row-clues" class="row-clues"></div><div id="board" class="board" role="grid" data-i18n-label="nonogram.board" aria-describedby="board-instructions"></div></div></div>
        <footer class="notebook-footer"><div class="status-line"><span id="status" role="status" aria-live="polite"></span><span id="progress" class="progress"></span></div><div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div></footer>
      </section>

      <aside class="tools-panel">
        <section class="page-picker"><h2 class="eyebrow" data-i18n="nonogram.choosePage">今天，翻开哪一页？</h2><button class="page-select" id="levels"><svg class="icon" aria-hidden="true"><use href="#i-pages"/></svg><span><b id="chapter-name"></b><small id="page-label"></small></span><span aria-hidden="true">⌄</span></button></section>
        <section class="pencil-case"><h2 class="eyebrow" data-i18n="nonogram.tools">手边的文具</h2><div class="mode-switch" role="group" data-i18n-label="nonogram.tools"><button data-mode="1" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-pencil"/></svg><span data-i18n="nonogram.fill">填色</span></button><button data-mode="-1" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-cross"/></svg><span data-i18n="nonogram.cross">画叉</span></button><button data-mode="0" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eraser"/></svg><span data-i18n="nonogram.erase">擦除</span></button></div><p id="board-instructions" class="control-hint" data-i18n="nonogram.controlHint">点击或拖动填格 · 右键画叉</p></section>
        <div class="action-tools"><button id="undo" disabled><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg><span data-i18n="nonogram.undo">撤销</span></button><button id="check"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="nonogram.check">检查</span></button><button id="hint"><svg class="icon" aria-hidden="true"><use href="#i-hint"/></svg><span data-i18n="nonogram.hint">小提示</span></button><button id="restart"><svg class="icon" aria-hidden="true"><use href="#i-restart"/></svg><span data-i18n="nonogram.restart">重画</span></button></div>
        <button class="collection-note" id="collection-note"><span class="eyebrow" data-i18n="nonogram.collectionTitle">给日常，留一张小画</span><span class="collection-preview" id="collection-preview" aria-hidden="true"></span><span id="collection-caption"></span><span class="collection-link" data-i18n="nonogram.openAlbum">翻开我的图鉴 ↗</span></button>
        <svg class="pencil-drawing" viewBox="0 0 220 45" aria-hidden="true"><path d="m8 30 27-19 170 7-1 16-170-7Z" fill="#cbbd833d"/><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="m8 30 27-19 170 7-1 16-170-7Zm27-19-1 16m1-11 153 6M35 23l152 6m1-11-1 15M8 30l12-2-2-6"/><path d="m196 20-1 11m5-11-1 11M43 19l121 5" opacity=".45"/></g></svg>
      </aside>
    </div>
    <footer class="page-footer"><span data-i18n="nonogram.footer">不赶时间，慢慢显现。</span><span aria-hidden="true">a little pencil, a little play.</span></footer>
  </main>

  <dialog id="help-dialog" aria-labelledby="help-title"><div class="dialog-heading"><h2 id="help-title" data-i18n="nonogram.helpTitle">数字里，藏着一幅画</h2><button class="icon-button" data-close data-i18n-label="nonogram.close">×</button></div><p data-i18n="nonogram.ruleGoal"></p><div class="help-example"><b>2 , 1 →</b><div class="example-line" aria-hidden="true"><i class="inked"></i><i class="inked"></i><i>×</i><i class="inked"></i><i>×</i></div></div><ol class="rules"><li data-i18n="nonogram.ruleGroups"></li><li data-i18n="nonogram.ruleOrder"></li><li data-i18n="nonogram.ruleCross"></li><li data-i18n="nonogram.ruleTools"></li><li data-i18n="nonogram.ruleSave"></li></ol><p class="keyboard-note" data-i18n="nonogram.keyboard"></p><button class="primary" data-close data-i18n="nonogram.gotIt">落下第一笔</button></dialog>
  <dialog id="pages-dialog" class="wide-dialog" aria-labelledby="pages-title"><div class="dialog-heading"><div><span class="eyebrow" data-i18n="nonogram.notebook">日常图案收集簿</span><h2 id="pages-title" data-i18n="nonogram.pagesTitle">十二页，小小的日常</h2></div><button class="icon-button" data-close data-i18n-label="nonogram.close">×</button></div><p class="dialog-intro" data-i18n="nonogram.pagesCopy"></p><div id="pages-list"></div></dialog>
  <dialog id="album-dialog" class="wide-dialog" aria-labelledby="album-title"><div class="dialog-heading"><div><span class="eyebrow" id="album-total"></span><h2 id="album-title" data-i18n="nonogram.albumTitle">我的日常图鉴</h2></div><button class="icon-button" data-close data-i18n-label="nonogram.close">×</button></div><p class="dialog-intro" data-i18n="nonogram.albumCopy"></p><div class="album-grid" id="album-grid"></div></dialog>
  <dialog id="restart-dialog" aria-labelledby="restart-title"><div class="dialog-heading"><h2 id="restart-title" data-i18n="nonogram.restartTitle">擦干净，再画一遍？</h2><button class="icon-button" data-close data-i18n-label="nonogram.close">×</button></div><p data-i18n="nonogram.restartCopy"></p><div class="dialog-actions"><button class="secondary" data-close data-i18n="nonogram.cancel">接着画</button><button class="primary" id="confirm-restart" data-i18n="nonogram.confirm">重新开始</button></div></dialog>
  <dialog id="result-dialog" aria-labelledby="result-title"><div class="dialog-heading"><span class="eyebrow" data-i18n="nonogram.collected">一幅小画，已收入图鉴</span><button class="icon-button" data-close data-i18n-label="nonogram.inspect">×</button></div><div class="result-art" id="result-art" aria-hidden="true"></div><h2 id="result-title"></h2><p id="result-copy"></p><p class="result-stats" id="result-stats"></p><div class="dialog-actions"><button class="secondary" id="result-album" data-i18n="nonogram.viewAlbum">看看图鉴</button><button class="primary" id="next-page" data-i18n="nonogram.next">下一页 →</button></div></dialog>
  <script src="../../i18n.js"></script>
  <script src="translations.js"></script>
  <script src="puzzles.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
