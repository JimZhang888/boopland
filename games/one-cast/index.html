<!DOCTYPE html>
<html lang="zh-CN" data-i18n-scope="fishing">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3eb">
  <title data-i18n="pageTitle">一键钓鱼 · Boopland</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <div class="game-shell">
    <header class="topbar">
      <a class="back" href="../../games.html"><span aria-hidden="true">↶</span><span data-i18n="common.back">返回大厅</span></a>
      <h1><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M5 30Q13 8 29 5M7 30 28 5M29 5v21q0 9-6 5l-2-4v5"/></svg><span data-i18n="name">一键钓鱼</span></h1>
      <div class="tools">
        <button id="sound" class="icon-button" type="button" aria-pressed="false" data-i18n-label="soundOn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3Z"/><path id="sound-wave" d="m16 9 5 6m0-6-5 6"/></svg></button>
        <button id="pause" class="icon-button" type="button" data-i18n-label="pause" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-shape" d="M8 5v14M16 5v14"/></svg></button>
        <button id="help" class="icon-button" type="button" data-i18n-label="help">?</button>
      </div>
    </header>

    <main class="workspace">
      <section class="lake-panel" data-i18n-label="lake">
        <div class="scene" id="scene">
          <div class="scene-heading"><span class="lake-name"><i aria-hidden="true"></i><span data-i18n="lake">慢慢湖</span></span><span class="weather"><span aria-hidden="true">☼</span><span data-i18n="weather">微风，宜发呆</span></span></div>
          <canvas id="lake-art" role="img" data-i18n-label="sceneLabel"></canvas>
          <div class="bite-callout" id="bite-callout" aria-hidden="true" hidden>!</div>
          <div class="pause-overlay" id="pause-overlay" hidden><span aria-hidden="true">Ⅱ</span><h2 data-i18n="paused">湖水也歇一会儿</h2><button id="resume" type="button" data-i18n="resume">继续钓鱼</button></div>
          <span class="scene-caption" data-i18n="caption">把忙碌放一放，把鱼竿放下来。</span>
        </div>
        <div class="control-deck">
          <div class="status" role="status" aria-live="polite" aria-atomic="true"><div class="status-heading"><span id="status-mark" aria-hidden="true">↗</span><h2 id="status-title"></h2><span class="new-stamp" id="new-stamp" data-i18n="newFish" hidden>新发现</span></div><p id="status-note"></p></div>
          <div class="action-wrap"><button class="cast-button" id="action" type="button"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 27Q12 6 27 4M7 28 27 4M27 4v18q0 9-6 4l-1-3"/></svg><span id="action-label"></span><span class="keycap" aria-hidden="true">SPACE</span></button></div>
          <div class="timing-track" id="timing-track" role="progressbar" data-i18n-label="biteTime" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="timing-fill"></span></div>
          <div class="steps" aria-hidden="true"><span id="step-cast"><b>01</b> <span data-i18n="stepCast">抛竿</span></span><i></i><span id="step-wait"><b>02</b> <span data-i18n="stepWait">等鱼咬钩</span></span><i></i><span id="step-reel"><b>03</b> <span data-i18n="stepReel">点击收杆</span></span></div>
        </div>
      </section>

      <aside class="sidebar">
        <section class="trip">
          <div class="section-heading"><h2 data-i18n="trip">今日的垂钓手记</h2><span aria-hidden="true">✳</span></div>
          <div class="stats"><div class="stat score-stat"><span data-i18n="score">本次得分</span><strong id="score">0</strong></div><div class="stat"><span data-i18n="caught">钓到小鱼</span><strong id="caught">0</strong></div><div class="stat"><span data-i18n="streak">连续上钩</span><strong id="streak">0</strong></div></div>
          <div class="best-line"><span data-i18n="best">最佳手记</span><span id="best">0</span></div>
        </section>
        <section class="collection">
          <button class="collection-heading" id="journal" type="button"><span data-i18n="collection">小鱼图鉴</span><span><b id="discovered">0 / 8</b> <span aria-hidden="true">↗</span></span></button>
          <div class="fish-grid" id="fish-grid"></div>
          <p class="collection-note" data-i18n="collectionNote">每次相遇，都值得记下来。</p>
        </section>
        <div class="side-bottom"><p class="pencil-note" data-i18n="littleNote">不赶时间，只等一条鱼。</p><button id="new-trip" type="button" class="text-button"><span aria-hidden="true">↻</span><span data-i18n="newTrip">新的一次出发</span></button></div>
      </aside>
    </main>
    <footer class="footer"><span class="brand">boopland.</span><span data-i18n="keyboard">点一下，或按空格 · 看到「!」再收杆</span><span data-i18n="saved">图鉴自动保存</span></footer>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" type="button" class="icon-button" data-i18n-label="close">×</button></div><div id="dialog-body"></div><button id="journal-new-trip" class="text-button" type="button" data-i18n="newTrip" hidden>新的一次出发</button><div class="dialog-actions" id="restart-actions" hidden><button id="cancel-new" type="button" data-i18n="keepTrip">继续这次</button><button id="confirm-new" type="button" class="primary" data-i18n="confirmNew">重新出发</button></div></dialog>
  <noscript>请启用 JavaScript 来钓鱼。 / Please enable JavaScript to play.</noscript>
  <script src="../../i18n.js"></script>
  <script src="./translations.js"></script>
  <script src="./engine.js"></script>
  <script src="./scene.js"></script>
  <script src="./game.js"></script>
</body>
</html>
