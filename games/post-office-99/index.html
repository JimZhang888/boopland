<!doctype html>
<html lang="zh-CN" data-i18n-scope="post99">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="post99.title">九十九号邮局</title>
  <link rel="icon" href="cover.svg" type="image/svg+xml">
  <link rel="stylesheet" href="desk.css">
  <script src="../../i18n.js"></script>
  <script defer src="../../analytics.js"></script>
  <script defer src="words.js"></script>
  <script defer src="routes.js"></script>
  <script defer src="art.js"></script>
  <script defer src="map.js"></script>
  <script defer src="desk.js"></script>
</head>
<body>
  <main class="desk">
    <header class="mast">
      <div class="brand">
        <svg viewBox="0 0 58 44" aria-hidden="true"><g stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="m16 10 34-4 4 25-35 5Z" fill="#f8efda"/><path d="m17 11 19 12L50 8M21 31l9-12m21 9-12-8M3 19l10-1M0 25l13-1m-8 7 9-1"/><circle cx="46" cy="32" r="8" fill="#f8efda"/></g><text x="46" y="35" text-anchor="middle" fill="currentColor" font-family="Georgia,serif" font-size="8">99</text></svg>
        <h1 data-i18n="post99.title">九十九号邮局</h1>
      </div>
      <nav>
        <a class="back" href="../../games.html" data-i18n-label="common.back" data-i18n-title="common.back"><span aria-hidden="true">↶</span><span data-i18n="common.back">返回大厅</span></a>
        <button id="album" class="album-link" data-i18n-label="post99.album" data-i18n-title="post99.album"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h13l2 2v16H6q-2 0-2-2V6q0-3 2-3Zm2 1v16m3-13h7v7h-7z"/></svg><span data-i18n="post99.album"></span><small id="album-count"></small></button>
        <button id="help" class="help" data-i18n-label="post99.help" data-i18n-title="post99.help">?</button>
      </nav>
    </header>
    <div class="dispatch">
      <section class="map-paper">
        <header class="sheet-head"><h2><span class="map-glyph" aria-hidden="true">⌖</span> <span data-i18n="post99.map"></span></h2><button class="quiet" id="key" data-i18n="post99.legend"></button></header>
        <div class="map-frame"><svg id="town" viewBox="0 0 640 360" role="group" data-i18n-label="post99.map"></svg></div>
        <div class="map-foot"><span><i class="origin"></i><b data-i18n="post99.start"></b></span><span><i class="end"></i><b data-i18n="post99.target"></b></span><span id="closure-key"><i class="closed">×</i><b data-i18n="post99.closed"></b></span><span class="map-scale" aria-hidden="true">1 : 2 500</span></div>
      </section>
      <article class="envelope">
        <div class="air-stripe"></div>
        <div class="letter-top"><span id="folio"></span><div class="letter-seal" aria-hidden="true"><svg viewBox="0 0 122 55"><g fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="26" cy="26" r="21"/><circle cx="26" cy="26" r="17"/><path d="M44 16c15-8 22 7 40-1s19 5 31 0M45 23c15-8 22 7 40-1s19 5 31 0M45 30c15-8 22 7 40-1s19 5 31 0M45 37c15-8 22 7 40-1s19 5 31 0"/></g><text x="26" y="31" text-anchor="middle" fill="currentColor" font-size="15" font-family="Georgia,serif">99</text></svg></div></div>
        <div class="recipient"><div id="portrait"></div><div><span class="small-label" data-i18n="post99.target"></span><h2 id="recipient-name"></h2></div></div>
        <ol id="clues" data-i18n-label="post99.clues"></ol>
        <div class="post-code" aria-hidden="true"><span>BOOPLAND</span><i></i><b id="code"></b></div>
      </article>
    </div>
    <section class="counter">
      <div class="route-sheet">
        <div class="route-head"><h2 data-i18n="post99.route"></h2><small id="n-stamps"></small><button id="erase" class="erase" data-i18n-title="post99.erase" data-i18n-label="post99.erase"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 9-9q1-1 2 0l5 5q1 1 0 2l-8 8H8l-4-4q-1-1 0-2Zm4-4 7 7m-4 3h10"/></svg></button></div>
        <div id="slots" class="slots" role="group" data-i18n-label="post99.route"></div>
      </div>
      <div class="inkpad">
        <div class="ink-label"><h2 data-i18n="post99.tray"></h2></div>
        <div id="tools" class="tools"></div>
        <button class="send" id="send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-7-7 17-3-8-8-2Zm8 2 10-9"/></svg><span></span></button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-card">
    <header><h2 id="dialog-title"></h2><button class="dialog-close" id="close" data-i18n-label="post99.close">×</button></header>
    <div id="dialog-body"></div>
    <a class="dialog-back" href="../../games.html" data-i18n="common.back"></a>
  </div></dialog>
</body>
</html>
