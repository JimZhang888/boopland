<!doctype html>
<html lang="zh-CN" data-i18n-scope="dots-and-boxes">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1e9">
  <title data-i18n="dots-and-boxes.title">点格成方</title>
  <link rel="icon" href="cover.svg" type="image/svg+xml">
  <link rel="stylesheet" href="game.css">
  <script src="../../i18n.js"></script>
  <script defer src="../../analytics.js"></script>
  <script defer src="words.js"></script>
  <script defer src="rules.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m10 5-7 7 7 7M4 12l17-.2"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><path d="M3 5.2c3.5-1.2 6.1-.8 9 1.1 2.8-1.9 5.4-2.3 9-1.1v14c-3.6-.9-6-.6-9 1-2.9-1.6-5.4-1.9-9-1zM12 6.5v13"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4.1 9A8 8 0 1 1 4 15M4 3v6.5h6.4"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12m-.2-12L6 18"/></symbol>
      <symbol id="i-logo" viewBox="0 0 32 32">
        <path d="m5 5 14-.4.3 15L5 19.4Z" fill="#c8d4c0" stroke="#536851" stroke-width="1.7"/>
        <path d="m19 12 8 .2.3 15L12 27l-.4-8" stroke="#ae806a" stroke-width="1.7" fill="none"/>
        <g fill="#435346"><circle cx="5" cy="5" r="2.4"/><circle cx="19" cy="5" r="2.4"/><circle cx="5" cy="19.4" r="2.4"/><circle cx="19" cy="19.6" r="2.4"/></g>
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 156 27">
        <g stroke="#4f5b49" stroke-width="1.1" stroke-linejoin="round">
          <path d="m4 18 15-8L141 6l.8 9.7-121 4z" fill="#a7b69e"/>
          <path d="m4 18 15-8 2.6 3.2-1.3 3.1 1.5 3.3z" fill="#dfc8a1"/>
          <path d="m4 18 5.7-3 1.2 2.7z" fill="#485144"/>
          <path d="M22 13.3 141.4 9.1M21.4 16.5l120-4" opacity=".65" fill="none"/>
          <path d="m134.2 6.2 9.7-.3.4 9.7-9.7.3z" fill="#d0c9b2"/>
          <path d="m144 5.9 5-.1q4 .2 4 4.8t-3.8 4.8l-4.9.2z" fill="#c9a597"/>
        </g>
      </symbol>
    </defs>
  </svg>
  <div class="app">
    <header class="mast">
      <a class="top-link" href="../../games.html" data-i18n-label="common.back">
        <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span data-i18n="common.back">返回大厅</span>
      </a>
      <h1><svg aria-hidden="true"><use href="#i-logo"/></svg><span data-i18n="dots-and-boxes.title">点格成方</span></h1>
      <button class="top-link help" id="help" data-i18n-label="dots-and-boxes.rules">
        <svg class="icon" aria-hidden="true"><use href="#i-help"/></svg><span data-i18n="dots-and-boxes.rules">玩法</span>
      </button>
    </header>
    <main class="desk">
      <section class="notebook" aria-labelledby="sheet-name">
        <div class="binding" aria-hidden="true"></div>
        <div class="sheet-head"><h2 id="sheet-name"></h2><span id="dimensions"></span></div>
        <div class="board-space">
          <svg id="board" xmlns="http://www.w3.org/2000/svg" role="group" data-i18n-label="dots-and-boxes.board"></svg>
        </div>
        <div class="sheet-foot">
          <span class="ink-meter" aria-hidden="true"><i id="ink-fill"></i></span>
          <span id="move-count"></span>
          <svg class="pencil" aria-hidden="true"><use href="#i-pencil"/></svg>
        </div>
      </section>
      <section class="scores" aria-labelledby="score-title">
        <h2 id="score-title" data-i18n="dots-and-boxes.score">记分栏</h2>
        <div class="score-pair">
          <div class="score-box yours"><span class="score-label"><i class="stamp ring" aria-hidden="true"></i><span data-i18n="dots-and-boxes.you">你</span></span><strong id="you-score">0</strong></div>
          <div class="score-box theirs"><span class="score-label"><i class="stamp cross" aria-hidden="true"></i><span data-i18n="dots-and-boxes.cpu">电脑</span></span><strong id="cpu-score">0</strong></div>
        </div>
      </section>
      <section class="turn" id="turn-box" role="status" aria-live="polite" aria-atomic="true">
        <div class="turn-heading"><span class="tip-mark" aria-hidden="true">✎</span><h2 id="turn-title"></h2></div>
        <p id="turn-tip"></p>
      </section>
      <section class="settings" aria-labelledby="size-label">
        <h2 id="size-label" data-i18n="dots-and-boxes.size">棋盘大小</h2>
        <div class="controls">
          <div class="sizes" role="group" aria-labelledby="size-label">
            <button id="small" data-i18n-label="dots-and-boxes.small" aria-pressed="true">3 × 3</button>
            <button id="large" data-i18n-label="dots-and-boxes.large" aria-pressed="false" aria-describedby="unlock-note" disabled><svg class="icon lock" aria-hidden="true"><use href="#i-lock"/></svg>5 × 5</button>
          </div>
          <button id="reset" class="reset" data-i18n-label="dots-and-boxes.restart" data-i18n-title="dots-and-boxes.restart"><svg class="icon" aria-hidden="true"><use href="#i-restart"/></svg></button>
        </div>
        <p id="unlock-note"></p>
      </section>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-heading">
    <div class="dialog-top"><h2 id="dialog-heading"></h2><button class="close" id="close" data-i18n-label="dots-and-boxes.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <div id="rule-content">
      <svg class="demo" viewBox="0 0 210 66" aria-hidden="true">
        <g stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M34 12 34.5 54 76 53.5 75.5 12Z" stroke="#566c58" fill="#e1e8dc" stroke-width="2.8"/>
          <path d="m34 12 41.5-.2" stroke="#b67656" stroke-width="4" stroke-dasharray="5 5"/>
          <path d="M61 33c0 8-13 9-13 1s12-10 13-1Z" stroke="#546d55" stroke-width="2.4"/>
          <path d="M91 33q14-5 24-1m-6-5 7 5-6 4" stroke="#82877a" stroke-width="1.6"/>
          <path d="M134 12v42l42-.5v-42Z" stroke="#a0a597" stroke-width="2" stroke-dasharray="3 6"/>
          <path d="m134 54 42-.5" stroke="#57725a" stroke-width="4"/>
        </g>
        <g fill="#404b40"><circle cx="34" cy="12" r="3.7"/><circle cx="76" cy="12" r="3.7"/><circle cx="34" cy="54" r="3.7"/><circle cx="76" cy="54" r="3.7"/><circle cx="134" cy="12" r="3.7"/><circle cx="176" cy="12" r="3.7"/><circle cx="134" cy="54" r="3.7"/><circle cx="176" cy="54" r="3.7"/></g>
      </svg>
      <ol><li data-i18n="dots-and-boxes.rule1"></li><li data-i18n="dots-and-boxes.rule2"></li><li data-i18n="dots-and-boxes.rule3"></li></ol>
      <p class="key-hint" data-i18n="dots-and-boxes.keys"></p>
    </div>
    <p id="confirm-copy" data-i18n="dots-and-boxes.confirmCopy"></p>
    <div class="dialog-actions"><button id="cancel" data-i18n="dots-and-boxes.cancel"></button><button class="primary" id="accept"></button></div>
  </dialog>
</body>
</html>
