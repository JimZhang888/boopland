<!doctype html>
<html lang="zh-CN" data-i18n-scope="paperJuggler">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2eee4">
  <title data-i18n="paperJuggler.title">纸偶杂耍</title>
  <link rel="icon" type="image/svg+xml" href="./cover.svg">
  <link rel="stylesheet" href="./style.css">
  <script defer src="../../analytics.js"></script>
</head>
<body>
  <main class="sheet">
    <header class="masthead">
      <div class="identity">
        <svg viewBox="0 0 50 50" aria-hidden="true"><g stroke="#514939" stroke-width="1.1" stroke-linejoin="round"><path d="m25 1 5.3 9.5 10.5-1.3-1.3 10.5L49 25l-9.5 5.3 1.3 10.5-10.5-1.3L25 49l-5.3-9.5-10.5 1.3 1.3-10.5L1 25l9.5-5.3L9.2 9.2l10.5 1.3Z" fill="#c29755"/><circle cx="25" cy="25" r="13.4" fill="#f4e7c7"/><path d="m25 12 4.5 12.5L25 38l-4.5-13.5Z" fill="#ad6050"/><path d="m13 25 9.5-2.6 2.5-9m0 24 2.7-10 9.3-2.4-10-2.5" fill="none"/></g></svg>
        <h1 data-i18n="paperJuggler.title">纸偶杂耍</h1>
      </div>
      <nav>
        <a class="back" href="../../games.html" data-i18n-label="common.back" data-i18n-title="common.back"><span aria-hidden="true">←</span><span class="back-label" data-i18n="common.back">返回大厅</span></a>
        <button id="help" class="tool" data-i18n-label="paperJuggler.help" data-i18n-title="paperJuggler.help"><span aria-hidden="true">?</span></button>
        <button id="pause" class="tool" data-i18n-label="paperJuggler.pause" data-i18n-title="paperJuggler.pause" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14m8-14v14"/></svg></button>
      </nav>
    </header>
    <section class="playbill">
      <div class="scoreboard">
        <div class="act"><b id="act-number">Ⅰ</b><span id="act-name"></span></div>
        <dl class="stats">
          <div><dt data-i18n="paperJuggler.score">得分</dt><dd id="score">0000</dd></div>
          <div><dt data-i18n="paperJuggler.streak">连击</dt><dd id="streak">×0</dd></div>
          <div><dt data-i18n="paperJuggler.lives">机会</dt><dd class="lives" id="lives" role="img"><i></i><i></i><i></i></dd></div>
        </dl>
      </div>
      <div id="frame" class="frame">
        <svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" data-i18n-label="paperJuggler.stage"></svg>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="overlay" class="overlay" hidden>
          <section class="ticket" role="dialog" aria-labelledby="panel-title">
            <div class="flourish" aria-hidden="true">✦</div>
            <h2 id="panel-title"></h2>
            <p id="panel-body"></p>
            <div class="ticket-actions">
              <button id="primary" class="primary"></button>
              <button id="secondary" class="simple" data-i18n="paperJuggler.retry" hidden>再演一场</button>
            </div>
          </section>
        </div>
      </div>
      <footer class="console">
        <div id="intro" class="intro">
          <div class="intro-copy"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M3 26q10-34 28-8m-7-1 8 3 1-8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="8" cy="29" r="4" fill="#bd7b65" stroke="currentColor"/><ellipse cx="30" cy="28" rx="8" ry="3" fill="none" stroke="currentColor" stroke-dasharray="2 2"/></svg><p data-i18n="paperJuggler.intro">球落进掌心的虚线圈时，点按同侧，把球抛向另一只手。</p></div>
          <button class="primary" id="start"><span aria-hidden="true">▶</span><span data-i18n="paperJuggler.start">开始演出</span></button>
        </div>
        <div id="pads" class="pads" hidden>
          <button class="pad left" id="left" data-side="0"><kbd aria-hidden="true">←</kbd><span data-i18n="paperJuggler.left">左手</span><i aria-hidden="true">◆</i></button>
          <div class="best"><span data-i18n="paperJuggler.best">最高分</span><strong id="best">0</strong></div>
          <button class="pad right" id="right" data-side="1"><i aria-hidden="true">◆</i><span data-i18n="paperJuggler.right">右手</span><kbd aria-hidden="true">→</kbd></button>
        </div>
      </footer>
    </section>
  </main>
  <script src="../../i18n.js"></script>
  <script src="./translations.js"></script>
  <script src="./engine.js"></script>
  <script src="./art.js"></script>
  <script src="./game.js"></script>
</body>
</html>
