<!doctype html>
<html lang="zh-CN" data-i18n-scope="attic-auction">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e8">
  <title data-i18n="attic-auction.title">旧物拍卖会</title>
  <link rel="icon" href="cover.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="../../analytics.js"></script>
  <script defer src="../../i18n.js"></script>
  <script defer src="text.js"></script>
  <script defer src="auction.js"></script>
  <script defer src="room.js"></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <symbol id="gavel" viewBox="0 0 24 24"><path d="m8 4 3-2 8 9-3 3zm3 7-8 7q-1 1 0 2t2 0l8-8M6 6l5-4m3 13 6-5m-7 9h7l1 3H11z"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
    <symbol id="bookIcon" viewBox="0 0 24 24"><path d="M4 3h14a2 2 0 0 1 2 2v16H5a2 2 0 0 1-2-2V5q0-2 2-2zm3 0v14m-4 2q0-2 3-2h14M10 7h7m-7 3h5"/></symbol>
    <symbol id="chips" viewBox="0 0 24 24"><ellipse cx="10" cy="8" rx="7" ry="3"/><path d="M3 8v4c0 4 14 4 14 0V8m-14 4v4c0 4 14 4 14 0v-3m1-2c5 0 5 5 0 6m3-4v4q0 3-6 4"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12q9-13 20 0Q12 24 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="tag" viewBox="0 0 24 24"><path d="m2 12 10-10h8l2 2v8L12 22z"/><circle cx="16.5" cy="7" r="1.5"/></symbol>
    <symbol id="right" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="helpIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 5 2.3c-1 .7-2 1.3-2 3M12 17h.01"/></symbol>
    <symbol id="cross" viewBox="0 0 24 24"><path d="m6 6 12 12m-12 0L18 6"/></symbol>
    <symbol id="listIcon" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1"/></symbol>
  </defs>
</svg>
<main class="shell">
  <header class="mast">
    <div class="identity"><span class="crest"><svg class="icon"><use href="#gavel"/></svg></span><h1 data-i18n="attic-auction.title">旧物拍卖会</h1></div>
    <nav>
      <button id="help" class="nav-link" data-i18n-label="attic-auction.help"><svg class="icon"><use href="#helpIcon"/></svg><span data-i18n="attic-auction.rulesBtn">玩法</span></button>
      <a id="back" class="nav-link" href="../../games.html" data-i18n-label="common.back"><svg class="icon"><use href="#arrow"/></svg><span data-i18n="common.back">返回大厅</span></a>
    </nav>
  </header>
  <section class="desk">
    <section class="plate" id="plate" aria-labelledby="plate-label">
      <div class="plate-head"><div><span id="plate-label" class="small-caps" data-i18n="attic-auction.lot">拍品</span><span class="lot-counter"><b id="lot-number">01</b> <i>/</i> 06</span></div><span class="registration" aria-hidden="true">⊕</span><h2 id="plate-title"></h2></div>
      <div class="exhibit">
        <div class="print" id="print"><div class="shadow"></div><img id="specimen" src="art/camera.svg" alt=""><div id="pins"></div></div>
        <div class="ticket" id="ticket"><i aria-hidden="true"></i><span id="ticket-label"></span><strong id="ticket-value"></strong></div>
      </div>
      <div class="sequence" id="sequence"></div>
    </section>
    <section class="sheet">
      <div class="sheet-head">
        <div class="eyebrow"><span class="phase"><i></i><span id="phase"></span></span><span id="type"></span></div>
        <h2 id="lot-title"></h2>
      </div>
      <div id="detail"></div>
    </section>
  </section>
  <footer class="foot">
    <div class="wallet"><span class="wallet-icon"><svg class="icon"><use href="#chips"/></svg></span><div><span data-i18n="attic-auction.funds">我的筹码</span><strong id="balance"></strong></div></div>
    <button class="ledger-link" id="ledger" data-i18n-label="attic-auction.collection"><svg class="icon"><use href="#bookIcon"/></svg><span data-i18n="attic-auction.collection">收藏账簿</span></button>
    <div class="actions" id="actions"></div>
  </footer>
  <div class="sr" id="announcement" role="status" aria-live="polite"></div>
</main>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" class="icon-button" data-i18n-label="attic-auction.close" autofocus><svg class="icon"><use href="#cross"/></svg></button></div>
  <div class="dialog-body" id="dialog-body"></div>
</dialog>
</body>
</html>
