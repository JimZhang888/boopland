  <noscript><p style="text-align:center;padding:20px">开启 JavaScript，即可体验鹈鹕骑行、速度调节和日夜交替。</p></noscript>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const root = document.documentElement;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const state = { speed: 1, paused: reducedMotion.matches, automatic: true, hour: 9, distance: 0, pedal: 0, travel: 0, ambient: 0, targetHour: null, sound: false };
      const nodes = {};
      ['back-spokes','front-spokes','near-leg','near-leg-fill','far-leg','near-foot','far-foot','crank','pelican-body','scarf-tail','clouds-far','clouds-near','sea-texture','road-stripes','road-pebbles','shore-wave','sailboat','birds','stars','moon','sun','sun-reflection','lighthouse-light','headlight','scene-shell','scene-clock','clock-icon','scene-caption','distance','speed','speed-value','auto-toggle','ride-button','ride-icon','ride-label','trip-state','sound-button','sound-label','toast'].forEach(id => nodes[id] = $(id));
      const modes = [...document.querySelectorAll('[data-mode]')];
      const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
      const smooth = n => { n = clamp(n, 0, 1); return n * n * (3 - 2 * n); };
      // Scene time is simulated: a full day takes 96 seconds. Cycling speed affects the ride only.
      const paletteKeys = ['sky-top','sky-bottom','sea-top','sea-bottom','mountain','sand','road','road-line','cloud','sun'];
      const paletteStops = [
        { hour: 0, colors: ['#172e40','#466274','#35596a','#597c81','#355665','#8c987f','#7b8575','#b7b79c','#bac6be','#f6d799'] },
        { hour: 5, colors: ['#293f50','#8e9090','#607c85','#8daba3','#5d7d80','#c3b799','#b5ac94','#e7dbc0','#d9d4c4','#efb981'] },
        { hour: 7, colors: ['#c5e0d9','#f3e8c9','#7eb9b2','#aed0b8','#96bab0','#e9d9b1','#e8d7b6','#faf0d7','#fff9e8','#f6cf79'] },
        { hour: 11, colors: ['#c8e7e0','#e7efe0','#78b7b1','#aad0bc','#8fbbb1','#e8d7ad','#e7d7b6','#f9f0d6','#fffbee','#f8cd6d'] },
        { hour: 15, colors: ['#b9ddd7','#e3e9cf','#72afa9','#a7c6ad','#89afa4','#e7d1a6','#e5d1ae','#f9e8ca','#fff7e5','#f2c371'] },
        { hour: 18, colors: ['#dda595','#f4d0a0','#98aaa0','#c1baa2','#a1a58d','#dfbb91','#d9b48f','#f3d9b1','#ffe4c1','#f6b263'] },
        { hour: 20, colors: ['#3c465e','#a28891','#667c87','#8e9b9a','#657c7e','#ada78d','#9d9a85','#d8cbb0','#c5bdc0','#edc9a0'] },
        { hour: 22, colors: ['#172e40','#466274','#35596a','#597c81','#355665','#8c987f','#7b8575','#b7b79c','#bac6be','#f6d799'] },
        { hour: 24, colors: ['#172e40','#466274','#35596a','#597c81','#355665','#8c987f','#7b8575','#b7b79c','#bac6be','#f6d799'] }
      ];
      paletteStops.forEach(stop => stop.rgb = stop.colors.map(hex => [1,3,5].map(i => parseInt(hex.slice(i,i+2),16))));
      let toastTimer, lastClock = '', lastMode = '', frameId, lastTime = null, lastPaletteTime = -1;
      let audioContext, audioGain, oceanSource, audioBusy = false;
      const notify = message => { nodes.toast.textContent = message; nodes.toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => nodes.toast.classList.remove('show'), 2600); };
      function currentMode() { return state.hour >= 6.5 && state.hour < 16.5 ? 'day' : state.hour >= 16.5 && state.hour < 19.5 || state.hour >= 5 && state.hour < 6.5 ? 'sunset' : 'night'; }
      function updateEnvironment() {
        let a = paletteStops[0], b = paletteStops[1];
        for (let i = 0; i < paletteStops.length - 1; i++) { if (state.hour >= paletteStops[i].hour && state.hour <= paletteStops[i+1].hour) { a = paletteStops[i]; b = paletteStops[i+1]; break; } }
        const mix = smooth((state.hour - a.hour) / (b.hour - a.hour));
        paletteKeys.forEach((key, i) => root.style.setProperty('--' + key, 'rgb(' + a.rgb[i].map((c,j) => Math.round(c + (b.rgb[i][j]-c)*mix)).join(',') + ')'));
        const darkness = state.hour < 6.5 ? 1 - smooth((state.hour-4.5)/2) : smooth((state.hour-18)/3);
        const daylight = 1 - darkness;
        nodes.stars.style.opacity = darkness;
        nodes.moon.style.opacity = darkness;
        nodes.sun.style.opacity = daylight;
        const sunY = 125 * (1 - Math.sin(clamp((state.hour-6)/13,0,1)*Math.PI));
        nodes.sun.setAttribute('transform', 'translate(0 ' + sunY.toFixed(1) + ')');
        nodes['sun-reflection'].style.opacity = .3 + daylight*.7;
        nodes['lighthouse-light'].style.opacity = darkness * .5;
        nodes.headlight.style.opacity = darkness * .7;
        nodes['scene-shell'].classList.toggle('night', darkness > .55);
        const mode = currentMode();
        if (lastMode !== mode) {
          lastMode = mode;
          modes.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
          nodes['clock-icon'].setAttribute('href', mode === 'day' ? '#i-sun' : mode === 'sunset' ? '#i-sunset' : '#i-moon');
          nodes['scene-caption'].textContent = {day:'SEA BREEZE & EASY DAYS',sunset:'CHASE A LITTLE GOLDEN LIGHT',night:'UNDER THE SAME STARRY SKY'}[mode];
        }
        const minutes = Math.floor(state.hour * 60);
        const clock = String(Math.floor(minutes / 60) % 24).padStart(2,'0') + ':' + String(minutes % 60).padStart(2,'0');
        if (clock !== lastClock) { nodes['scene-clock'].textContent = clock; lastClock = clock; }
      }
      function updateStatus() {
        nodes['trip-state'].textContent = state.paused ? '停一停，风景不会走远' : state.speed === 0 ? '靠在海边，等一阵风' : state.speed >= 2 ? '和海风一起轻快前行' : '正在收集沿途的风景';
      }
      function setSpeed(value) {
        state.speed = clamp(Math.round(value*10)/10,0,3);
        nodes.speed.value = state.speed;
        nodes.speed.setAttribute('aria-valuetext', state.speed.toFixed(1) + ' 倍速');
        nodes['speed-value'].textContent = state.speed.toFixed(1) + ' ×';
        nodes.speed.style.background = 'linear-gradient(to right,var(--green) ' + state.speed/3*100 + '%,#e0e3d6 ' + state.speed/3*100 + '%)';
        updateStatus();
      }
      function setPaused(paused) {
        state.paused = paused;
        nodes['ride-icon'].setAttribute('href', paused ? '#i-play' : '#i-pause');
        nodes['ride-label'].textContent = paused ? '继续兜风' : '歇一小会';
        nodes['ride-button'].setAttribute('aria-label', paused ? '继续旅程' : '暂停旅程');
        updateStatus();
      }
      function setAutomatic(automatic) {
        state.automatic = automatic;
        nodes['auto-toggle'].setAttribute('aria-checked', String(automatic));
      }
      function chooseMode(mode) {
        setAutomatic(false);
        state.targetHour = {day:10,sunset:18,night:23}[mode];
        // Explicitly requested transitions also work while the ride is paused.
        if (reducedMotion.matches) { state.hour = state.targetHour; state.targetHour = null; updateEnvironment(); }
      }
      function drawRide() {
        const angle = state.pedal, degrees = angle * 180 / Math.PI;
        nodes['back-spokes'].setAttribute('transform','rotate(' + degrees*1.8 + ')');
        nodes['front-spokes'].setAttribute('transform','rotate(' + degrees*1.8 + ')');
        nodes.crank.setAttribute('transform','rotate(' + degrees + ' 566 411)');
        const px = 566 + Math.cos(angle)*24, py = 411 + Math.sin(angle)*24;
        const fx = 566 - Math.cos(angle)*24, fy = 411 - Math.sin(angle)*24;
        const bob = Math.sin(angle*2)*1.7;
        const leg = 'M551 ' + (312+bob) + 'Q' + (588+Math.cos(angle)*13) + ' ' + (353+Math.sin(angle)*7) + ' ' + px + ' ' + py;
        nodes['near-leg'].setAttribute('d',leg); nodes['near-leg-fill'].setAttribute('d',leg);
        nodes['far-leg'].setAttribute('d','M538 ' + (311+bob) + 'Q' + (525-Math.cos(angle)*12) + ' 355 ' + fx + ' ' + fy);
        nodes['near-foot'].setAttribute('transform','translate(' + px + ' ' + py + ')');
        nodes['far-foot'].setAttribute('transform','translate(' + fx + ' ' + fy + ')');
        nodes['pelican-body'].setAttribute('transform','translate(0 ' + bob + ')');
        const flutter = Math.sin(state.ambient*4 + state.travel*.015)*3*Math.min(state.speed,2);
        nodes['scarf-tail'].setAttribute('d','M572 218q-37 ' + (-10+flutter) + '-72 ' + (2+flutter) + 'l-26-6 11 17-9 10q42 ' + (-19-flutter) + ' 94-9Z');
        nodes['road-stripes'].setAttribute('transform','translate(' + -(state.travel%150) + ' 0)');
        nodes['road-pebbles'].setAttribute('transform','translate(' + -(state.travel%1200) + ' 0)');
        nodes['clouds-far'].setAttribute('transform','translate(' + -((state.ambient*2+state.travel*.018)%1320) + ' 0)');
        nodes['clouds-near'].setAttribute('transform','translate(' + -((state.ambient*3+state.travel*.035)%1320) + ' 0)');
        nodes['sea-texture'].setAttribute('transform','translate(' + -((state.ambient*6+state.travel*.08)%280) + ' ' + Math.sin(state.ambient*.7)*2 + ')');
        nodes['shore-wave'].setAttribute('transform','translate(0 ' + Math.sin(state.ambient*.8)*3 + ')');
        nodes.sailboat.setAttribute('transform','translate(' + (280-Math.sin(state.ambient*.035)*50) + ' ' + (288+Math.sin(state.ambient*1.3)*2) + ')');
        nodes.birds.setAttribute('transform','translate(' + Math.sin(state.ambient*.08)*18 + ' ' + Math.sin(state.ambient*.6)*3 + ')');
      }
      function tick(time) {
        const dt = lastTime === null ? 0 : Math.min((time-lastTime)/1000,.05);
        lastTime = time;
        if (!state.paused) {
          state.ambient += dt;
          state.pedal = (state.pedal + dt*state.speed*3.8) % (Math.PI*2);
          state.travel += dt*state.speed*115;
          state.distance += dt*state.speed*12/3600;
          nodes.distance.textContent = state.distance.toFixed(2);
          if (state.automatic && state.targetHour === null) state.hour = (state.hour + dt*.25) % 24;
        }
        if (state.targetHour !== null) {
          const difference = state.targetHour - state.hour;
          if (Math.abs(difference) < .01) { state.hour = state.targetHour; state.targetHour = null; }
          else state.hour += difference * Math.min(dt*5,1);
        }
        if (time-lastPaletteTime > 60 || lastPaletteTime < 0) { updateEnvironment(); lastPaletteTime = time; }
        drawRide();
        frameId = requestAnimationFrame(tick);
      }
      nodes.speed.addEventListener('input', event => setSpeed(Number(event.target.value)));
      nodes['ride-button'].addEventListener('click', () => setPaused(!state.paused));
      nodes['auto-toggle'].addEventListener('click', () => { setAutomatic(!state.automatic); notify(state.automatic ? '日夜流转已开启 · 96 秒走过一天' : '时光停在这一刻'); });
      modes.forEach(button => button.addEventListener('click', () => chooseMode(button.dataset.mode)));
      document.addEventListener('keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.repeat || /INPUT|BUTTON|TEXTAREA|SELECT|A/.test(event.target.tagName) || event.target.isContentEditable) return;
        if (event.code === 'Space') { event.preventDefault(); setPaused(!state.paused); }
        if (event.code === 'ArrowRight' || event.code === 'ArrowLeft') { event.preventDefault(); setSpeed(state.speed + (event.code === 'ArrowRight' ? .1 : -.1)); }
      });
      async function toggleSound() {
        if (audioBusy) return;
        audioBusy = true;
        try {
          if (!audioContext) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) throw new Error('Web Audio is unavailable');
            audioContext = new AudioContextClass();
            const length = audioContext.sampleRate*8;
            const buffer = audioContext.createBuffer(2,length,audioContext.sampleRate);
            for (let channel=0;channel<2;channel++) {
              const samples = buffer.getChannelData(channel); let brown = 0;
              for (let i=0;i<length;i++) { brown = (brown + (Math.random()*2-1)*.025)/1.025; samples[i] = brown * 3.8 * (.62+.3*Math.sin(i/length*Math.PI*4+channel*.4)); }
            }
            oceanSource = audioContext.createBufferSource(); oceanSource.buffer = buffer; oceanSource.loop = true;
            const filter = audioContext.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1100;
            audioGain = audioContext.createGain(); audioGain.gain.value = 0;
            oceanSource.connect(filter); filter.connect(audioGain); audioGain.connect(audioContext.destination); oceanSource.start();
          }
          await audioContext.resume();
          state.sound = !state.sound;
          audioGain.gain.setTargetAtTime(state.sound ? .32 : 0,audioContext.currentTime,.45);
          nodes['sound-button'].setAttribute('aria-pressed', String(state.sound));
          nodes['sound-button'].setAttribute('aria-label', state.sound ? '关闭海浪声音' : '开启海浪声音');
          nodes['sound-button'].title = state.sound ? '关闭海浪声音' : '开启海浪声音';
          nodes['sound-button'].querySelector('use').setAttribute('href', state.sound ? '#i-sound' : '#i-mute');
          nodes['sound-label'].textContent = state.sound ? '海风轻轻' : '听听海风';
        } catch (error) { notify('暂时无法播放海浪声音，请稍后再试'); }
        finally { audioBusy = false; }
      }
      nodes['sound-button'].addEventListener('click',toggleSound);
      document.addEventListener('visibilitychange', () => {
        cancelAnimationFrame(frameId); lastTime = null;
        if (document.hidden) { if (audioContext) audioContext.suspend().catch(() => {}); }
        else { frameId = requestAnimationFrame(tick); if (audioContext && state.sound) audioContext.resume().catch(() => {}); }
      });
      reducedMotion.addEventListener('change', event => { if (event.matches) setPaused(true); });
      setPaused(state.paused); setSpeed(1); updateEnvironment(); drawRide();
      frameId = requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
