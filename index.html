<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="在 Boopland，把片刻交给美好。翻开一个装着小游戏与小快乐的纸上世界。">
  <title>Boopland · 把片刻，交给美好</title>
  <style>
    :root { --paper: #f4f1e8; --ink: #344b3e; --green: #657d53; --muted: #7b8172; --line: #d6d9c9; --serif: "Iowan Old Style", "Palatino Linotype", "Noto Serif CJK SC", "Songti SC", "SimSun", serif; --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body { margin: 0; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; cursor: pointer; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--green); outline-offset: 6px; }
    [hidden] { display: none !important; }
    ::selection { background: #d5dfc3; color: var(--ink); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .paper-grain { position: fixed; inset: 0; z-index: 8; opacity: .2; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23000' filter='url(%23n)' opacity='.26' d='M0 0h180v180H0z'/%3E%3C/svg%3E"); }
    .ambient-light { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 72% 36%, #fffdf6 0, transparent 54%), radial-gradient(ellipse at 0 100%, #dfe3d333, transparent 50%); }
    #motes { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
    .page { position: relative; max-width: 1600px; min-height: 100svh; margin: auto; padding: 0 clamp(24px, 5.2vw, 84px); display: flex; flex-direction: column; }
    .site-header { min-height: 112px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--line); position: relative; z-index: 10; }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-icon { width: 35px; height: 39px; }
    .wordmark { font: 600 29px/1 Georgia, serif; letter-spacing: -1.4px; }
    .wordmark span { color: #acb18c; }
    .header-note { margin-left: auto; margin-right: 30px; font-family: var(--serif); font-size: 12px; letter-spacing: 2px; color: var(--muted); }
    .language { position: relative; }
    .language-toggle { display: flex; align-items: center; gap: 10px; border: 1px solid #c6ccba; border-radius: 30px; background: #f8f6ee; min-height: 43px; padding: 0 16px; font-size: 12px; transition: background .2s, box-shadow .2s; }
    .language-toggle:hover, .language-toggle[aria-expanded="true"] { background: #e9eddf; box-shadow: 0 3px 10px #344b3e08; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .chevron { width: 12px; height: 12px; transition: transform .25s; }
    [aria-expanded="true"] .chevron { transform: rotate(180deg); }
    .language-menu { position: absolute; right: 0; top: calc(100% + 14px); width: 290px; max-width: calc(100vw - 48px); border: 1px solid #d8dccb; border-radius: 16px 6px 16px 6px; background: #fbfaf4; padding: 18px 13px 12px; box-shadow: 0 16px 50px #344b3e1c, 3px 4px 0 #e8e8db; animation: menu-in .2s ease both; }
    .menu-heading { padding: 0 10px 13px; margin: 0; font-size: 11px; letter-spacing: 1px; color: var(--muted); border-bottom: 1px dashed var(--line); }
    .language-options { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; }
    .language-option { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 10px; border: 0; border-radius: 6px; background: transparent; text-align: left; font-size: 12px; }
    .language-option:hover { background: #eeeee4; }
    .language-option[aria-checked="true"] { background: #e5ebda; }
    .language-option[aria-checked="true"]::after { content: "✓"; color: var(--green); }
    .hero { flex: 1; display: grid; grid-template-columns: .94fr 1.06fr; align-items: center; gap: 10px; padding: 45px 0 34px; min-height: 610px; }
    .hero-copy { position: relative; z-index: 2; padding-bottom: 10px; }
    .eyebrow { display: flex; align-items: center; gap: 11px; color: var(--green); font-size: 10px; font-weight: 600; letter-spacing: 3px; margin: 0 0 30px; }
    .eyebrow::before { content: ""; width: 26px; height: 1px; background: #899775; }
    h1 { font-family: var(--serif); font-size: clamp(48px, 5.55vw, 82px); line-height: 1.36; letter-spacing: .035em; font-weight: 400; margin: 0; }
    .heading-line { display: block; }
    .heading-accent { color: var(--green); position: relative; width: fit-content; }
    .heading-accent::after { content: ""; position: absolute; left: 4%; bottom: 0; width: 83%; height: 9px; border-top: 1px solid #a2ae89; border-radius: 50%; transform: rotate(-3deg); opacity: .8; }
    .intro { margin: 30px 0 34px; color: #747d6d; font-size: 13px; line-height: 2.15; letter-spacing: 1.3px; max-width: 370px; }
    .intro span { display: block; }
    .entry-row { display: flex; align-items: center; gap: 25px; }
    .enter-link { position: relative; display: inline-flex; align-items: center; justify-content: space-between; gap: 26px; min-width: 216px; min-height: 80px; padding: 16px 22px 16px 34px; border: 1px solid #5f754e; border-radius: 48% 46% 46% 48% / 65% 65% 65% 65%; color: #fffcef; background: #657d53; text-decoration: none; box-shadow: 0 5px 0 #e0e3d3, 0 9px 18px #4c654914, inset 0 1px 0 #ffffff25; transition: transform .3s, background .3s, box-shadow .3s; isolation: isolate; }
    .enter-link::before { content: ""; position: absolute; inset: 5px; border: 1px solid #e6edcf3b; border-radius: inherit; pointer-events: none; }
    .enter-label { font-family: var(--serif); font-size: 27px; letter-spacing: .16em; }
    .enter-arrow { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid #e7efd345; border-radius: 50%; transition: transform .3s, background .3s; }
    .enter-arrow .icon { width: 23px; height: 23px; }
    .enter-link:hover { transform: translateY(-4px) rotate(-1deg); background: #566f46; box-shadow: 0 8px 0 #e0e3d3, 0 14px 24px #4c65491c; }
    .enter-link:hover .enter-arrow { transform: translateX(3px); background: #e6edcf18; }
    .enter-link:active { transform: translateY(2px); box-shadow: 0 2px 0 #e0e3d3; }
    .entry-note { display: flex; flex-direction: column; gap: 5px; transform: rotate(-7deg); color: #8f967d; }
    .entry-note svg { width: 49px; height: 25px; margin-left: 9px; fill: none; stroke: #929d7f; stroke-width: 1.15; stroke-linecap: round; }
    .entry-note span { font-family: var(--serif); font-size: 12px; font-style: italic; letter-spacing: .5px; }
    .micro-copy { color: #919782; font-size: 8px; letter-spacing: 2.2px; margin: 25px 0 0 6px; }
    .artwork { position: relative; width: calc(100% + 25px); margin-left: -10px; max-width: min(710px, calc(100svh - 285px)); justify-self: center; }
    .paper-world { display: block; width: 100%; height: auto; overflow: visible; }
    .art-caption { display: flex; align-items: center; justify-content: center; gap: 13px; margin: -5px 0 0; color: #899078; font-size: 9px; letter-spacing: 1.6px; }
    .art-caption::before, .art-caption::after { content: ""; height: 1px; width: 27px; background: #bdc5ac; }
    .art-caption span { font-family: var(--serif); font-size: 12px; font-style: italic; letter-spacing: .6px; }
    .parallax { transform: translate(calc(var(--mx, 0) * var(--depth, 8) * 1px), calc(var(--my, 0) * var(--depth, 8) * 1px)); transition: transform .55s cubic-bezier(.2,.6,.3,1); }
    .float-slow { animation: float-slow 7s ease-in-out infinite; }
    .float-plane { animation: float-plane 7s ease-in-out infinite; transform-origin: 548px 108px; }
    .float-leaf { animation: float-leaf 8s ease-in-out infinite; transform-origin: 88px 366px; }
    .float-star { animation: float-star 9s ease-in-out infinite; transform-origin: 105px 166px; }
    .cloud-a { animation: cloud-drift 16s ease-in-out infinite; }
    .cloud-b { animation: cloud-drift 21s ease-in-out -8s infinite reverse; }
    .boat { animation: boat-rock 5s ease-in-out infinite; transform-origin: 362px 368px; }
    .flower-sway { animation: flower-sway 5s ease-in-out infinite; transform-origin: 170px 465px; }
    .flower-sway-right { animation: flower-sway 6s ease-in-out -2s infinite reverse; transform-origin: 480px 484px; }
    .sun-rays { animation: sun-turn 80s linear infinite; transform-origin: 394px 188px; }
    .wind-line { stroke-dasharray: 8 7; animation: wind-travel 5s linear infinite; }
    .orbit-dot { animation: orbit 36s linear infinite; transform-origin: 330px 300px; }
    .spark { animation: twinkle 4s ease-in-out infinite; }
    .spark-late { animation-delay: -2s; }
    .bottom-note { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 20px 0 29px; }
    .little-note { display: flex; align-items: center; gap: 14px; }
    .note-flower { width: 32px; height: 32px; animation: tiny-turn 25s linear infinite; }
    .little-note p { margin: 0; font-family: var(--serif); font-size: 13px; letter-spacing: 1px; color: #707d64; }
    .note-rule { width: 58px; height: 1px; background: var(--line); }
    .edition { display: flex; align-items: center; gap: 13px; color: #8c937f; font-size: 8px; letter-spacing: 1.8px; }
    .edition-number { font: italic 24px/1 var(--serif); color: #899775; }
    .site-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-top: 1px solid var(--line); padding: 22px 0 25px; color: #969b88; font-size: 9px; letter-spacing: 1.6px; }
    .footer-center { font-family: var(--serif); font-style: italic; font-size: 12px; letter-spacing: .4px; }
    .motion-button { display: inline-flex; align-items: center; gap: 7px; border: 0; padding: 8px 0 8px 8px; margin: -8px 0; background: transparent; color: #737f67; font-size: 10px; letter-spacing: .6px; }
    .motion-button .icon { width: 16px; height: 16px; }
    .motion-button:hover { color: #344b3e; }
    .motion-button:disabled { cursor: default; }
    .motion-button[aria-pressed="true"] .wind-active, .motion-button[aria-pressed="false"] .wind-paused { display: none; }
    .reveal { animation: reveal-in 1s cubic-bezier(.2,.65,.3,1) both; }
    .hero-copy { animation-delay: .1s; }
    .artwork.reveal { animation-delay: .23s; }
    .bottom-note.reveal { animation-delay: .4s; }
    .page-wipe { position: fixed; inset: 0; z-index: 100; background: #e3e9d7; pointer-events: none; clip-path: circle(0 at var(--wipe-x, 30%) var(--wipe-y, 60%)); transition: clip-path .6s cubic-bezier(.65,0,.2,1); }
    .leaving .page-wipe { clip-path: circle(150vmax at var(--wipe-x, 30%) var(--wipe-y, 60%)); }
    .leaving .page { transition: opacity .4s, transform .5s; opacity: .35; transform: translateY(-8px); }
    .motion-paused *, .motion-paused *::before, .motion-paused *::after { animation-play-state: paused !important; }
    .motion-paused .reveal { animation: none; }
    .motion-paused .parallax { transform: none; transition: none; }
    .motion-paused .page-wipe { transition: none; }
    .background-paused * { animation-play-state: paused !important; }
    html:not([lang="zh-CN"]):not([lang="ja"]):not([lang="ko"]) h1 { font-size: clamp(46px, 4.6vw, 68px); letter-spacing: -.025em; line-height: 1.16; }
    html:not([lang="zh-CN"]):not([lang="ja"]):not([lang="ko"]) .heading-accent { font-style: italic; margin-top: .08em; }
    html[lang="ja"] h1, html[lang="ko"] h1 { font-size: clamp(40px, 4.4vw, 66px); letter-spacing: -.025em; }
    html[lang="ja"] .intro, html[lang="ko"] .intro { letter-spacing: .1px; }
    html:not([lang="zh-CN"]) .enter-label { font-size: 25px; letter-spacing: .04em; }
    @keyframes reveal-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes menu-in { from { opacity: 0; transform: translateY(-7px) rotate(-1deg); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float-slow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes float-plane { 0%,100% { transform: translate(0,0) rotate(-3deg); } 50% { transform: translate(10px,-13px) rotate(3deg); } }
    @keyframes float-leaf { 0%,100% { transform: translateY(0) rotate(-7deg); } 50% { transform: translate(5px,-13px) rotate(8deg); } }
    @keyframes float-star { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-12px) rotate(15deg); } }
    @keyframes cloud-drift { 0%,100% { transform: translateX(-9px); } 50% { transform: translateX(12px); } }
    @keyframes boat-rock { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
    @keyframes flower-sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
    @keyframes sun-turn { to { transform: rotate(360deg); } }
    @keyframes wind-travel { to { stroke-dashoffset: -90; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes tiny-turn { to { transform: rotate(360deg); } }
    @media (min-width: 1600px) { .hero { min-height: 700px; } }
    @media (max-width: 1100px) { .page { padding-inline: 36px; } .hero { min-height: 560px; padding-block: 40px; } .header-note { margin-right: 12px; } .entry-row { gap: 17px; } .enter-link { min-width: 196px; min-height: 74px; padding-left: 29px; } .entry-note span { font-size: 10px; } .intro { font-size: 12px; letter-spacing: .6px; } .artwork { width: calc(100% + 38px); margin-left: -20px; } .eyebrow { font-size: 9px; letter-spacing: 2.2px; } }
    @media (max-width: 760px) { .page { padding-inline: 26px; } .site-header { min-height: 88px; } .header-note { display: none; } .wordmark { font-size: 26px; } .brand-icon { width: 30px; height: 34px; } .hero { grid-template-columns: 1fr; gap: 2px; padding: 42px 0 18px; } .hero-copy { text-align: center; padding: 0; } .eyebrow { justify-content: center; margin-bottom: 20px; font-size: 9px; } .eyebrow::after { content: ""; width: 26px; height: 1px; background: #899775; } h1 { font-size: clamp(43px, 8.5vw, 65px); line-height: 1.3; letter-spacing: .05em; } .heading-accent { margin-inline: auto; } .intro { font-size: 12px; margin: 22px auto 25px; line-height: 2; max-width: 410px; } .entry-row { justify-content: center; gap: 0; } .enter-link { min-width: 206px; min-height: 72px; padding: 13px 20px 13px 30px; } .enter-label { font-size: 25px; } .entry-note { display: none; } .micro-copy { font-size: 7px; margin: 19px 0 0; letter-spacing: 2px; } .artwork { width: min(105%, 490px); max-width: none; margin: 1px 0 0; } .art-caption { margin-top: -14px; font-size: 8px; } .art-caption span { font-size: 11px; } .bottom-note { padding: 25px 0; gap: 15px; } .little-note { gap: 10px; } .little-note p { font-size: 11px; letter-spacing: .4px; } .note-flower { width: 25px; height: 25px; } .note-rule { display: none; } .edition { font-size: 7px; letter-spacing: 1px; gap: 7px; } .edition-number { font-size: 21px; } .site-footer { padding: 20px 0 25px; font-size: 7px; letter-spacing: 1px; } .footer-center { display: none; } .motion-button { font-size: 9px; letter-spacing: 0; } html:not([lang="zh-CN"]):not([lang="ja"]):not([lang="ko"]) h1 { font-size: clamp(42px, 8.5vw, 64px); } html[lang="ja"] h1, html[lang="ko"] h1 { font-size: clamp(36px, 7.6vw, 56px); } }
    @media (max-width: 380px) { .page { padding-inline: 20px; } .site-header { gap: 10px; } .language-toggle { padding-inline: 10px; gap: 6px; font-size: 11px; } .wordmark { font-size: 24px; } .brand { gap: 6px; } .brand-icon { width: 26px; } .hero { padding-top: 34px; } .edition-text { display: none; } .intro { font-size: 11px; } .eyebrow { letter-spacing: 1.5px; font-size: 8px; } h1 { font-size: 41px; } }
    @media (max-height: 700px) and (min-width: 761px) { .site-header { min-height: 86px; } .hero { min-height: 460px; padding: 18px 0; } .artwork { width: min(100%, 530px); } .eyebrow { margin-bottom: 19px; } h1 { font-size: 60px; } .intro { margin-block: 20px 25px; } .bottom-note { padding-block: 12px 20px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .parallax { transform: none; } .enter-link:hover, .leaving .page { transform: none; } }
  </style>
</head>
<body>
  <div class="ambient-light" aria-hidden="true"></div>
  <div class="paper-grain" aria-hidden="true"></div>
  <canvas id="motes" aria-hidden="true"></canvas>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Boopland 首页" id="brand-link">
        <svg class="brand-icon" viewBox="0 0 38 42" fill="none" aria-hidden="true"><path d="M18 35c-1-10 0-17 6-24" stroke="#657d53" stroke-width="1.5" stroke-linecap="round"/><path d="M21 20C17 10 24 5 33 6c0 9-5 16-12 14Z" fill="#a6b38c"/><path d="M18 27C9 28 4 20 6 13c9 1 15 6 12 14Z" fill="#708762"/><path d="m21 20 7-9M18 27l-8-9" stroke="#f4f1e8" stroke-width=".85"/><path d="M9 37q10 3 19-1" stroke="#bdc6ac" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="wordmark">boopland<span>.</span></span>
      </a>
      <span class="header-note" data-i18n="headerNote">给生活，留一点空白。</span>
      <div class="language" id="language-control">
        <button class="language-toggle" id="language-toggle" type="button" aria-expanded="false" aria-haspopup="menu" aria-controls="language-menu" aria-label="选择语言，当前为简体中文">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5h14M5 17.5h14"/></svg>
          <span id="current-language">简体中文</span><svg class="icon chevron" viewBox="0 0 14 14" aria-hidden="true"><path d="m3 5 4 4 4-4"/></svg>
        </button>
        <div class="language-menu" id="language-menu" hidden>
          <p class="menu-heading" id="language-heading" data-i18n="chooseLanguage">用熟悉的语言，遇见小美好</p>
          <div class="language-options" role="menu" aria-labelledby="language-heading">
            <button class="language-option" type="button" role="menuitemradio" aria-checked="true" data-lang="zh-CN" lang="zh-CN" tabindex="-1">简体中文</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="en" lang="en" tabindex="-1">English</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="ja" lang="ja" tabindex="-1">日本語</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="ko" lang="ko" tabindex="-1">한국어</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="fr" lang="fr" tabindex="-1">Français</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="de" lang="de" tabindex="-1">Deutsch</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="es" lang="es" tabindex="-1">Español</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="pt-BR" lang="pt-BR" tabindex="-1">Português</button>
          </div>
        </div>
      </div>
    </header>
    <main class="hero">
      <div class="hero-copy reveal">
        <p class="eyebrow" data-i18n="eyebrow">A SMALL ESCAPE, A LITTLE JOY</p>
        <h1><span class="heading-line" data-i18n="heading1">把片刻，</span><span class="heading-line heading-accent" data-i18n="heading2">交给美好。</span></h1>
        <p class="intro"><span data-i18n="intro1">生活有些匆忙，幸好这里有风。</span><span data-i18n="intro2">翻开这一页，让小小的快乐自然发生。</span></p>
        <div class="entry-row">
          <a class="enter-link" id="enter-link" href="./games.html"><span class="enter-label" data-i18n="enter">进入</span><span class="enter-arrow" aria-hidden="true"><svg class="icon" viewBox="0 0 26 26"><path d="M5 13h15m-6-6 6 6-6 6"/></svg></span></a>
          <div class="entry-note" aria-hidden="true"><span data-i18n="entryNote">一点好奇，刚刚好</span><svg viewBox="0 0 55 28"><path d="M51 4C45 21 24 25 5 15m7-3-8 2 5 7"/></svg></div>
        </div>
        <p class="micro-copy" data-i18n="microCopy">留一点时间，给无用而美好的事</p>
      </div>
      <div class="artwork reveal" id="artwork">
        <svg class="paper-world" viewBox="0 0 660 590" role="img" aria-labelledby="world-title world-desc">
          <title id="world-title">风里的纸上小世界</title><desc id="world-desc">层叠的纸雕山丘环抱一条小河，纸船轻轻摇晃。太阳、云朵、雏菊与纸飞机，在微风里慢慢浮动。</desc>
          <defs>

        $('motion-button').setAttribute('aria-pressed', String(paused));
        $('motion-label').textContent = translations[language][reducedMotion.matches ? 'reduced' : paused ? 'resume' : 'pause'];
        $('motion-button').disabled = reducedMotion.matches;
      }
      function setLanguage(next, announce = false) {
        language = Object.hasOwn(translations, next) ? next : 'zh-CN';
        const words = translations[language];
        root.lang = language;
        document.title = `Boopland · ${words.title}`;
        document.querySelector('meta[name="description"]').content = words.description;
        document.querySelectorAll('[data-i18n]').forEach(node => { node.textContent = words[node.dataset.i18n]; });
        $('current-language').textContent = words.name;
        languageToggle.setAttribute('aria-label', `${words.languageLabel} ${words.name}`);
        $('brand-link').setAttribute('aria-label', words.home);
        $('world-title').textContent = words.artTitle;
        $('world-desc').textContent = words.artDescription;
        languageOptions.forEach(option => option.setAttribute('aria-checked', String(option.dataset.lang === language)));
        updateMotionLabel();
        if (announce) { storage.set('boopland-language', language); $('language-status').textContent = words.changed; }
      }
      function closeLanguages(restoreFocus = false) {
        languageMenu.hidden = true;
        languageToggle.setAttribute('aria-expanded', 'false');
        if (restoreFocus) languageToggle.focus();
      }
      function openLanguages(last = false) {
        languageMenu.hidden = false;
        languageToggle.setAttribute('aria-expanded', 'true');
        (last ? languageOptions.at(-1) : languageOptions.find(option => option.dataset.lang === language)).focus();
      }
      languageToggle.addEventListener('click', () => languageMenu.hidden ? openLanguages() : closeLanguages(true));
      languageToggle.addEventListener('keydown', event => { if (event.key === 'ArrowDown' || event.key === 'ArrowUp') { event.preventDefault(); openLanguages(event.key === 'ArrowUp'); } });
      languageOptions.forEach(option => option.addEventListener('click', () => { setLanguage(option.dataset.lang, true); closeLanguages(true); }));
      languageMenu.addEventListener('keydown', event => {
        const index = languageOptions.indexOf(document.activeElement);
        let next;
        if (event.key === 'ArrowDown' || event.key === 'ArrowRight') next = (index + 1) % languageOptions.length;
        if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') next = (index - 1 + languageOptions.length) % languageOptions.length;
        if (event.key === 'Home') next = 0;
        if (event.key === 'End') next = languageOptions.length - 1;
        if (next !== undefined) { event.preventDefault(); languageOptions[next].focus(); }
        if (event.key === 'Tab') closeLanguages(true);
      });
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && !languageMenu.hidden) { event.preventDefault(); closeLanguages(true); } });
      document.addEventListener('pointerdown', event => { if (!$('language-control').contains(event.target)) closeLanguages(); });
      $('language-control').addEventListener('focusout', event => { if (event.relatedTarget && !$('language-control').contains(event.relatedTarget)) closeLanguages(); });

      const canvas = $('motes');
      const context = canvas.getContext('2d');
      let width = 0, height = 0, frameId = 0, lastTime = 0, particles = [];
      const pointer = { x: -1000, y: -1000 };
      function makeParticle(scattered = true) { return { x: Math.random() * width, y: scattered ? Math.random() * height : height + 10, size: 1 + Math.random() * 2.1, speed: 5 + Math.random() * 10, phase: Math.random() * Math.PI * 2, opacity: .13 + Math.random() * .2, life: -1 }; }
      function resizeCanvas() {
        width = innerWidth; height = innerHeight;
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        if (context) context.setTransform(dpr, 0, 0, dpr, 0, 0);
        particles = Array.from({ length: width < 760 ? 19 : 36 }, () => makeParticle());
      }
      function draw(time) {
        const dt = lastTime ? Math.min((time - lastTime) / 1000, .05) : 0;
        lastTime = time;
        context.clearRect(0, 0, width, height);
        particles = particles.filter(particle => particle.life !== 0);
        for (const particle of particles) {
          if (particle.life > 0) {
            particle.life = Math.max(0, particle.life - dt);
            particle.x += particle.vx * dt; particle.y += particle.vy * dt; particle.vy += 9 * dt;
          } else {
            particle.y -= particle.speed * dt;
            particle.x += Math.sin(time * .00035 + particle.phase) * 6 * dt;
            const dx = particle.x - pointer.x, dy = particle.y - pointer.y, distance = Math.hypot(dx, dy);
            if (distance < 110 && distance > 0) { particle.x += dx / distance * 18 * dt; particle.y += dy / distance * 18 * dt; }
            if (particle.y < -12) Object.assign(particle, makeParticle(false));
            if (particle.x < -20) particle.x = width + 10;
            if (particle.x > width + 20) particle.x = -10;
          }
          context.save(); context.translate(particle.x, particle.y); context.rotate(particle.phase + time * .00015);
          context.globalAlpha = particle.opacity * (particle.life > 0 ? Math.min(particle.life, 1) : 1);
          context.fillStyle = particle.life > 0 ? '#a9b582' : '#9da984';
          context.beginPath(); context.ellipse(0, 0, particle.size, particle.size * .48, 0, 0, Math.PI * 2); context.fill(); context.restore();
        }
        frameId = requestAnimationFrame(draw);
      }
      function syncMotion() {
        paused = userPaused || reducedMotion.matches;
        root.classList.toggle('motion-paused', paused);
        cancelAnimationFrame(frameId); lastTime = 0;
        if (context) { context.clearRect(0, 0, width, height); if (!paused && !document.hidden) frameId = requestAnimationFrame(draw); }
        updateMotionLabel();
      }
      $('motion-button').addEventListener('click', () => { userPaused = !userPaused; storage.set('boopland-motion', userPaused ? 'paused' : 'playing'); syncMotion(); });
      reducedMotion.addEventListener('change', syncMotion);
      window.addEventListener('resize', resizeCanvas, { passive: true });
      document.addEventListener('visibilitychange', () => { root.classList.toggle('background-paused', document.hidden); syncMotion(); });
      document.addEventListener('pointermove', event => {
        if (paused || !finePointer.matches || event.pointerType === 'touch') return;
        pointer.x = event.clientX; pointer.y = event.clientY;
        $('artwork').style.setProperty('--mx', ((event.clientX / innerWidth - .5) * 2).toFixed(3));
        $('artwork').style.setProperty('--my', ((event.clientY / innerHeight - .5) * 2).toFixed(3));
      }, { passive: true });
      document.documentElement.addEventListener('pointerleave', () => { pointer.x = pointer.y = -1000; $('artwork').style.setProperty('--mx', 0); $('artwork').style.setProperty('--my', 0); });
      document.addEventListener('pointerdown', event => {
        if (paused || !context || event.target.closest('button, a') || particles.length > 90) return;
        for (let i = 0; i < 9; i++) { const angle = Math.PI * 2 * i / 9; particles.push({ x: event.clientX, y: event.clientY, size: 2 + Math.random() * 2, phase: angle, opacity: .6, life: 1.6, vx: Math.cos(angle) * 25, vy: Math.sin(angle) * 25 - 12 }); }
      }, { passive: true });

      let navigating = false, navigationTimer;
      $('enter-link').addEventListener('click', event => {
        if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || paused) return;
        event.preventDefault();
        if (navigating) return;
        navigating = true;
        const bounds = $('enter-link').getBoundingClientRect();
        root.style.setProperty('--wipe-x', `${bounds.left + bounds.width / 2}px`);
        root.style.setProperty('--wipe-y', `${bounds.top + bounds.height / 2}px`);
        root.classList.add('leaving');
        navigationTimer = setTimeout(() => location.assign($('enter-link').href), 560);
      });
      window.addEventListener('pageshow', () => { clearTimeout(navigationTimer); navigating = false; root.classList.remove('leaving'); syncMotion(); });
      setLanguage(language); resizeCanvas(); syncMotion();
    })();
  </script>
</body>
</html>
