  <link rel="preload" href="./assets/fonts/huiwen-mincho-welcome.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: "Huiwen Mincho"; src: url("./assets/fonts/huiwen-mincho-welcome.woff2") format("woff2"); font-style: normal; font-weight: 400; font-display: swap; }
    :root { --paper: #f4f1e8; --ink: #344b3e; --green: #657d53; --muted: #7b8172; --line: #d6d9c9; --serif: "Huiwen Mincho", "Iowan Old Style", "Palatino Linotype", "Noto Serif CJK SC", "Songti SC", "SimSun", serif; --sans: "Huiwen Mincho", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

    button, a { -webkit-tap-highlight-color: transparent; }

    a { color: inherit; }

    .paper-grain { position: fixed; inset: 0; z-index: 8; opacity: .2; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23000' filter='url(%23n)' opacity='.26' d='M0 0h180v180H0z'/%3E%3C/svg%3E"); }
    .ambient-light { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 72% 36%, #fffdf6 0, transparent 54%), radial-gradient(ellipse at 0 100%, #dfe3d333, transparent 50%); }
    #motes { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
    /* Content can grow when text is enlarged; the illustration uses the remaining space. */
    .page { position: relative; max-width: 1440px; height: 100svh; height: 100dvh; margin: auto; padding: env(safe-area-inset-top, 0px) max(clamp(20px, 5vw, 72px), env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(clamp(20px, 5vw, 72px), env(safe-area-inset-left, 0px)); display: grid; grid-template-rows: auto minmax(min-content, 1fr) auto; }
    .site-header { min-height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); position: relative; z-index: 10; }

    .wordmark span { color: #acb18c; }
    .language { position: relative; }
    .language-toggle { display: flex; align-items: center; gap: 8px; border: 1px solid #c6ccba; border-radius: 30px; background: #f8f6ee; min-height: 44px; padding: 0 14px; font-size: 12px; transition: background .2s, box-shadow .2s; }
    .language-toggle:hover, .language-toggle[aria-expanded="true"] { background: #e9eddf; box-shadow: 0 3px 10px #344b3e08; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .chevron { width: 12px; height: 12px; transition: transform .25s; }

    .language-menu { position: absolute; right: 0; top: calc(100% + 8px); width: 280px; max-width: calc(100vw - 40px); max-height: calc(100svh - 90px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); max-height: calc(100dvh - 90px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; overscroll-behavior: contain; border: 1px solid #d8dccb; border-radius: 16px 6px 16px 6px; background: #fbfaf4; padding: 12px 10px; box-shadow: 0 16px 50px #344b3e1c, 3px 4px 0 #e8e8db; animation: menu-in .2s ease both; }
    .menu-heading { padding: 0 8px 10px; margin: 0; font-size: 11px; letter-spacing: .5px; color: var(--muted); border-bottom: 1px dashed var(--line); }
    .language-options { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 8px; }
    .language-option { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; font-size: 12px; }
    .language-option:hover { background: #eeeee4; }
    .language-option[aria-checked="true"] { background: #e5ebda; }
    .language-option[aria-checked="true"]::after { content: "✓"; color: var(--green); }
    .hero { display: grid; grid-template-areas: "copy art"; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); grid-template-rows: minmax(min-content, 1fr); gap: 28px 32px; min-height: 0; padding: clamp(16px, 3svh, 32px) 0; }
    .hero-copy { grid-area: copy; display: flex; flex-direction: column; gap: 28px; min-width: 0; align-self: center; }
    h1 { grid-area: copy; align-self: stretch; position: relative; z-index: 2; font-family: var(--serif); font-size: clamp(38px, min(4.8vw, 7.5svh), 68px); line-height: 1.16; letter-spacing: -.025em; font-weight: 400; margin: 0; overflow-wrap: anywhere; }
    .heading-line { display: block; }
    .heading-accent { color: var(--green); position: relative; width: fit-content; margin-top: .08em; }
    .heading-accent::after { content: ""; position: absolute; left: 4%; bottom: -5px; width: 83%; height: 7px; border-top: 1px solid #a2ae89; border-radius: 50%; transform: rotate(-3deg); opacity: .8; }
    html[lang="zh-CN"] .heading-brand { font-size: clamp(72px, min(8.8vw, 16svh), 120px); line-height: 1.12; letter-spacing: .06em; }
    html[lang="zh-CN"] .heading-accent { margin-top: 14px; padding-bottom: 7px; font-size: clamp(20px, min(2.4vw, 4.2svh), 32px); line-height: 1.5; letter-spacing: .02em; }
    html[lang="ja"] h1, html[lang="ko"] h1 { font-size: clamp(32px, min(4.2vw, 6.5svh), 56px); }
    html:not([lang="zh-CN"]):not([lang="ja"]):not([lang="ko"]) .heading-accent { font-style: italic; }
    .entry-row { grid-area: entry; align-self: start; position: relative; z-index: 2; display: flex; }
    .enter-link { --arrow-rest: -15px; position: relative; display: inline-flex; align-items: center; justify-content: space-between; gap: 24px; min-width: 180px; min-height: 80px; max-width: 100%; padding: 8px 12px 8px 0; border-radius: 3px 44px 44px 3px; color: var(--ink); text-decoration: none; transition: transform .28s ease; }
    .enter-label { font-family: var(--serif); font-size: 26px; line-height: 1.2; letter-spacing: .22em; white-space: nowrap; transition: color .28s ease; }
    html:not([lang="zh-CN"]) .enter-label { letter-spacing: .03em; }
    .enter-arrow { position: relative; display: grid; place-items: center; flex-shrink: 0; width: 64px; height: 64px; border-radius: 49% 51% 48% 52%; background: #e1e7d5; color: #4e6546; transition: background-color .32s ease, color .32s ease, box-shadow .32s ease; }
    .enter-orbit { position: absolute; width: 88px; height: 88px; fill: none; stroke: #9aa98a; stroke-width: .85; stroke-linecap: round; overflow: visible; pointer-events: none; transition: transform .4s ease, opacity .32s ease; }
    .enter-orbit path:first-child { opacity: .75; }
    .enter-orbit path:last-child { opacity: .45; }
    .enter-arrow .icon { position: relative; width: 76px; height: 24px; stroke-width: 1.35; transform: translateX(var(--arrow-rest)); transition: transform .32s cubic-bezier(.2,.65,.3,1); }
    @media (hover: hover) and (pointer: fine) {
      .enter-link:hover { transform: translateY(-2px); }
      .enter-link:hover .enter-label { color: #5b7352; }
      .enter-link:hover .enter-arrow { background: #d0ddc1; color: #3e5536; box-shadow: 0 6px 14px #344b3e0d; }
      .enter-link:hover .enter-arrow .icon { transform: translateX(-8px); }
      .enter-link:hover .enter-orbit { transform: rotate(12deg) scale(1.06); opacity: .7; }
    }
    .enter-link:focus-visible { outline: 2px solid var(--green); outline-offset: 7px; }
    .enter-link:focus-visible .enter-arrow { background: #d0ddc1; color: #3e5536; }
    .enter-link:active { transform: translateY(1px); }
    .enter-link:active .enter-arrow { background: #c3d2b3; color: #344b3e; box-shadow: none; }
    .artwork { grid-area: art; position: relative; z-index: 1; width: 100%; height: 100%; min-width: 0; min-height: 0; max-width: 640px; justify-self: center; align-self: stretch; }
    .paper-world { position: absolute; inset: 0; display: block; width: 100%; height: 100%; min-height: 0; overflow: visible; }
    .site-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; border-top: 1px solid var(--line); color: #899078; font-size: 9px; letter-spacing: 1.2px; }
    .motion-button { display: inline-flex; align-items: center; justify-content: flex-end; gap: 7px; min-width: 44px; min-height: 44px; border: 0; padding: 6px 0 6px 10px; background: transparent; color: #737f67; font-size: 11px; letter-spacing: .3px; text-align: right; }
    .motion-button .icon { width: 16px; height: 16px; }
    .motion-button:hover { color: #344b3e; }
    .motion-button:disabled { cursor: default; }
    .motion-button[aria-pressed="true"] .wind-active, .motion-button[aria-pressed="false"] .wind-paused { display: none; }
    .reveal { animation: reveal-in .8s cubic-bezier(.2,.65,.3,1) both; }
    .hero-heading { animation-delay: .05s; }
    .entry-row.reveal { animation-delay: .2s; }
    .parallax { transform: translate(calc(var(--mx, 0) * var(--depth, 8) * 1px), calc(var(--my, 0) * var(--depth, 8) * 1px)); transition: transform .55s cubic-bezier(.2,.6,.3,1); }
    .float-slow { animation: float-slow 7s ease-in-out infinite; }
    .float-plane { animation: float-plane 7s ease-in-out infinite; transform-origin: 548px 108px; }
    .float-leaf { animation: float-leaf 8s ease-in-out infinite; transform-origin: 88px 366px; }
    .float-star { animation: float-star 9s ease-in-out infinite; transform-origin: 105px 166px; }
    .cloud-a { animation: cloud-drift 16s ease-in-out infinite; }
    .cloud-b { animation: cloud-drift 21s ease-in-out -8s infinite reverse; }
    .boat { animation: boat-rock 5s ease-in-out infinite; transform-origin: 362px 368px; }
    .flower-sway { animation: flower-sway 5s ease-in-out infinite; transform-origin: 170px 465px; }
    .flower-sway-right { animation: flower-sway 6s ease-in-out -2s infinite reverse; transform-origin: 480px 484px; }
    .sun-rays { animation: sun-turn 80s linear infinite; transform-origin: 394px 188px; }
    .wind-line { stroke-dasharray: 8 7; animation: wind-travel 5s linear infinite; }
    .orbit-dot { animation: orbit 36s linear infinite; transform-origin: 330px 300px; }
    .spark { animation: twinkle 4s ease-in-out infinite; }
    .spark-late { animation-delay: -2s; }
    .page-wipe { position: fixed; inset: 0; z-index: 100; background: #e3e9d7; pointer-events: none; clip-path: circle(0 at var(--wipe-x, 30%) var(--wipe-y, 60%)); transition: clip-path .6s cubic-bezier(.65,0,.2,1); }
    .leaving .page-wipe { clip-path: circle(150vmax at var(--wipe-x, 30%) var(--wipe-y, 60%)); }
    .leaving .page { transition: opacity .4s, transform .5s; opacity: .35; transform: translateY(-8px); }
    .motion-paused *, .motion-paused *::before, .motion-paused *::after { animation-play-state: paused !important; }
    .motion-paused .reveal { animation: none; }
    .motion-paused .parallax { transform: none; transition: none; }
    .motion-paused .page-wipe { transition: none; }
    .background-paused * { animation-play-state: paused !important; }
    @keyframes reveal-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes menu-in { from { opacity: 0; transform: translateY(-7px) rotate(-1deg); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float-slow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes float-plane { 0%,100% { transform: translate(0,0) rotate(-3deg); } 50% { transform: translate(10px,-13px) rotate(3deg); } }
    @keyframes float-leaf { 0%,100% { transform: translateY(0) rotate(-7deg); } 50% { transform: translate(5px,-13px) rotate(8deg); } }
    @keyframes float-star { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-12px) rotate(15deg); } }
    @keyframes cloud-drift { 0%,100% { transform: translateX(-9px); } 50% { transform: translateX(12px); } }
    @keyframes boat-rock { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
    @keyframes flower-sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
    @keyframes sun-turn { to { transform: rotate(360deg); } }
    @keyframes wind-travel { to { stroke-dashoffset: -90; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (max-width: 760px) {
      .site-header { min-height: 64px; gap: 12px; }
      .hero-copy { display: contents; }
      .hero { grid-template-areas: "copy" "art" "entry"; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; padding: clamp(12px, 2svh, 24px) 0; }
      h1 { align-self: center; text-align: center; font-size: clamp(30px, 5.8svh, 48px); }
      .heading-accent { margin-inline: auto; }
      html[lang="zh-CN"] .heading-brand { font-size: clamp(56px, 11svh, 96px); }
      html[lang="zh-CN"] .heading-accent { margin-top: 10px; font-size: clamp(18px, 3svh, 26px); }
      html[lang="ja"] h1, html[lang="ko"] h1 { font-size: clamp(26px, 5svh, 40px); }
      .artwork { max-width: 400px; }
      .entry-row { justify-content: center; }
      .enter-link { min-width: 168px; min-height: 72px; }
      .enter-arrow { width: 56px; height: 56px; }
      .enter-orbit { width: 80px; height: 80px; }
      .site-footer { min-height: 48px; font-size: 8px; letter-spacing: 1px; }
      #motion-label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    }
    @media (max-width: 380px) {
      .page { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
      .brand { gap: 6px; }
      .brand-icon { width: 26px; height: 30px; }
      .wordmark { font-size: 23px; }
      .language-toggle { padding-inline: 10px; gap: 6px; font-size: 11px; }
    }
    /* Short landscape screens keep the illustration beside the copy and entry. */
    @media (max-height: 520px) and (min-width: 480px) {
      .site-header { min-height: 56px; }
      .hero-copy { display: flex; gap: 14px; }
      .hero { grid-template-areas: "copy art"; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(min-content, 1fr); gap: 14px 24px; padding: 10px 0; }
      h1 { align-self: stretch; text-align: left; font-size: clamp(26px, min(4.8vw, 9svh), 42px); }
      .heading-accent { margin-inline: 0; }
      html[lang="zh-CN"] .heading-brand { font-size: clamp(48px, min(10vw, 19svh), 84px); }
      html[lang="zh-CN"] .heading-accent { margin-top: 8px; font-size: clamp(16px, min(2.6vw, 5svh), 22px); }
      html[lang="ja"] h1, html[lang="ko"] h1 { font-size: clamp(24px, min(4.2vw, 8svh), 36px); }
      .entry-row { justify-content: flex-start; }
      .enter-link { --arrow-rest: -13px; min-width: 152px; min-height: 52px; padding: 4px 8px 4px 0; }
      .enter-label { font-size: 22px; }
      .enter-arrow { width: 44px; height: 44px; }
      .enter-orbit { width: 64px; height: 64px; }
      .enter-arrow .icon { width: 64px; height: 22px; }
      .site-footer { min-height: 44px; }
    }
    /* Preserve readable text and controls when there is no room for the artwork. */
    @media (max-width: 479px) and (max-height: 480px) {
      .artwork { display: none; }
      .hero { grid-template-areas: "copy" "entry"; grid-template-rows: auto auto; align-content: center; gap: 20px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .parallax { transform: none; } .enter-link:hover, .enter-link:active, .enter-link:hover .enter-orbit, .leaving .page { transform: none; } .enter-link:hover .enter-arrow .icon { transform: translateX(var(--arrow-rest)); } }
  </style>

<body>
  <div class="ambient-light" aria-hidden="true"></div>
  <div class="paper-grain" aria-hidden="true"></div>
  <canvas id="motes" aria-hidden="true"></canvas>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Boopland 首页" id="brand-link">
        <svg class="brand-icon" viewBox="0 0 38 42" fill="none" aria-hidden="true"><path d="M18 35c-1-10 0-17 6-24" stroke="#657d53" stroke-width="1.5" stroke-linecap="round"/><path d="M21 20C17 10 24 5 33 6c0 9-5 16-12 14Z" fill="#a6b38c"/><path d="M18 27C9 28 4 20 6 13c9 1 15 6 12 14Z" fill="#708762"/><path d="m21 20 7-9M18 27l-8-9" stroke="#f4f1e8" stroke-width=".85"/><path d="M9 37q10 3 19-1" stroke="#bdc6ac" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="wordmark">boopland<span>.</span></span>
      </a>
      <div class="language" id="language-control">
        <button class="language-toggle" id="language-toggle" type="button" aria-expanded="false" aria-haspopup="menu" aria-controls="language-menu" aria-label="选择语言，当前为简体中文">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5h14M5 17.5h14"/></svg>
          <span id="current-language">简体中文</span><svg class="icon chevron" viewBox="0 0 14 14" aria-hidden="true"><path d="m3 5 4 4 4-4"/></svg>
        </button>
        <div class="language-menu" id="language-menu" hidden>
          <p class="menu-heading" id="language-heading" data-i18n="chooseLanguage">用熟悉的语言，遇见小美好</p>

            <button class="language-option" type="button" role="menuitemradio" aria-checked="true" data-lang="zh-CN" lang="zh-CN" tabindex="-1">简体中文</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="en" lang="en" tabindex="-1">English</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="ja" lang="ja" tabindex="-1">日本語</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="ko" lang="ko" tabindex="-1">한국어</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="fr" lang="fr" tabindex="-1">Français</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="de" lang="de" tabindex="-1">Deutsch</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="es" lang="es" tabindex="-1">Español</button>
            <button class="language-option" type="button" role="menuitemradio" aria-checked="false" data-lang="pt-BR" lang="pt-BR" tabindex="-1">Português</button>
          </div>
        </div>
      </div>
    </header>
    <main class="hero">
      <div class="hero-copy">
        <h1 class="hero-heading reveal"><span class="heading-line heading-brand" data-i18n="heading1">噗通</span><span class="heading-line heading-accent" data-i18n="heading2">是快乐落进心里的声音</span></h1>
        <div class="entry-row reveal">
          <a class="enter-link" id="enter-link" href="./games.html">
            <span class="enter-label" data-i18n="enter">进入</span>
            <span class="enter-arrow" aria-hidden="true">
              <svg class="enter-orbit" viewBox="0 0 88 88"><path d="M78 42c1 20-14 36-34 36S9 64 10 44 24 10 44 10s33 13 34 32Z"/><path d="M12 21C24 5 49 2 66 13M72 73c-13 10-32 13-48 5"/></svg>
              <svg class="icon" viewBox="0 0 76 24"><path d="M3 12c22-.7 46-.5 68 0M63 5l8 7-8 7"/></svg>
            </span>
          </a>
        </div>
      </div>
      <div class="artwork" id="artwork">
        <svg class="paper-world" width="660" height="590" viewBox="0 0 660 590" role="img" aria-labelledby="world-title world-desc">
          <title id="world-title">风里的纸上小世界</title><desc id="world-desc">层叠的纸雕山丘环抱一条小河，纸船轻轻摇晃。太阳、云朵、雏菊与纸飞机，在微风里慢慢浮动。</desc>
          <defs>
            <filter id="paper-shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#596144" flood-opacity=".14"/></filter>
            <filter id="layer-shadow" x="-25%" y="-25%" width="160%" height="165%"><feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="#45563c" flood-opacity=".17"/></filter>

      const canvas = $('motes');

      document.documentElement.addEventListener('pointerleave', () => { pointer.x = pointer.y = -1000; $('artwork').style.setProperty('--mx', 0); $('artwork').style.setProperty('--my', 0); });
      document.addEventListener('pointerdown', event => {
        if (paused || !context || event.target.closest('button, a') || particles.length > 90) return;
        for (let i = 0; i < 9; i++) { const angle = Math.PI * 2 * i / 9; particles.push({ x: event.clientX, y: event.clientY, size: 2 + Math.random() * 2, phase: angle, opacity: .6, life: 1.6, vx: Math.cos(angle) * 25, vy: Math.sin(angle) * 25 - 12 }); }
      }, { passive: true });

      let navigating = false, navigationTimer;
      $('enter-link').addEventListener('click', event => {
        if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || paused) return;
        event.preventDefault();
        if (navigating) return;
        navigating = true;
        const bounds = $('enter-link').getBoundingClientRect();
        root.style.setProperty('--wipe-x', `${bounds.left + bounds.width / 2}px`);
        root.style.setProperty('--wipe-y', `${bounds.top + bounds.height / 2}px`);
        root.classList.add('leaving');
        navigationTimer = setTimeout(() => location.assign($('enter-link').href), 560);
      });
      window.addEventListener('pageshow', () => { clearTimeout(navigationTimer); navigating = false; root.classList.remove('leaving'); syncMotion(); });
      setLanguage(language); resizeCanvas(); syncMotion();
    })();
  </script>
</body>
</html>
